# 権限の表(人がレビューする)
#
# 「誰が・どの API を・叩いたら・どうなるべきか」の答え。このファイルの変更は危険度「高」(2人で見る)。
# コードの中身より、この1行を見るほうが速く確実に「誰に何を許したか」が分かる。
#
# CI で2つのことを確かめる(apps/api/test):
#   ① OpenAPI の全 API がこの表にあるか               … authz-coverage.test.ts(DB 不要)
#   ② 表の全行を、各ロール+他社+未ログインで実際に叩く … authz-matrix.int.test.ts(Postgres)
#
# 書き方:
#   route      … `メソッド パス`(OpenAPI と同じ形)
#   permission … src/authz/policy.ts の権限の名前(public = ログイン不要)。食い違うとテストが落ちる
#   expect     … 返るべき HTTP ステータス
#     admin / member / viewer … 自社のその役割の人
#     other_tenant            … 別の組織の admin(一番強い人)。**他社の物は必ず 404**(存在を漏らさない)
#     anonymous               … ログインしていない
#   body       … 送る本文(書き込みの API だけ)
#   only_in    … その認証の方式のときだけある API(②では叩かない。単体テストで確かめる)
#
# パスの {projectId} / {taskId} は、テストが毎回作る「自社のプロジェクトとタスク」に置き換わる。

routes:
  - route: GET /api/auth/options
    permission: public
    note: ログインの方式(dev / cognito)。画面がログインとログアウトの出し方を決める
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 200 }

  - route: POST /api/auth/dev-login
    permission: public
    note: 開発環境(local / test / preview)だけにある
    body: { email: "{adminEmail}" }
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 200 }

  - route: POST /api/auth/login
    permission: public
    only_in: cognito
    note: メールとパスワードでログイン。どちらが違ったかは言わない(401 は同じ文)。流れは cognito-login.int.test.ts
    body: { email: "nobody@example.test", password: "Wrong-Password-1" }
    expect: { admin: 401, member: 401, viewer: 401, anonymous: 401 }

  - route: POST /api/auth/mfa
    permission: public
    only_in: cognito
    note: 二段階認証のコード。途中の札(Cookie)が無ければ 401。流れは cognito-login.int.test.ts
    body: { code: "123456" }
    expect: { admin: 401, member: 401, viewer: 401, anonymous: 401 }

  - route: POST /api/auth/sign-up
    permission: public
    only_in: cognito
    note: 登録。もう登録されているメールでも同じ答え(登録の有無が分からない)。流れは cognito-login.int.test.ts
    body: { email: "new@example.test", password: "Short" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/auth/confirm-sign-up
    permission: public
    only_in: cognito
    note: 登録の確認コード。流れは cognito-login.int.test.ts
    body: { email: "new@example.test", code: "000000" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/auth/resend-code
    permission: public
    only_in: cognito
    note: 確認コードの送り直し。いない人にも同じ答え。流れは cognito-login.int.test.ts
    body: { email: "nobody@example.test" }
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 200 }

  - route: POST /api/auth/forgot-password
    permission: public
    only_in: cognito
    note: パスワードの再設定のコード。いない人にも同じ答え。流れは cognito-login.int.test.ts
    body: { email: "nobody@example.test" }
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 200 }

  - route: POST /api/auth/reset-password
    permission: public
    only_in: cognito
    note: 再設定のコードと新しいパスワード。流れは cognito-login.int.test.ts
    body: { email: "nobody@example.test", code: "000000", password: "New-Password-777" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/auth/logout
    permission: public
    expect: { admin: 204, member: 204, viewer: 204, anonymous: 204 }

  # 公開の LP(apps/site)の入口(docs/specs/0025-public-landing-page.md)。ログインに関わらず同じ答え。
  # テナントはリクエストから決めず、設定の運営の組織(SUPPORT_TENANT_ID)に固定。公開の LP の URL(PUBLIC_SITE_URL)が
  # 無ければ全部 404。ここでは入力の誤り(同意が無い・token が無い)で 400 を確かめる。流れは growth-public.int.test.ts
  - route: POST /api/public/pre-registrations
    permission: public
    note: 事前登録。同意のチェック(consent true)が無ければ 400。登録の有無に関わらず同じ答え(204)
    body: { email: "lead@example.test", organizationName: "サンプル商事(架空)", consentTextVersion: 1 }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/public/pre-registrations/confirm
    permission: public
    note: 確認のリンク(公開のページが # の後ろの token を送る)。期限切れ・合わない token は 400
    body: {}
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/public/pre-registrations/withdraw
    permission: public
    note: 取り消しのリンク(登録を消す)。無い登録でも同じ答え(204)
    body: {}
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: POST /api/public/lp-views
    permission: public
    note: 見た数に1足す(Cookie を使わない・path と UTM だけ)
    body: { path: 1 }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: GET /api/me
    permission: me:read
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 401 }

  - route: GET /api/projects
    permission: project:read
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 401 }

  - route: POST /api/projects
    permission: project:create
    body: { name: "表から作ったプロジェクト" }
    expect: { admin: 201, member: 201, viewer: 403, anonymous: 401 }

  - route: GET /api/projects/{projectId}
    permission: project:read
    expect: { admin: 200, member: 200, viewer: 200, other_tenant: 404, anonymous: 401 }

  - route: DELETE /api/projects/{projectId}
    permission: project:delete
    expect: { admin: 204, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: GET /api/projects/{projectId}/tasks
    permission: task:read
    expect: { admin: 200, member: 200, viewer: 200, other_tenant: 404, anonymous: 401 }

  - route: POST /api/projects/{projectId}/tasks
    permission: task:write
    body: { title: "表から足したタスク" }
    expect: { admin: 201, member: 201, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: PATCH /api/tasks/{taskId}
    permission: task:write
    body: { done: true }
    expect: { admin: 200, member: 200, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: DELETE /api/tasks/{taskId}
    permission: task:write
    expect: { admin: 204, member: 204, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: GET /api/audit-events
    permission: audit:read
    note: 自社の監査ログ(docs/specs/0003-audit-log.md)。誰が何をしたかが分かるので管理者だけ。他社の分は RLS で見えない
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: GET /api/support-grants
    permission: support_grant:manage
    note: サポートへの許可の一覧(docs/specs/0004-support-access.md)。番号は出ない
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/support-grants
    permission: support_grant:manage
    note: サポートに見せるのを許可する。番号はこの応答にだけ出る
    body: { hours: 24 }
    expect: { admin: 201, member: 403, viewer: 403, anonymous: 401 }

  - route: DELETE /api/support-grants/{grantId}
    permission: support_grant:manage
    note: 許可を取り消す。入っている社員も次のリクエストから入れない
    expect: { admin: 204, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: GET /api/invitations
    permission: invitation:manage
    note: 招待の一覧(docs/specs/0027-invitations.md)。誰を組織に入れるかなので管理者だけ
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/invitations
    permission: invitation:manage
    note: 人を招く(招待のメールが届く)。ほかの組織にいる人かは確かめない(受けるときに止まる)
    body: { email: "{inviteeEmail}", role: member }
    expect: { admin: 201, member: 403, viewer: 403, anonymous: 401 }

  - route: DELETE /api/invitations/{invitationId}
    permission: invitation:manage
    note: 招待を取り消す(リンクはすぐ使えなくなる)
    expect: { admin: 204, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: POST /api/invitations/accept
    permission: public
    note: 招かれた人がログインの前に受ける。組織はリンクの札が指す招待で決まる。署名・期限・使用済み・取り消しのどれが違っても同じ 400。受ける流れは invitations.int.test.ts
    body: { token: "not-a-token", name: "誰か" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 400 }

  - route: GET /api/organization/plan
    permission: plan:read
    note: この組織のプラン・人数の上限・いる人と受けていない招待の数(docs/specs/0047-plans.md)。契約の中身なので管理者だけ。変えるのは運営のコマンドだけ
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/support/sessions
    permission: support:start
    note: 社員がサポート番号で入る。運営の組織(SUPPORT_TENANT_ID)の人でなければ 403。入れることは support-access.int.test.ts で確かめる
    body: { code: "AAAA-BBBB-CCCC" }
    expect: { admin: 403, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/support/end
    permission: support:end
    note: 社員が代理を終える。代理の最中でなければ 400。流れは support-access.int.test.ts
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/exports
    permission: export:create
    note: 自社のデータを1つの JSON で書き出す(docs/specs/0005-offboarding.md)。組織の全データが出るので管理者だけ。書き出したことは監査ログに残る
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  # ── アカウントの安全(docs/specs/0006-account-security.md) ─────────────────────────────
  # 本人のアカウント: 対象はいつもセッションの本人だけ(パスに人の ID が無いので、他社の物を指す道が無い)。
  # 代理の社員(閲覧者に固定)でも 403(policy.ts の NOT_DURING_SUPPORT。support-access.int.test.ts)。
  # 流れは account-security.int.test.ts(偽物の Cognito)。

  - route: GET /api/account
    permission: account:manage
    only_in: cognito
    note: 本人のメール・二段階認証・申し込み中のメール・組織の必須
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 401 }

  - route: POST /api/account/reauth
    permission: account:manage
    only_in: cognito
    note: パスワード(と、有効ならコード)を入れ直す。違えば 400 reauth_failed(401 にしない。ログインは切れていない)
    body: { password: "Wrong-Password-1" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/password
    permission: account:manage
    only_in: cognito
    note: パスワードを変える(いまのパスワードを確かめる)。ほかの端末は切れる
    body: { currentPassword: "Wrong-Password-1", newPassword: "New-Password-777" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/email
    permission: account:manage
    only_in: cognito
    note: メールの変更の申し込み。確かめ直しの札が要る(無ければ 400 reauth_required)
    body: { newEmail: "new@example.test" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/email/confirm
    permission: account:manage
    only_in: cognito
    note: 新しいアドレスに届いた確認コードで替える。古いアドレスにお知らせ
    body: { code: "000000" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/mfa/setup
    permission: account:manage
    only_in: cognito
    note: 二段階認証の鍵を作る。確かめ直しの札が要る
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/mfa/enable
    permission: account:manage
    only_in: cognito
    note: 認証アプリのコードで有効にする。確かめ直しの札が要る
    body: { code: "000000" }
    expect: { admin: 400, member: 400, viewer: 400, anonymous: 401 }

  - route: POST /api/account/mfa/disable
    permission: account:manage
    only_in: cognito
    note: パスワードといまのコードで外す。組織が必須なら 403。まだ有効でなければ 409
    body: { password: "Wrong-Password-1", code: "000000" }
    expect: { admin: 409, member: 409, viewer: 409, anonymous: 401 }

  - route: GET /api/organization/mfa-requirement
    permission: mfa_requirement:manage
    note: 組織の二段階認証の必須の状態と、まだ設定していない人の数(名前は出さない)。管理者だけ
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/organization/mfa-requirement
    permission: mfa_requirement:manage
    note: 全員に必須にする。Cognito のときは自分が設定済みでなければ 409(この表は開発用ログインで叩くので 204)。すぐ効く
    expect: { admin: 204, member: 403, viewer: 403, anonymous: 401 }

  - route: DELETE /api/organization/mfa-requirement
    permission: mfa_requirement:manage
    note: 必須を切る。運営の組織では切れない(409。account-security.int.test.ts)
    expect: { admin: 204, member: 403, viewer: 403, anonymous: 401 }

  # ── 大きなお客さん向けの守りの段1a(docs/specs/0056-sso-scim-ip-audit-export.md) ───────────────
  # どれも管理者だけ。代理の社員(閲覧者に固定)も 403。
  # ドメインと IP の範囲はプランの機能(sso・ip-allowlist)。キットの既定のプランには入れない(設計書 0056 の U-6)ので、
  # この表の組織では管理者でも 404。機能を入れた組織での流れ・他社の物の 404 は organization-security.int.test.ts。

  - route: GET /api/organization/domains
    permission: sso:manage
    note: 会社のドメインと、DNS に置く確かめのレコード。プランの機能 sso が入っていなければ 404
    expect: { admin: 404, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/organization/domains
    permission: sso:manage
    note: 会社のドメインを登録する(DNS で確かめるまで使えない)。同じ組織に同じドメインは 409
    body: { domain: example.com }
    expect: { admin: 404, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/organization/domains/{domainId}/verify
    permission: domain:verify
    note: DNS の TXT を見て確かめる(外を待つので関所のトランザクションの外)。見えなければ 409 domain_not_verified・ほかの組織が確かめ済みなら 409 domain_taken
    expect: { admin: 404, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: DELETE /api/organization/domains/{domainId}
    permission: sso:manage
    note: 会社のドメインを消す
    expect: { admin: 404, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  - route: GET /api/organization/ip-allowlist
    permission: ip_allowlist:manage
    note: 組織に入れる IP の範囲(空なら制限しない)と、いまの IP。プランの機能 ip-allowlist が入っていなければ 404
    expect: { admin: 404, member: 403, viewer: 403, anonymous: 401 }

  - route: PUT /api/organization/ip-allowlist
    permission: ip_allowlist:manage
    note: 一覧ごと入れ替える(20 まで)。いまの IP を含まない一覧は 409 allowlist_excludes_you(自分を締め出さない)。すぐ効く
    body: { cidrs: [] }
    expect: { admin: 404, member: 403, viewer: 403, anonymous: 401 }

  - route: GET /api/organization/members
    permission: member:manage
    note: 組織の人(古い順に1ページずつ)。強制ログアウトする人を選ぶ。全部の組織で使える
    expect: { admin: 200, member: 403, viewer: 403, anonymous: 401 }

  - route: POST /api/organization/members/{memberId}/sign-out
    permission: member:manage
    note: その人のこの組織のセッションを全部切る(sessions_valid_after を今に。次のリクエストから 401)。他社の人は 404
    expect: { admin: 204, member: 403, viewer: 403, other_tenant: 404, anonymous: 401 }

  # ── 利用規約・プライバシーポリシーへの同意(docs/specs/0009-legal-consent.md) ─────────────────
  # 対象はいつもセッションの本人だけ(パスに人の ID が無いので、他社の物を指す道が無い)。
  # 代理の社員(閲覧者に固定)でも 403(policy.ts の NOT_DURING_SUPPORT。support-access.int.test.ts)。
  # 同意し直しが要る版に同意していない人でも通る(policy.ts の ALLOWED_DURING_TERMS_ACCEPTANCE)。流れは legal-consent.int.test.ts。

  - route: POST /api/legal/consents
    permission: legal:accept
    note: 規約の版に同意する。管理者の利用規約は「組織として」、ほかは「本人として」(ロールで決まる)。同じ版への2回目は何もしない。無い版・公開前・古い版は 400
    body: { consents: [{ document: terms, version: "{currentTermsVersion}" }] }
    expect: { admin: 204, member: 204, viewer: 204, anonymous: 401 }

  # ── 「無くなったら困るか」(docs/specs/0046-pmf-survey.md) ─────────────────────────────────
  # 対象はいつもセッションの本人だけ(パスに人の ID が無いので、他社の物を指す道が無い)。
  # 聞くのは機能フラグ pmf-survey を入れた組織の、使い始めて14日たった人だけ。この表の人は作ったばかりなので、
  # 権限は通るが答えられない(POST は 404)。答えられる流れ・1人1回(409)・代理の社員(403)は pmf-survey.int.test.ts。

  - route: GET /api/pmf-survey
    permission: me:read
    note: いまこの人に聞くか。聞かないとき(フラグが無い・使い始めたばかり・もう答えた)も 200 で ask false
    expect: { admin: 200, member: 200, viewer: 200, anonymous: 401 }

  - route: POST /api/pmf-survey
    permission: pmf_survey:answer
    note: 答える(数に1つ足すだけ。だれが何と答えたかは残さない)。聞けない人は 404・この回にもう答えた人は 409
    body: { answer: very_disappointed }
    expect: { admin: 404, member: 404, viewer: 404, anonymous: 401 }
