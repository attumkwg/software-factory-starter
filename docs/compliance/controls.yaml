# 附属書 A の管理策の一覧(ここが正)。適用宣言書(soa.md)はここから pnpm compliance --write で作る。
#   pnpm compliance          書き方・根拠のファイルの実在・台帳と規程との指し合い・SoA の古さを見る(CI)
# 書き方(決まりは docs/designs/0019-evidence-soa-and-cost.md の 2.):
#   - id は附属書 A の番号(A.5.1〜A.8.34。93件。変えない)
#   - name はこのキットでの言い換え(規格の正式な名前は規格の本文で確かめる)
#   - applies: true(適用)/ false(除外)。why に理由(除外なら、なぜ当たらないか)。適用なら how に「このキットでどうやっているか」
#   - refs: 根拠のファイル(リポジトリの根からのパス。無いと CI が落ちる)。規程(policies/)は規程の頭の controls から自動で足される
#   - evidence: 毎月集める証跡の名前(scripts/evidence/sources.mjs。pnpm evidence --list)。点検の台帳の項目の evidence も自動で足される
# ここの適用・除外は**キットの既定**。使う人は導入時に自社の範囲(事務所の有無・人数・委託先)に合わせて直す(docs/compliance/README.md の 3)。
# 認証の判断は審査機関とコンサルタントに確かめる(このキットは準備の道具。docs/kit/catalog.yaml の「分かる範囲で」)。

version: 1
standard: ISO/IEC 27001:2022 附属書 A
scope: "範囲(キットの既定): このリポジトリで作る SaaS(API・画面・メールの中継)と、それを動かす AWS(stg・prod)と GitHub・開発に使う端末。事務所の設備は持たない前提"

controls:
  # ── A.5 組織の管理策(37)──────────────────────────────────────────────
  - id: A.5.1
    name: 情報セキュリティの方針
    applies: true
    why: 方針は全ての管理策の土台
    how: 基本方針を経営者が承認し、全員に知らせ、年1回見直す(点検 policy-review)
    refs: [docs/security.md]
    evidence: [compliance-docs]
  - id: A.5.2
    name: 役割と責任
    applies: true
    why: 誰が何をするかを決めないと、事故のときに止まる
    how: 基本方針に責任者を書き、点検の担当者と相談先を台帳に書く。人と AI の分担は考え方の本体に
    refs: [docs/concepts/people-and-ai.md, docs/checkup/todo.yaml]
  - id: A.5.3
    name: 職務の分離
    applies: true
    why: 1人で作って本番に出せると、誤りも不正も止まらない
    how: main は PR と CI が必須・AI は承認もマージもできない・本番は Environment の承認のあと。人が増えたら2人の承認(.github/setup.yml)
    refs: [.github/setup.yml, docs/guides/local-guards.md]
    evidence: [github-ruleset, github-environments]
  - id: A.5.4
    name: 経営者の責任
    applies: true
    why: 経営者が方針と資源を決めないと回らない
    how: マネジメントレビューを年1回(議事録の型)。基本方針は経営者が承認する
    refs: []
  - id: A.5.5
    name: 当局との連絡
    applies: true
    why: 個人データの漏えいは、期限つきで個人情報保護委員会に届け出る義務がある
    how: 漏えいの手順書に届け出の先・期限・書く中身
    refs: [docs/runbooks/personal-data-breach.md]
  - id: A.5.6
    name: 専門家の集まりとの連絡
    applies: true
    why: 新しい手口と対策を知るため
    how: 点検の台帳の調べる所(refresh_sources)を月1回読む(/checkup-refresh)
    refs: [docs/checkup/todo.yaml]
  - id: A.5.7
    name: 脅威の情報
    applies: true
    why: 使っている部品の穴を早く知るため
    how: Dependabot の通知・毎週の脆弱性の検査・月1回の世の中の変化の取り込み。届くかの精査は /cve
    refs: [docs/guides/vulnerabilities.md, .github/workflows/vuln-scan.yml]
    evidence: [github-security]
  - id: A.5.8
    name: プロジェクトの中のセキュリティ
    applies: true
    why: 作る工程の中で守りを決めないと、後から足せない
    how: 仕様に悪用のされ方(STRIDE)・設計書に観点ごとの扱い・未確定事項は人が承認するまでマージしない
    refs: [docs/specs/_template.md, docs/review-viewpoints.md]
  - id: A.5.9
    name: 情報と資産の目録
    applies: true
    why: 何を守るか分からないと守れない
    how: 列の分類表(全部の列に分類と目的)・個人データの台帳・AWS は Terraform が目録(タグつき)
    refs: [apps/api/src/db/classification.ts, docs/db/personal-data.md, infra/terraform]
  - id: A.5.10
    name: 情報と資産の使い方の決まり
    applies: true
    why: 使ってよい範囲を決めないと、持ち出しや私用が起きる
    how: 基本方針の「使い方の決まり」・教育で毎年伝える
    refs: []
  - id: A.5.11
    name: 資産の返却
    applies: true
    why: 辞めた人の端末や鍵が残ると、そこから入られる
    how: 辞めるときの手順(基本方針の「人の出入り」)と、四半期ごとの権限の棚卸し(点検 access-review)
    refs: []
    evidence: [github-collaborators, aws-iam-users]
  - id: A.5.12
    name: 情報の分類
    applies: true
    why: 扱いの重さを分けないと、全部が軽く扱われる
    how: 列ごとに public / internal / personal / sensitive。要配慮は別のスキーマ(ADR 0018)
    refs: [apps/api/src/db/classification.ts, docs/adr/0018-sensitive-data-isolation.md]
  - id: A.5.13
    name: 情報の表示(ラベル)
    applies: true
    why: 分類が見えないと、扱う人が間違える
    how: 分類は列の分類表と DB の資料(docs/db)に出る。ログは出してよい項目だけ(許可リスト)
    refs: [docs/db/personal-data.md, docs/adr/0019-log-allowlist.md]
  - id: A.5.14
    name: 情報を送る・受け取る
    applies: true
    why: 送る途中で読まれる・違う相手に届くのを防ぐ
    how: 通信は TLS だけ。メールは中継(Postfix)から SES へ。書き出しは管理者だけ
    refs: [docs/guides/mail.md, docs/security.md]
  - id: A.5.15
    name: アクセスの決まり
    applies: true
    why: 誰が何をできるかの決まりが無いと、権限が広がる
    how: 権限の表が正(CI がテストと突き合わせる)。テナントはセッションからだけ決める
    refs: [docs/authz/matrix.yaml, docs/adr/0001-shared-tables-with-rls.md]
  - id: A.5.16
    name: 識別(ID)の管理
    applies: true
    why: 1人1つの ID でないと、誰がやったか分からない
    how: 利用者は Cognito。運営の人は GitHub・AWS とも個人の ID(共有のアカウントを作らない)
    refs: [docs/adr/0007-cognito-login-server-side.md]
    evidence: [github-collaborators, aws-iam-users]
  - id: A.5.17
    name: 認証の情報(パスワード・鍵)
    applies: true
    why: 漏れた鍵とパスワードが、いちばんよく使われる入り口
    how: 二段階認証(点検 acct-mfa)・秘密の見つけと push の保護・秘密は Secrets Manager。漏れたときの手順書
    refs: [docs/runbooks/secret-leak.md, .github/setup.yml]
    evidence: [github-security, aws-iam-summary, aws-iam-users]
  - id: A.5.18
    name: アクセス権の付け外しと見直し
    applies: true
    why: 使わない権限・辞めた人の権限が残る
    how: 四半期ごとの棚卸し(点検 access-review)。毎月の証跡に共同作業者と IAM の利用者
    refs: [docs/checkup/README.md]
    evidence: [github-collaborators, aws-iam-users, aws-iam-roles]
  - id: A.5.19
    name: 委託先との関係の中のセキュリティ
    applies: true
    why: データを預ける先(AWS・GitHub・Sentry など)の守りが、自社の守りになる
    how: 委託先の管理の規程。選ぶとき・年1回の見直し(点検 vendor-review)
    refs: []
  - id: A.5.20
    name: 委託先との契約の中のセキュリティ
    applies: true
    why: 守る中身を契約に入れないと、求められない
    how: 委託先の管理の規程の「契約で確かめること」(データの場所・再委託・漏えいの連絡・消すこと)
    refs: []
  - id: A.5.21
    name: 部品の供給網(サプライチェーン)
    applies: true
    why: 依存のパッケージや Action に悪い物が混ざる
    how: Action は SHA で固定・依存の入れ方の守り(危険度「高」)・Renovate・Trivy・脆弱性の精査
    refs: [renovate.json, .claude/hooks/protected-paths.json, docs/guides/vulnerabilities.md]
    evidence: [github-actions]
  - id: A.5.22
    name: 委託先のサービスの見張りと変更
    applies: true
    why: 委託先の変更(値上げ・仕様・事故)で、守りが変わる
    how: 年1回の委託先の見直し・月1回の世の中の変化の取り込み(GitHub・AWS の変更履歴)
    refs: [docs/checkup/todo.yaml]
  - id: A.5.23
    name: クラウドのサービスを使うときのセキュリティ
    applies: true
    why: 全部をクラウドで動かしている
    how: AWS は Terraform で設定し、Security Hub で採点・GuardDuty で見張る。責任の分担は委託先の管理の規程
    refs: [infra/terraform/modules/security-baseline]
    evidence: [aws-securityhub, aws-guardduty, aws-cloudtrail]
  - id: A.5.24
    name: 事故の対応の計画と準備
    applies: true
    why: 事故のときに慌てずに動くため
    how: 障害の入口の手順書・知らせの先(点検 notify-route)・攻撃・漏えい・秘密の漏れの手順書
    refs: [docs/runbooks/incident.md, docs/runbooks/attack.md]
  - id: A.5.25
    name: 出来事の見極めと判断
    applies: true
    why: どれが事故かを決める基準が無いと、遅れる
    how: 障害の手順書の重さの決め方・アラームの手順書
    refs: [docs/runbooks/incident.md, docs/runbooks/alarms.md]
  - id: A.5.26
    name: 事故への対応
    applies: true
    why: 止める・直す・知らせるを、決めた順にやるため
    how: 手順書(他社のデータが見えた・個人データの漏えい・攻撃・秘密の漏れ)
    refs: [docs/runbooks/tenant-data-leak.md, docs/runbooks/personal-data-breach.md]
  - id: A.5.27
    name: 事故から学ぶ
    applies: true
    why: 同じ事故を繰り返さないため
    how: 振り返りの記録と、再発防止が閉じたかの点検(incident-followups)
    refs: [docs/incidents/README.md]
  - id: A.5.28
    name: 証拠を集める
    applies: true
    why: 事故の後や審査で、何があったかを示すため
    how: 監査ログ(足すだけ)・CloudTrail・毎月の証跡を消せない置き場に(evidence.yml)
    refs: [docs/adr/0013-audit-log.md, .github/workflows/evidence.yml]
    evidence: [aws-cloudtrail]
  - id: A.5.29
    name: 障害の間のセキュリティ
    applies: true
    why: 慌てて守りを外さないため
    how: 戻す手順書(守りを外さずに戻す)・本番に書き込む操作は手順書のコマンドを人が打つ
    refs: [docs/runbooks/deploy-rollback.md, docs/runbooks/db-restore.md]
  - id: A.5.30
    name: 事業を続けるための ICT の備え
    applies: true
    why: DB やアカウントが失われても戻せるように
    how: 消せない保管庫のバックアップ・毎月の戻す訓練・管理者を2人に(点検 acct-two-admins)
    refs: [docs/adr/0012-backup-vault-and-restore-drills.md, .github/workflows/restore-drill.yml]
    evidence: [aws-backup, drills]
  - id: A.5.31
    name: 法令・規制・契約の要求
    applies: true
    why: 個人情報保護法・特定商取引法・契約の約束を守るため
    how: 利用規約とプライバシーポリシーの型・同意の記録・年1回の法令の見直し(点検 law-review)
    refs: [docs/guides/legal-documents.md, docs/adr/0022-legal-documents-and-consent.md]
  - id: A.5.32
    name: 知的財産権
    applies: true
    why: 使う部品の使用許諾(ライセンス)を守るため
    how: 依存は package.json と pnpm-lock.yaml に固定(使用許諾は依存を足す PR で確かめる)
    refs: [pnpm-lock.yaml]
  - id: A.5.33
    name: 記録を守る
    applies: true
    why: 記録が消える・書き換えられると、何も示せない
    how: 監査ログは足すだけ・証跡は Object Lock・点検の答えは台帳に足すだけ(CI が見張る)
    refs: [docs/adr/0013-audit-log.md, .github/workflows/evidence.yml]
    evidence: [checkup-ledger, compliance-docs]
  - id: A.5.34
    name: プライバシーと個人を特定できる情報の保護
    applies: true
    why: 個人データを預かる
    how: 個人情報保護規程・個人データの台帳・列の分類・ログの許可リスト・消す期間
    refs: [docs/db/personal-data.md, docs/guides/data-retention.md]
  - id: A.5.35
    name: 外からの独立した見直し
    applies: true
    why: 自分たちだけでは見落とす
    how: 内部監査(年1回。作った人と別の人)・外部の診断(点検 pentest-yearly)
    refs: []
  - id: A.5.36
    name: 決まりを守れているかの確かめ
    applies: true
    why: 決めただけでは守られない
    how: 毎週の点検(自動で確かめる・人に聞く)・規程の見直し・内部監査
    refs: [docs/checkup/README.md]
    evidence: [checkup-ledger]
  - id: A.5.37
    name: 手順を文書にする
    applies: true
    why: 担当者がいなくても回るように
    how: 手順書(docs/runbooks)・引き継ぎの練習(点検 handover)
    refs: [docs/runbooks/incident.md, docs/playbook.md]

  # ── A.6 人の管理策(8)──────────────────────────────────────────────────
  - id: A.6.1
    name: 採用の前の確認
    applies: true
    why: 権限を渡す前に、その人を確かめる
    how: 基本方針の「人の出入り」(雇う前に経歴と誓約を確かめる。法令の範囲で)
    refs: []
  - id: A.6.2
    name: 雇用の条件
    applies: true
    why: 守る責任を、雇う条件に入れる
    how: 雇う契約・就業規則に、秘密を守る義務と規程を守る義務(会社の書類。キットの外)
    refs: []
  - id: A.6.3
    name: 意識・教育・訓練
    applies: true
    why: 決まりを知らない人は守れない
    how: 教育の規程。入るとき+年1回。受けた記録を残す(点検 training)
    refs: []
  - id: A.6.4
    name: 懲戒の手続き
    applies: true
    why: 破ったときの扱いを決めておく
    how: 就業規則による(基本方針から指す。会社の書類)
    refs: []
  - id: A.6.5
    name: 辞めた・変わった後の責任
    applies: true
    why: 辞めた後も秘密を守る義務が続く
    how: 辞めるときの手順(権限を外す・誓約)と、権限の棚卸し
    refs: []
    evidence: [github-collaborators, aws-iam-users]
  - id: A.6.6
    name: 秘密を守る約束(NDA)
    applies: true
    why: 社員・業務委託・委託先と、秘密を守る約束を交わす
    how: 委託先の管理の規程・雇う契約
    refs: []
  - id: A.6.7
    name: 離れた場所での仕事
    applies: true
    why: 家や外から仕事をする前提
    how: 基本方針の「離れた場所での仕事」(公共の場所で画面を見せない・端末の鍵・本番は AWS のコンソールと手順書から)
    refs: []
  - id: A.6.8
    name: 出来事の報告
    applies: true
    why: 気づいた人が、すぐに知らせられるように
    how: 障害の入口の手順書と知らせの先・外の人からの非公開の脆弱性の報告(GitHub)
    refs: [docs/runbooks/incident.md, .github/setup.yml]

  # ── A.7 物理的な管理策(14)──────────────────────────────────────────────
  - id: A.7.1
    name: 物理的な境界
    applies: false
    why: キットの既定では事務所の設備を持たない(サーバーは AWS)。設備の守りは委託先の第三者の報告書(SOC 2 など)で確かめる。事務所を持つなら適用にする
    refs: []
  - id: A.7.2
    name: 入退室の管理
    applies: false
    why: A.7.1 と同じ(事務所を持つなら適用)
    refs: []
  - id: A.7.3
    name: 事務所・部屋・設備の守り
    applies: false
    why: A.7.1 と同じ(事務所を持つなら適用)
    refs: []
  - id: A.7.4
    name: 物理的な見張り
    applies: false
    why: A.7.1 と同じ(事務所を持つなら適用)
    refs: []
  - id: A.7.5
    name: 災害など物理的な脅威への備え
    applies: false
    why: 設備は AWS の責任(複数の AZ に置く。network・aurora の設定)。事務所を持つなら適用
    refs: [infra/terraform/modules/network]
  - id: A.7.6
    name: 守る場所での作業
    applies: false
    why: A.7.1 と同じ(事務所を持つなら適用)
    refs: []
  - id: A.7.7
    name: 机の上と画面を片づける
    applies: true
    why: 家・外で仕事をするので、画面と紙からの漏れがある
    how: 基本方針の「端末」(離れるときは画面に鍵・紙に個人データを書かない)
    refs: []
  - id: A.7.8
    name: 機器の置き場所と守り
    applies: false
    why: 自社のサーバーを持たない。端末は A.8.1 で扱う
    refs: []
  - id: A.7.9
    name: 外に持ち出した資産の守り
    applies: true
    why: ノートの端末を持ち歩く
    how: 基本方針の「端末」(ディスクの暗号化・紛失したらすぐ知らせる)
    refs: []
  - id: A.7.10
    name: 記録の媒体(USB など)
    applies: true
    why: 個人データを媒体に移すと、なくす
    how: 基本方針の「端末」(個人データを外の媒体に移さない。本番のデータを手元に落とさない)
    refs: []
  - id: A.7.11
    name: 電源などの設備
    applies: false
    why: 設備は AWS の責任。事務所を持つなら適用
    refs: []
  - id: A.7.12
    name: 配線の守り
    applies: false
    why: 設備は AWS の責任。事務所を持つなら適用
    refs: []
  - id: A.7.13
    name: 機器の保守
    applies: false
    why: 自社のサーバーを持たない。端末の更新は A.8.1 で扱う
    refs: []
  - id: A.7.14
    name: 機器を捨てる・使い回すとき
    applies: true
    why: 端末を捨てる・人に渡すときに、中身が残る
    how: 基本方針の「端末」(消してから捨てる・渡す)。クラウドの媒体は AWS の責任
    refs: []

  # ── A.8 技術的な管理策(34)──────────────────────────────────────────────
  - id: A.8.1
    name: 利用者の端末
    applies: true
    why: 開発の端末から、GitHub と AWS に入れる
    how: 基本方針の「端末」(OS の更新・ディスクの暗号化・画面の鍵)。AI のハーネスは本番の鍵を持たない
    refs: [docs/guides/local-guards.md]
  - id: A.8.2
    name: 特別な権限(管理者)
    applies: true
    why: 管理者の権限は、取られると全部が取られる
    how: 本番は Environment の承認のあと・役割は main からだけ・root は使わない(二段階認証)・管理者は2人まで
    refs: [.github/setup.yml, infra/terraform/modules/github-oidc]
    evidence: [github-environments, aws-iam-summary, aws-iam-roles]
  - id: A.8.3
    name: 情報へのアクセスの制限
    applies: true
    why: 他社のデータを見せない・権限の外の物を見せない
    how: テナントの分離(RLS)・権限の表と2社のテスト・サポートの代理ログインは期限と記録つき
    refs: [docs/adr/0001-shared-tables-with-rls.md, docs/authz/matrix.yaml, docs/adr/0014-support-access.md]
  - id: A.8.4
    name: ソースコードへのアクセス
    applies: true
    why: コードを書き換えられると、守りが外れる
    how: main は PR 必須・強制 push の禁止・危険度「高」の場所は人の確認(CODEOWNERS とフック)
    refs: [.github/setup.yml, .claude/hooks/protected-paths.json]
    evidence: [github-ruleset, github-collaborators]
  - id: A.8.5
    name: 安全な認証
    applies: true
    why: パスワードだけでは破られる
    how: 利用者は二段階認証・セッションの時間切れ。運営の人は二段階認証(点検 acct-mfa)
    refs: [docs/specs/0006-account-security.md, docs/adr/0017-session-idle-and-absolute-timeout.md]
    evidence: [aws-iam-users]
  - id: A.8.6
    name: 容量の管理
    applies: true
    why: 足りなくなって止まる・費用が膨らむ
    how: 台数の自動の増減・DB の上限のアラーム・Actions の分数の点検・予算のアラーム
    refs: [docs/guides/monitoring.md, docs/runbooks/alarms.md]
  - id: A.8.7
    name: 悪いプログラムからの守り
    applies: true
    why: 依存や端末から、悪いプログラムが入る
    how: イメージの検査(Trivy)・GuardDuty・端末は OS の守り(基本方針)
    refs: [.github/workflows/ci.yml, infra/terraform/modules/security-baseline]
    evidence: [aws-guardduty]
  - id: A.8.8
    name: 技術的な脆弱性の管理
    applies: true
    why: 部品の穴を、届くかを見て期限つきで直す
    how: Dependabot・Renovate・毎週の検査・/cve の6段の精査と期限
    refs: [docs/guides/vulnerabilities.md, docs/security/vulns.md]
    evidence: [github-security]
  - id: A.8.9
    name: 設定の管理
    applies: true
    why: 画面で直した設定は、誰が何をしたか残らない
    how: AWS は Terraform・GitHub は .github/setup.yml が正(毎週、外れていないか点検)
    refs: [infra/terraform, .github/setup.yml]
    evidence: [github-ruleset, github-actions, aws-securityhub]
  - id: A.8.10
    name: 情報を消す
    applies: true
    why: 要らなくなった個人データを持ち続けない
    how: 消す期間の手引き・解約の削除のコマンド・人ごとの削除
    refs: [docs/guides/data-retention.md, docs/runbooks/offboarding.md]
  - id: A.8.11
    name: データを伏せる(マスキング)
    applies: true
    why: ログや試しの環境に、本物の個人データを出さない
    how: ログは許可リスト(知らない名前は伏せる)・Sentry に送る前に値を落とす・試しは偽のデータ
    refs: [docs/adr/0019-log-allowlist.md, docs/guides/monitoring.md]
  - id: A.8.12
    name: データの漏れを防ぐ
    applies: true
    why: 書き出し・ログ・リポジトリから漏れる
    how: 秘密の見つけと push の保護・gitleaks・書き出しは管理者だけ・ログの許可リスト
    refs: [.github/workflows/ci.yml, docs/adr/0019-log-allowlist.md]
    evidence: [github-security]
  - id: A.8.13
    name: 情報のバックアップ
    applies: true
    why: 壊れた・消された DB を戻すため
    how: 消せない保管庫に毎日と毎月・毎月の戻す訓練(点検 restore-first)
    refs: [docs/adr/0012-backup-vault-and-restore-drills.md, docs/runbooks/db-restore.md]
    evidence: [aws-backup, drills]
  - id: A.8.14
    name: 処理の設備の冗長化
    applies: true
    why: 1か所の障害で止まらないように
    how: 本番は AZ ごとの NAT・DB は2台・ECS は2台から
    refs: [infra/terraform/envs/prod/main.tf]
  - id: A.8.15
    name: ログを取る
    applies: true
    why: 何が起きたかを後から追うため
    how: アプリのログ(許可リスト)・監査ログ(書き込みは自動で記録)・CloudTrail・VPC のフローログ
    refs: [docs/adr/0013-audit-log.md, packages/logging]
    evidence: [aws-cloudtrail]
  - id: A.8.16
    name: 見張り
    applies: true
    why: 異常に早く気づくため
    how: アラーム → Slack・外形監視・Sentry・GuardDuty・WAF の数
    refs: [docs/guides/monitoring.md, docs/runbooks/alarms.md]
    evidence: [aws-guardduty, aws-securityhub]
  - id: A.8.17
    name: 時刻を合わせる
    applies: true
    why: ログの時刻がずれると、出来事の順番が分からない
    how: AWS のサービスの時刻(Amazon Time Sync)を使う。保存は UTC(ADR 0005)
    refs: [docs/adr/0005-money-and-time.md]
  - id: A.8.18
    name: 特別な権限のプログラム
    applies: true
    why: 守りを越えて動ける道具は、使う場面を絞る
    how: 本番の DB に直接つながない・運営のコマンド(解約の削除など)は試し → 確認つき・手順書から人が打つ
    refs: [docs/runbooks/offboarding.md]
  - id: A.8.19
    name: 本番の環境へのソフトウェアの入れ方
    applies: true
    why: 決めた道だけで本番を変える
    how: イメージは stg で作った物をそのまま・deploy.yml の承認のあと・依存の入れ方は危険度「高」
    refs: [.github/workflows/deploy.yml, .claude/hooks/protected-paths.json]
    evidence: [github-environments]
  - id: A.8.20
    name: ネットワークの守り
    applies: true
    why: 外から届く所を絞る
    how: DB は非公開のサブネット・セキュリティグループで絞る・WAF
    refs: [infra/terraform/modules/network, infra/terraform/modules/waf]
  - id: A.8.21
    name: ネットワークのサービスの守り
    applies: true
    why: 入口(ALB・CloudFront)の設定で守りが決まる
    how: TLS だけ・WAF の決まり(最初は数える → 止める。点検 waf-block)
    refs: [infra/terraform/modules/waf]
  - id: A.8.22
    name: ネットワークを分ける
    applies: true
    why: 本番と試しを分け、1つが破られても広がらないように
    how: stg・prod は別の AWS アカウント・公開と非公開のサブネット
    refs: [infra/terraform/envs/prod/main.tf, infra/terraform/modules/network]
  - id: A.8.23
    name: Web の閲覧の制限
    applies: false
    why: キットの既定では、社員の閲覧を絞る道具を入れない(少人数で端末は個人の管理)。人が増えたら適用を考える
    refs: []
  - id: A.8.24
    name: 暗号の使い方
    applies: true
    why: 通信と保存の中身を守る
    how: 通信は TLS・DB と秘密と置き場は KMS の鍵(年ごとに替える)・クッキーは暗号化
    refs: [docs/adr/0023-reauth-token-in-encrypted-cookie.md, infra/terraform/modules/aurora]
  - id: A.8.25
    name: 安全な開発の流れ
    applies: true
    why: 作る流れの中で守りを入れる
    how: 7工程(仕様 → 設計 → 実装 → テスト)・誤りは入った工程から作り直す・ハーネスの3層
    refs: [docs/concepts/README.md, docs/guides/code-review.md]
  - id: A.8.26
    name: アプリのセキュリティの要求
    applies: true
    why: 作る前に守る中身を決める
    how: 仕様の悪用のされ方(STRIDE)・セキュリティの決まり(番号つき)
    refs: [docs/security.md, docs/specs/_template.md]
  - id: A.8.27
    name: 安全な作りの原則
    applies: true
    why: 1つの誤りで全部が破られない作りにする
    how: テナントの分離(RLS)・領域の境界・要配慮は別のスキーマ・2年ごとの作りの見直し(点検 arch-review)
    refs: [docs/adr/0001-shared-tables-with-rls.md, docs/adr/0004-domain-boundaries.md]
  - id: A.8.28
    name: 安全なコードの書き方
    applies: true
    why: よくある穴をコードに入れない
    how: Semgrep の自社ルール・型・Biome・設計とレビューの観点
    refs: [docs/review-viewpoints.md, .github/workflows/ci.yml]
  - id: A.8.29
    name: 開発と受け入れの中のセキュリティのテスト
    applies: true
    why: 出す前に穴を見つける
    how: 2社のテスト・権限の表の網羅・ファズ・ZAP・外部の診断(点検 pentest-yearly)
    refs: [.github/workflows/security-fuzz.yml, .github/workflows/zap-api-scan.yml]
    evidence: [drills]
  - id: A.8.30
    name: 外に頼む開発
    applies: true
    why: 業務委託や外の会社が書いたコードも、同じ守りを通す
    how: 外の人の PR も同じ CI と危険度のラベル・外の人の PR の実行は毎回人が見てから
    refs: [.github/setup.yml]
    evidence: [github-actions]
  - id: A.8.31
    name: 開発・試し・本番の環境を分ける
    applies: true
    why: 試しの操作で本番を壊さない・本番のデータを試しに使わない
    how: 手元(Docker)・PR ごとの環境・stg・prod を分ける。prod は別のアカウントで、AI の環境から届かない
    refs: [docs/guides/local-environment.md, infra/terraform/envs/prod/main.tf]
    evidence: [github-environments]
  - id: A.8.32
    name: 変更の管理
    applies: true
    why: 決めた手順を通らない変更を、本番に入れない
    how: 1 Issue = 1 PR・必須のチェック・危険度のラベル・本番は承認のあと
    refs: [.github/setup.yml, .github/pull_request_template.md]
    evidence: [github-ruleset, github-environments]
  - id: A.8.33
    name: 試しの情報
    applies: true
    why: 試しに本物の個人データを使わない
    how: 種データ・偽の Cognito・試作は偽のデータだけ(CI が見張る)
    refs: [docs/guides/prototypes.md, docs/guides/local-environment.md]
  - id: A.8.34
    name: 監査のための試しのときの守り
    applies: true
    why: 診断や監査で、本番を壊さない・データを持ち出させない
    how: 診断は stg に向ける(ZAP)・外部の診断は範囲と期間を決めて契約する
    refs: [.github/workflows/zap-api-scan.yml]
