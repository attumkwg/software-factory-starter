# KPI の木: タスク管理(見本)
# 見本。題材はこのキットの TODO アプリ。ペルソナの合議(docs/product/councils/2026-10-28-kpi.md)から作った。
# ペルソナが架空で根拠が推測だけなので、どれも status: 仮説。線(数)は根拠が無いので、最初の4週は測るだけにして決め直す。
# 自分のプロダクトでは /persona → /council で作り直す。考え方は docs/guides/kpi.md。確かめは `pnpm kpi`。

north_star:
  id: K-0
  name: 期限の前日の予告(間に合う / 遅れそう)が、期限日の結果と合っていた割合
  persona: P-1
  why: 遅れを先に、正しく知れる = 催促・問い合わせ・値引きが減る(P-1・P-4・P-5・P-8・P-9 が支えた)。予告はシステムが更新の様子から出し、本人に申告させない
  measure:
    how: manual
    source: 運営の集計で、期限が前日の朝のまとめに載った案件ごとに予告と期限日の結果を比べ、組織ごとの割合だけを出す。見逃し(予告なしに遅れた件)と空振り(遅れそうが間に合った件)を必ず並べる。個人ごとには出さない
  unit: "%"
  status: 仮説
  council: docs/product/councils/2026-10-28-kpi.md

inputs:
  - id: K-1
    name: 期限の前日の夕方までに、現場が更新済みだった割合
    persona: P-9
    why: 予告の材料。古い表のせいで事務が責められなくなる(P-9・P-1)
    measure: { how: manual, source: 朝のまとめを作るときに、載った期限つきタスクのうち前日 18:30 以降〜当日朝までに更新があった件の割合(組織ごと) }
    unit: "%"
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-2
    name: 完了を押した件のうち、24時間以内に問い合わせが来なかった割合
    persona: P-2
    why: 終わったのにまた聞かれる、が無くなる(P-2)。北極星が管理者の側に寄りすぎないための数
    measure: { how: survey, source: 最初は週1問の自己申告(先週、終わった後に聞かれた回数) }
    unit: "%"
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-3
    name: 招待した人のうち、14日以内に自分で最初の操作まで進んだ割合
    persona: P-5
    why: 説明会なしで始められる = 問い合わせが事務の長に集まらない(P-5。P-3 の「人に聞かずに」に近い)
    measure: { how: manual, source: 招待の受け付けの記録と、最初の操作の日(組織ごとの割合) }
    unit: "%"
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-4
    name: 4週後も使っている組織の割合
    persona: P-10
    why: 使われなくなった会社は、予告が当たる前に消える(P-10。P-4 の現場の利用率・P-7 の使われた席と同じ向き)
    measure: { how: manual, source: 契約開始から28日目の前後7日に、2人以上が更新した組織の数 ÷ その月に始めた組織の数 }
    unit: "%"
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md

guardrails:
  - id: K-G1
    name: 退職済みなのに有効なアカウントの数
    why: 1件でも出たら、外部への招待・共有の拡大を止める(P-6・拒否権)
    measure: { how: manual, source: 管理者が止めた人の記録と、組織から届く退職の連絡を突き合わせる }
    unit: 件
    limit: { value: 1, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G2
    name: 請求額が事前の見積りと違った月の数
    why: 1件でも出たら、課金の仕組みの変更を止める(P-7・拒否権)
    measure: { how: manual, source: 請求と見積りの突き合わせ(件数だけ。金額は書かない) }
    unit: 件
    limit: { value: 1, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G3
    name: アプリを開いてから完了を押し終わるまでの時間(中央値)
    why: 電話のほうが速ければ誰も使わない(P-2)
    measure: { how: manual, source: 画面の操作の時間の記録(直近4週の中央値) }
    unit: 秒
    limit: { value: 10, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G4
    name: 本人の操作で消した・変えた件のうち、元に戻せなかった件数(月)
    why: 「間違えて消しそう」が新人の使わない一番の理由(P-3)
    measure: { how: manual, source: 監査ログの削除・変更と、戻した記録 }
    unit: 件
    limit: { value: 1, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G5
    name: 1社あたりの問い合わせの数(月)
    why: 機能を増やすほど問い合わせが増え、1〜2人の窓口が先に潰れる(P-10・P-5)
    measure: { how: manual, source: 問い合わせの受け口の記録 ÷ 契約している組織の数 }
    unit: 件
    limit: { value: 2, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G6
    name: 事務の手入力の時間(週)
    why: 現場の更新が増えた代わりに事務の手直しが増えたら意味が無い(P-9)
    measure: { how: survey, source: 導入前後の各2週間の日報の自己申告 }
    unit: 時間
    limit: { value: 5, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G7
    name: 発注元にアカウント作成・ログインを求めた件数
    why: 1件でも出たら、その機能を止める(P-8)
    measure: { how: manual, source: 発注元向けの閲覧が登録・ログインを経由した件数(週) }
    unit: 件
    limit: { value: 1, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md
  - id: K-G8
    name: 知らせを開かなかった・切った人の割合
    why: 通知が増えると見なくなる(P-1・P-2・P-3・P-5・P-9 がそろって挙げた)
    measure: { how: manual, source: 知らせの開封と、知らせの設定を切った記録(直近4週) }
    unit: "%"
    limit: { value: 20, direction: below }
    status: 仮説
    council: docs/product/councils/2026-10-28-kpi.md

# 値の記録(足すだけ)。金額の指標(money: true)は value を書かずに reached だけ
records: []
