      - 事業の説明(誰に・何を・お金を取るか・個人情報は何を持つか)を1枚にまとめる
      - 弁護士か、規約の確認サービスに見てもらう
      - 直してもらった文を、版を上げて入れる(同意の取り直しが要るかも聞く)
    severity: normal
    controls: [ A.5.31, A.5.34 ]
    status: open
    history: []
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: pentest-before-launch
    title: 公開の前に、外部の診断を受ける
    why: 自分たちの検査では見つからない穴を、攻撃の専門家に探してもらう(お金がかかる)
    if_ignored: 公開した後に、利用者のデータで穴が見つかる
    who: human
    advisory: true
    phase: setup
    every: once
    verify: manual
    steps:
      - 診断の会社を2〜3社選び、見積りを取る(範囲は画面と API)
      - 診断の日を決め、stg に本番と同じ形の環境を用意する
      - 見つかった物を Issue にして、直してから公開する(中身は公開の Issue に書かない)
    severity: normal
    controls: [ A.8.29, A.5.35 ]
    status: open
    history: []
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: launch-decisions
    title: 公開の前に、キットが既定で決めた所(導入時に決める)を決める
    why: 利用規約の同意し直しの基準など、答えがプロダクトごとに違う所は、キットの既定のままになっている。自分のプロダクトの答えを決めずに公開しないため
    if_ignored: 自分の契約や利用者に合わない決まりのまま、本番で動き出す
    who: human
    phase: setup
    every: once
    verify: manual
    steps:
      - pnpm decisions --adopt で一覧を出す(設計書ごとに、キットの既定と問いが出る)
      - /tailor で設計書ごとに「既定のままでよいか」を答える(法令・契約の行は法務と確かめる)
      - 答えた行が「承認」か「変更」になったことを確かめ、変更は /rework で作り直す
      - 本番に出す前に pnpm decisions --launch が 0 で終わることを確かめる
    severity: normal
    controls: [ A.5.8 ]
    status: open
    history: []
    source: docs/designs/0013-decisions-at-adoption.md
    review_by: 2027-04-24

