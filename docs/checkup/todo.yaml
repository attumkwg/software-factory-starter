  # ── 1年(以後毎年)────────────────────────────────────────────────
  - id: pentest-yearly
    title: 外部の診断を受ける(年1)
    why: 1年で機能も攻撃の手口も変わる。外の目で穴を探してもらう(お金がかかる)
    if_ignored: 新しい機能の穴に、利用者のデータで気づく
    who: human
    advisory: true
    phase: 1y
    every: yearly
    verify: manual
    steps:
      - 前の診断の結果と、この1年で増えた機能を1枚にまとめる
      - 診断の会社に見積りを取り、範囲と日を決める
      - 見つかった物を Issue にして直す(中身は公開の Issue に書かない)
    severity: normal
    controls: [ A.8.29, A.5.35 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  - id: eol
    title: Node・PostgreSQL のサポート期限が近づいていないか
    why: サポートの切れた版には、穴が見つかっても直った版が出ない
    if_ignored: 直せない穴を抱えたまま動かし続ける
    who: system
    phase: 1y
    every: yearly
    verify: auto
    check: eol
    severity: normal
    controls: [ A.8.8 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  - id: law-review
    title: 法令の改正と、規約の見直し
    why: 個人情報保護法などは数年ごとに変わる。規約と手順書が古いままになるのを防ぐ
    if_ignored: 知らないうちに法令に合わなくなる
    who: human
    advisory: true
    phase: 1y
    every: yearly
    verify: manual
    steps:
      - この1年の個人情報保護法・電気通信事業法などの改正を、専門家か公式の発表で確かめる
      - 利用規約・プライバシーポリシー・漏えいの手順書に、直す所があるかを専門家に聞く
      - 直すなら、規約の版を上げる PR にする
    severity: normal
    controls: [ A.5.31, A.5.34 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  - id: handover
    title: 担当者がいなくても回るか(引き継ぎの練習)
    why: 担当者が休んだり辞めたりしても、点検と障害対応が止まらないようにする
    if_ignored: 1人がいないと、誰も本番を直せない
    who: human
    phase: 1y
    every: yearly
    verify: manual
    steps:
      - 担当者以外の人に、この台帳と docs/runbooks/incident.md だけを渡す
      - その人に、1週ぶんの点検(/checkup)と、手順書を1つ通しでやってもらう
      - 詰まった所を手順書か台帳に直す
    severity: normal
    controls: [ A.5.30, A.5.37 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  # ── 2年 ────────────────────────────────────────────────────────
  - id: arch-review
    title: 領域の分け方・DB の大きさ・費用の形を見直す
    why: 2年たつと、最初の作りが今の使われ方に合わなくなっていることがある
    if_ignored: 小さな直しが積み重なって、変えるのがどんどん高くなる
    who: human
    phase: 2y
    every: yearly
    verify: ask
    question:
      text: AI がまとめた「領域の分け方・DB の大きさ・費用の形」の見直しの案を見て、作り直しを考えますか
      options:
        - { label: 今の作りのまま, means: 1年後にまた見ます }
        - { label: 作り直しを考える, means: 仕様の案(/new-feature)から始めます }
      recommended: 今の作りのまま
      irreversible: false
    severity: normal
    controls: [ A.8.27 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  - id: team-review
    title: 2人のレビュー・当番の体制を見直す
    why: 人が増えたら、1人で回していた時の決まりを変える時期
    if_ignored: 1人に頼った体制のまま、その人が倒れる
    who: human
    phase: 2y
    every: yearly
    verify: ask
    question:
      text: 今の人数で、PR のレビューを2人にする・障害の当番を回すことはできますか
      options:
        - { label: できる(2人にする), means: ブランチ保護で承認を1人以上にする手順を出します }
        - { label: まだ1人, means: 1年後にまた聞きます }
      recommended: できる(2人にする)
      irreversible: false
    severity: normal
    controls: [ A.5.2, A.5.3 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(台帳の初版)
    review_by: 2027-10-20

  # ── 認証の準備(area: compliance。台帳の compliance: true のときだけ毎週の点検に出る。/compliance-check)──
  - id: policies-adopt
    title: 規程のひな形を自社の物にし、適用宣言書の適用・除外を決める
    why: ひな形のままの規程は、審査で「決めていない」と同じに扱われる
    if_ignored: 審査の直前に、規程と適用宣言書をまとめて書くことになり、中身と実際がずれる
    who: human
    phase: setup
    every: once
    verify: manual
    check: policies-adopted
    steps:
      - docs/compliance/README.md の 3. を読み、範囲(事務所の有無・人数・委託先)を決める
      - docs/compliance/controls.yaml の適用・除外と理由を、自社の範囲に合わせて直す(pnpm compliance --write で適用宣言書を作り直す)
      - docs/compliance/policies/ の「要記入」の所を埋め、責任者(基本方針は経営者)の承認をもらう
      - 承認した日を各規程の頭の established に、1年以内の日を next_review に書いて PR にする
    severity: normal
    controls: [ A.5.1, A.5.36, A.5.37 ]
    evidence: [ compliance-docs ]
    area: compliance
    status: open
    history: []
    source: docs/designs/0019-evidence-soa-and-cost.md の 6.(認証の準備)
    review_by: 2027-04-25

  - id: evidence-monthly
