    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: legal-terms
    title: 利用規約・プライバシーポリシーを専門家に見てもらう
    why: 規約の雛形はあるが、自分の事業に合っているかは法律の専門家でないと判断できない
    if_ignored: 揉めたときに規約が守ってくれない。個人情報の扱いの説明が足りない
    who: human
    advisory: true
    phase: setup
