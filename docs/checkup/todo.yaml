    severity: normal
    controls: [ A.6.3 ]
    area: compliance
    status: open
    history: []
    source: docs/designs/0019-evidence-soa-and-cost.md の 6.(認証の準備)
    review_by: 2027-04-25

  - id: vendor-review
    title: 委託先(クラウド・SaaS・業務委託)を見直す
    why: 預けた先の守りや契約が変わると、自社の守りも変わる
    if_ignored: 使わなくなった連携や、守りの水準が下がった委託先に、データを預けたままになる
