# 点検の台帳(やることの一覧。ここが正)。
#   pnpm checkup                 いまの段階に当たる項目を出し、auto の物は実際に確かめる(台帳に書いた状態を信じない)
#   pnpm checkup --write-readme  詳しくない人が読む1枚(docs/checkup/README.md)をここから作り直す
# 書き方(決まりは docs/designs/0007-checkup.md の 2. と 6.):
#   - id は変えない(履歴と知らせの鍵)。要らなくなったら消さずに status: retired。
#   - who: system(仕組みで済む)/ ai(AI がやる)/ human(人がやる)。advisory: true は「推奨」(ソフトウェアでは解けない。やるかは人が決める)
#   - phase: setup / 1m / 3m / 6m / 1y / 2y(使い始めた日からの日数。前の段階の残りは消えない)
#   - every: once / weekly / monthly / quarterly / half-year / yearly
#   - verify: auto(check に scripts/checkup/checks/ の名前)/ ask(question に問い・選択肢・おすすめ)/ manual(steps に番号付きの手順)
#   - question.irreversible: true(お金・公開・削除・契約)は「分からない」で進めない。相談先に回すだけ
#   - 選択肢の after: 選んだ後の状態。done(書かなければこれ)/ open(来週また聞く)/ snooze(90日後にまた聞く)
#   - status: open / done / asked_advisor / snoozed(snoozed_until に次に聞く日。最長90日)/ retired
#   - history は足すだけ(答え・確かめの記録。いつ・誰が・何を)。答えは /checkup が pnpm checkup:answer で書く(手で書かない)
#   - 項目を足す・直す・引退させるのは /checkup-refresh の PR(引退は消さずに status: retired と history に result: retired)
#   - 公開のリポジトリなので、脆弱性や秘密の見つけ物の中身は書かない(件数と見る場所だけ)
#   - 認証の準備(docs/designs/0019-evidence-soa-and-cost.md の 2.):
#       controls: 当たる管理策(ISO/IEC 27001:2022 附属書 A の番号)。適用宣言書(docs/compliance/soa.md)の「点検の項目」になる
#       evidence: 裏づけになる、毎月集める証跡の名前(pnpm evidence --list)
#       area: compliance … 認証の準備だけの項目。台帳の compliance: true のときだけ毎週の点検に出る(/compliance-check はいつでも)

started_on: 2026-10-17 # 使い始めた日(段階の計算の起点)
owners:
  responder: "@attumkwg" # 知らせを受けて答える人(担当者)
  advisor: "@attumkwg" # 「分からない」の相談先(詳しい人)
# 認証(P マーク・ISMS)の準備の項目(area: compliance)を、毎週の点検に入れるか。目指すと決めたら true(/compliance-check が聞く)
compliance: false

# 世の中の変化の取り込み(/checkup-refresh。月1回、人が手元で起動する)。
#   refreshed_on: 前回取り込んだ日(/checkup-refresh が書く)。35日を過ぎると毎週の w-ledger が知らせる。まだ一度も流していない
#   refresh_sources: 調べる所。これ自体も refresh で見直す(足す・直すは PR で)
refresh_sources:
  - name: GitHub の変更履歴
    url: https://github.blog/changelog/
    covers: Actions・ブランチ保護・ルールセット・Dependabot・secret scanning・Issue の仕様の変更
  - name: GitHub のプラン
    url: https://github.com/pricing
    covers: 無料のプランで使える守り・Actions の分数の枠の変更
  - name: GitHub Advisory Database(npm)
    url: https://github.com/advisories?query=ecosystem%3Anpm
    covers: 使っている主な依存(hono・jose・pg・drizzle・TanStack・zod など)の重大な通知(中身は /cve へ)
  - name: Node.js のセキュリティリリース
    url: https://nodejs.org/en/blog/vulnerability
    covers: Node.js の穴とサポート期限
  - name: PostgreSQL のセキュリティ情報
    url: https://www.postgresql.org/support/security/
    covers: PostgreSQL(Aurora)の穴とサポート期限
  - name: AWS のセキュリティ情報
    url: https://aws.amazon.com/security/security-bulletins/
    covers: 使っている AWS のサービス(ECS・Aurora・Cognito・SES・WAF など)の重大な通知と仕様の変更
  - name: OWASP Top 10
    url: https://owasp.org/www-project-top-ten/
    covers: よく使われる攻撃と対策の変化
  - name: OWASP ASVS
    url: https://owasp.org/www-project-application-security-verification-standard/
    covers: 確かめるべき守りの一覧の変化
  - name: IPA 重要なセキュリティ情報
    url: https://www.ipa.go.jp/security/security-alert/
    covers: 日本で広く使われる物の重大な穴
  - name: 個人情報保護委員会
    url: https://www.ppc.go.jp/news/
    covers: 個人情報保護法の改正・漏えいの届け出の決まりの変化
  - name: IPA SCS 評価制度(要求事項・評価基準・評価ガイド)
    url: https://www.ipa.go.jp/security/scs/details.html
    covers: 国のサプライチェーンの評価制度(★3・★4)の公表物と改訂(docs/compliance/scs.md の対応表)
  - name: Claude Code の変更履歴
    url: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md
    covers: フック・権限・スキルの仕様の変更(キットの守りの3層に当たる)

items:
  # ── 毎週(立ち上げから。自動で確かめる)────────────────────────────────
  - id: w-vuln
    title: 重い脆弱性が開いたままになっていないか
    why: 使っている部品の穴を、届くかどうか精査しないまま放っておかないため
    if_ignored: 外から届く穴が、気づかれないまま本番に残る
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: vulns
    severity: high
    controls: [ A.8.8, A.5.7 ]
    evidence: [ github-security ]
    status: open
    history: []
    source: docs/playbook.md の「毎週やること」(脆弱性)
    review_by: 2027-04-20

  - id: w-renovate
    title: 依存の更新(Renovate)が流れているか
    why: 部品の更新が止まると、直った版に上がらないまま古い穴が残る
    if_ignored: 更新の PR が溜まって、まとめて上げるときに壊れやすくなる
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: renovate-flow
    severity: normal
    controls: [ A.8.8, A.5.21 ]
    status: open
    history: []
    source: 2026-10-20 の点検(依存の更新が一度も流れていない)
    review_by: 2027-04-20

  - id: w-guards
    title: 危険度「高」の守りが一覧とそろっているか(pnpm guards)
    why: 認証・DB・CI などを AI が人の確認なしに変えられないようにする守りが、抜けていないかを見る
    if_ignored: 守りから抜けた場所を、AI が確認なしに書き換えられる
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: guards
    severity: high
    controls: [ A.8.4, A.8.32 ]
    status: open
    history: []
    source: 2026-10-20 の点検(ask から抜けていた所が6つ)
    review_by: 2027-04-20

  - id: w-protection
    title: ブランチ保護と Environments が外れていないか・setup.yml とずれていないか
    why: 検査を通らない変更や、main 以外からの本番への配備を止める設定が、今も効いているか、.github/setup.yml(正)と同じかを見る
    if_ignored: 赤い CI のまま入る・試しのブランチから本番に出せる・取り込んだ必須のチェックが必須にならないまま
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: protection-and-envs
    severity: high
    controls: [ A.8.4, A.8.32, A.8.31 ]
    evidence: [ github-ruleset, github-environments ]
    status: open
    history: []
    source: 2026-10-20 の点検(GitHub の守りが効いていなかった)
    review_by: 2027-04-20

  - id: w-secrets
    title: 秘密(鍵・パスワード)が漏れた見つけ物が無いか
    why: リポジトリに入った鍵は、消しても履歴から読める。早く気づいて鍵を替えるため
    if_ignored: 漏れた鍵で、他人が AWS や外のサービスを使える
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: secret-scanning
    severity: high
    controls: [ A.5.17, A.8.12 ]
    evidence: [ github-security ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(毎週の自動の確かめ)
    review_by: 2027-04-20

  - id: w-minutes
    title: GitHub Actions の分数が枠を超えそうでないか
    why: 非公開のリポジトリは月の分数に枠があり、超えるとお金がかかるか CI が止まる
    if_ignored: 月の途中で CI が動かなくなる
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: actions-minutes
    severity: normal
    controls: [ A.8.6 ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(毎週の自動の確かめ)
    review_by: 2027-04-20

  - id: w-decisions
    title: 期限の過ぎた「保留」・残った「仮決め」が無いか(pnpm decisions)
    why: AI が仮に決めて人の答えを待っている物を、置き去りにしないため
    if_ignored: 人が決めていないことが、決まったことのように本番に入る
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: decisions
    severity: normal
    controls: [ A.5.8 ]
    status: open
    history: []
    source: docs/playbook.md の「毎週やること」(未確定事項)
    review_by: 2027-04-20

  - id: w-ledger
    title: 見直す日の過ぎた台帳の項目が無いか・世の中の変化を取り込む時期か(/checkup-refresh)
    why: 世の中が変わると、台帳の項目そのものが古くなる。見直す日と、月1回の取り込みで気づくため
    if_ignored: もう意味の無い点検を続け、要る点検が抜ける
    who: system
    phase: setup
    every: weekly
    verify: auto
    check: ledger-review
    severity: normal
    controls: [ A.5.6, A.5.7, A.5.36 ]
    evidence: [ checkup-ledger ]
    status: open
    history: []
    source: docs/designs/0007-checkup.md の 6.(毎週の自動の確かめ)
    review_by: 2027-04-20

  # ── 立ち上げ ─────────────────────────────────────────────────────
  - id: gh-plan
    title: リポジトリを公開にするか、Pro / Team にする
    why: 非公開で無料のプランだと、ブランチ保護が効かない(設定しても無視される)
    if_ignored: どの守りを入れても、main に直接入れられる
    who: human
    phase: setup
    every: once
    verify: auto
    check: github-plan
    severity: high
    controls: [ A.8.32 ]
    status: done
    history:
      - { on: 2026-10-20, by: checkup, result: fail, note: 非公開+Free で保護の API が 403 }
      - { on: 2026-10-22, by: pnpm checkup, result: pass, note: 公開のリポジトリになった }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: gh-protection
    title: main のブランチ保護(PR 必須・CI 必須・最新に追いついてから)
    why: AI や人が、検査を通らない変更を本番の元に入れないため
    if_ignored: 赤い CI のままマージできる。AI が main に直接入れられる
    who: human
    phase: setup
    every: once
    verify: auto
    check: github-protection
    severity: high
    controls: [ A.8.4, A.8.32, A.5.3 ]
    evidence: [ github-ruleset ]
    status: done
    history:
      - { on: 2026-10-20, by: checkup, result: fail, note: 非公開+Free で 403 }
      - { on: 2026-10-22, by: pnpm checkup, result: pass, note: ルールセットで PR 必須・CI 必須・最新に追いついてから }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: gh-envs
    title: Environments(stg・prod・claude)を main だけにする
    why: 試しのブランチから本番や AI の権限を使えないようにする
    if_ignored: どのブランチからでも本番に配備できる
    who: human
    phase: setup
    every: once
    verify: auto
    check: github-environments
    severity: high
    controls: [ A.8.2, A.8.31, A.5.3 ]
    evidence: [ github-environments ]
    status: done
    history:
      - { on: 2026-10-22, by: pnpm checkup, result: pass, note: stg・prod・claude とも main だけ }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: dep-renovate
    title: Renovate を入れる(GitHub App)
    why: 部品の更新の PR を自動で出す仕組み。入れないと更新が人の記憶頼みになる
    if_ignored: 部品が古いまま残り、直った穴にも上がらない
    who: human
    phase: setup
    every: once
    verify: auto
    check: renovate-installed
    severity: normal
    controls: [ A.8.8, A.5.21 ]
    status: open
    history:
      - { on: 2026-10-20, by: checkup, result: fail, note: Renovate の PR が一度も無い }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: dep-alerts
    title: Dependabot の通知と secret scanning をオンにする
    why: 部品の穴と、漏れた鍵を GitHub が見つけて知らせてくれる
    if_ignored: 穴や漏れに、誰かに言われるまで気づかない
    who: human
    phase: setup
    every: once
    verify: auto
    check: security-features
    severity: high
    controls: [ A.8.8, A.5.17 ]
    evidence: [ github-security ]
    status: done
    history:
      - { on: 2026-10-22, by: pnpm checkup, result: pass, note: Dependabot の通知・secret scanning ともオン }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: acct-mfa
    title: GitHub・AWS(root と人)・Sentry・ドメインの業者に二段階認証
    why: パスワードが漏れても、スマホの確認が無いと入れないようにする(二段階認証 = パスワード+スマホの確認)
    if_ignored: パスワード1つで、本番やドメインを乗っ取られる
    who: human
    phase: setup
    every: half-year
    verify: ask
    question:
      text: GitHub・AWS(root と人のアカウント)・Sentry・ドメインの業者の全部で、二段階認証をオンにしましたか
      options:
        - { label: 全部オンにした, means: 半年後にもう一度聞きます }
        - { label: まだのものがある, means: 残りの設定の手順を出します。来週また聞きます, after: open }
      recommended: 全部オンにした
      irreversible: false
    severity: high
    controls: [ A.8.5, A.5.17 ]
    evidence: [ aws-iam-summary, aws-iam-users ]
    status: open
    history: []
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: local-aws-credentials
    title: AI を動かす端末に、本番の AWS に届く資格情報を置かない
    why: Claude Code が止めているのは aws の CLI だけ。AI が書いたスクリプトは、手元の SSO のセッションやアクセスキーで本番に届く(docs/guides/local-guards.md の「手元の資格情報」)
    if_ignored: 手元の AI が調べ物や仕込まれた指示で書いたスクリプトが、本番のデータを読む・消す。確認に「はい」を押した人は、中で本番に届くと気づかない
    who: human
    phase: setup
    every: quarterly
    verify: ask
    question:
      text: AI(Claude Code)を動かす端末で、既定のプロファイル(AWS_PROFILE と ~/.aws/config の default)が本番(prod)でなく、本番のアクセスキーが ~/.aws/credentials に無く、本番の SSO のセッションを使い終わったら切っていますか
      options:
        - { label: 全部そうなっている, means: 次の四半期にもう一度聞きます }
        - { label: まだの所がある, means: 手引きの「手元の資格情報」の直し方(既定を dev に・鍵を消す・本番の許可セットを1時間に)を出します。来週また聞きます, after: open }
      recommended: 全部そうなっている
      irreversible: false
    severity: high
    controls: [ A.8.2, A.8.5, A.5.15 ]
    status: open
    history: []
    source: docs/scenarios/10-ai-incidents.md の 10-2・10-8(G-59)
    review_by: 2027-10-27

  - id: acct-two-admins
    title: 管理者を2人にする
    why: 1人が倒れたり辞めたりしても、GitHub や AWS の設定を直せるようにする
    if_ignored: 管理者が1人だけだと、その人がいないと誰も直せない
    who: human
    phase: setup
    every: once
    verify: ask
    question:
      text: GitHub と AWS の管理者を、2人目の人に任せられますか
      options:
        - { label: 2人目を決めた, means: 2人目を管理者にする手順を出します }
        - { label: 今は1人しかいない, means: 1人で回す間の備え(引き継ぎの置き場)を docs/runbooks/emergency-access.md の型で作ります。半年ごとに emergency-access が見直しを聞きます }
      recommended: 2人目を決めた
      irreversible: false
    severity: normal
    controls: [ A.8.2, A.5.30 ]
    evidence: [ github-collaborators ]
    status: open
    history: []
    source: 2026-10-20 の点検 / docs/runbooks/emergency-access.md(2026-10-29 に、無かった手順書を作って選択肢から結んだ。G-67 で足した)
    review_by: 2027-04-20

  - id: emergency-access
    title: 引き継ぎの置き場(どこに何のアカウントがあり、誰が持ち、どう取り戻すか)を見直す
    why: 持ち主が倒れたり辞めたりしても、AWS の root・ドメイン・GitHub の組織・請求に入り直せるようにする(docs/runbooks/emergency-access.md)
    if_ignored: パスワードが分かっていても、二段階認証の機器や更新の通知が辞めた人の手元にあって入れない
    who: human
    phase: setup
    every: half-year
    verify: ask
    question:
      text: docs/runbooks/emergency-access.md の型の一覧(公開しない保管庫に置いた物)は、今のアカウント・請求・二段階認証の機器・緊急のときに開ける人と合っていますか
      options:
        - { label: 合っている, means: 半年後にもう一度聞きます }
        - { label: まだ作っていない・古い, means: 手順書の 2〜4 で一覧を作り直す手順を出します。来週また聞きます, after: open }
      recommended: 合っている
      irreversible: false
    severity: normal
    controls: [ A.5.30, A.8.2 ]
    status: open
    history: []
    source: docs/scenarios/11-people-leave.md の 11-5(G-67 で足した。2026-10-29)
    review_by: 2027-10-29

  - id: notify-route
    title: 知らせの先と、障害のときの連絡先を決める
    why: 障害や点検の知らせが、誰にも届かないまま流れないようにする
    if_ignored: アラームが鳴っても誰も気づかない
    who: human
    phase: setup
    every: once
    verify: ask
    question:
      text: 点検と障害の知らせを、どこで受け取りますか
      options:
        - { label: GitHub のアプリとメール, means: 追加の設定なしで届きます(Issue の担当者にする) }
        - { label: Slack にも送る, means: Slack の Webhook を秘密に置く手順を出します }
      recommended: GitHub のアプリとメール
      irreversible: false
    severity: normal
    controls: [ A.5.24, A.6.8 ]
    status: open
    history: []
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: coverage-total
    title: カバレッジの下限を、単体と結合を合わせて見る
    why: DB を使う所は結合テストで確かめている。単体だけの割合だと、本当に試せている量が分からない
    if_ignored: テストが減っても、下限の検査が気づかない
    who: ai
    phase: setup
    every: once
    verify: auto
    check: coverage-total
    severity: normal
    controls: [ A.8.29 ]
    status: done
    history:
      - { on: 2026-10-22, by: pnpm checkup, result: pass, note: PR 15 で API のカバレッジを単体と結合を合わせて測るようにした }
    source: 2026-10-20 の点検
    review_by: 2027-04-20

  - id: runbook-attack
    title: 攻撃の手順書(総当たり・大量アクセス・API の悪用)と、WAF が止めた数のアラーム
    why: 攻撃を受けたときに、慌てずに止める手順と、攻撃に気づく見張りを先に持っておく
