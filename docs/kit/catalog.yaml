    needed_by: 要配慮個人情報を扱う
    not_needed_by: 要配慮個人情報を扱わない(使わない間は費用0。Terraform の sensitive_data_enabled が false・DB には空のスキーマとデータ鍵の表だけ。消すと、後で要配慮を足すときに作り直しになるので消さない)
    if_removed: 消さない(使わない間は Terraform で作らない)
    depends_on: [column-classification, offboarding]
    law:
