    what: 組織の管理者が期間(日付・366 日まで)を選び、監査ログを1行1件の JSON(JSON Lines)で古い順に受け取る(1ページずつ流す。項目は画面と同じ・値は入っていない)。書き出したことも監査ログに残る。プランの機能 audit-export(既定のプランには無い)
