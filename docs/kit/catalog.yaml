    needed_by: 大きな会社向け(会社のアカウントでログインさせたい・退職で止めたい)
    not_needed_by: 個人向け・小さな会社だけが相手
    if_removed: 会社の IdP でログインさせられない(大きな会社の調達の質問票で落ちることがある)
