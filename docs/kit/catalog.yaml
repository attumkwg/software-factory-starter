  - id: purpose-judge
    name: 意義の判断役と歯止めの3つ(やる / やらない / 条件つき)
    group: process
    status: あり
    removable: true
    default: 残す
    what: アイデア・大きな依頼を分ける前・受け入れの3つの場面で、「意義があるから、やる / やらない / 条件つき」を意義の1行(誰の・どんな困りごとが・どれだけ減るか)・ROI の見込み・止める線つきで言い切り、記録に残す。歯止めは、数で言えなければやらない・ROI は式から出す(手で上げない)・期限の後に当たり外れを出し、正しかったかは人が判定する。pnpm kpi が記録の形を落とす
    needed_by: 作る物が増えて、どれをやるかを速く言い切りたい・判断の当たり外れを後で確かめたい
    not_needed_by: 作る物が1つに決まっていて、選ぶ場面が無い
    if_removed: 合議や話し合いが条件を集めるだけで、誰も「やる / やらない」を言わない。熱意で何にでも意義を見つける
    depends_on: [persona-kpi]
    law: []
    where: [.claude/agents/purpose-judge.md, scripts/verdict-lib.mjs, docs/product/verdicts/_template.md, docs/kit/verdicts, docs/guides/kpi.md]
    remove:
