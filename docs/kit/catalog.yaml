    needed_by: 機能を作る理由を数で言いたい・KPI の達成を見て資産価値を高めたい(既存のリポジトリにも、この2ファイルだけ先に入れられる)
    not_needed_by: 確かめずに作るだけの試作
    if_removed: 賭けの線はあるが、プロダクト全体のどの数を動かしたかが残らない。資産の根拠が合格の線だけになる
