    name: 脆弱性の精査と対応方針(/cve)
    group: dev
    status: あり
    removable: true
    default: 残す
    what: Dependabot の通知・Trivy・OSV・基盤と主な依存の発表を集め、関係あるかを6段で精査し、期限つきの直し方を決める。記録(docs/security/vulns.md)と通知の突き合わせは pnpm vulns
    needed_by: 依存を使うすべて(通知を人が読んで判断する手間と、急ぐべき穴の見落としを減らす)
    not_needed_by: なし(手で呼ぶだけなので、残してもお金はかからない)
    if_removed: 通知が来ても「関係あるか・いつまでに直すか」を人が毎回調べる。届く穴を公開の Issue に書いてしまう
    depends_on: [ci-checks]
    law:
      - ISMS 8.8(技術的脆弱性の管理)
      - SOC 2 CC7.1
    remove:
      delete:
        - .claude/skills/cve
        - docs/guides/vulnerabilities.md
        - docs/security/vulns.md
        - scripts/vulns-lib.mjs
        - scripts/vulns.mjs
        - scripts/vulns.test.mjs
      edit:
        - { path: package.json, what: vulns を外す・test:scripts から vulns.test.mjs を外す }
        - { path: .github/workflows/vuln-scan.yml, what: Issue の本文の /cve の2行と、頭のコメントの /cve を外す }
        - { path: CLAUDE.md, what: /cve の所を外す }
        - { path: docs/reference.md, what: 「コマンドの全部」の pnpm vulns の行を外す }
        - { path: docs/security.md, what: /cve の行を外す }
        - { path: docs/playbook.md, what: 脆弱性の行を外す }
        - { path: scripts/checkup/checks/vulns.mjs, what: 消し、台帳(docs/checkup/todo.yaml)の w-vuln を引退(retired)にする(点検を残すとき) }

  - id: security-questionnaire
    name: セキュリティの質問票の下書き(/security-questionnaire)
    group: rules
    status: あり
    removable: true
    default: 残す
    what: お客さんから届いたセキュリティの質問票に、docs/security.md の決まり・適用宣言書・委託先の一覧・手順書・SLA と取り扱いの取り決めの型・点検の答えから、答えの下書きを根拠のリンクつきで作る。「はい」は根拠があり本番で有効だと確かめた物だけ。下書きはリポジトリの外・出す前に責任者が確かめる
    needed_by: 会社向けで、病院・大企業などからセキュリティの質問票が届く
    not_needed_by: 個人向けだけ・質問票が来ない
    if_removed: 質問票のたびに、営業とセキュリティの担当が手で資料を探す。根拠の無い「はい」を書いてしまう
    depends_on: [vendor-ledger, contract-templates]
    law:
