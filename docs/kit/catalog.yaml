  - id: progress-control
    name: 依頼ごとの進み具合の管制(pnpm progress)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 親 Issue(印 kind:feature)の本文の子の一覧と「待つ」から、n/m・次に進められる子・待つ子・止まった PR(2日動かない・進められるのに PR が無い)・完成(子が全部閉じた+受け入れ)を出し、親の本文に「📍 進み具合」を書く。依頼から届くまでの日数の中央値も出す
    needed_by: 大きな依頼を子の Issue・PR に割って AI に回し、どこまで進んだか・どこで止まったかを毎日見たい
    not_needed_by: 依頼がいつも PR 1本で終わる
    if_removed: 子が何本済んだか・何を待っているかを、人が Issue を開いて数える。止まった PR に誰も気づかない
    depends_on: []
    law: []
    where: [scripts/progress.mjs, scripts/progress-lib.mjs, .github/workflows/progress.yml]
