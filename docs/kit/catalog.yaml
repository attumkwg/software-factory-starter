  # ── 進め方 ────────────────────────────────────────────────────────────
  - id: kickoff
    name: 始め方の計画(/kickoff)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 誰の困りごとか・いちばん危ない思い込み・確かめ方・合格と撤退の線を、1問ずつ決めて計画にする
    needed_by: PMF の前
    not_needed_by: 作る物も売り先も決まっている(それでも残して害は無い)
    if_removed: 作る前に確かめる段取りが無くなる
    depends_on: []
    law: []
    remove:
      delete: [.claude/skills/kickoff, docs/guides/before-pmf.md, docs/product/_template.md]
      edit:
        - { path: docs/getting-started.md, what: 「⓪ 何を作るかを決める」を外す }

  - id: bets
    name: 機能ごとの賭け(/bet)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 機能ごとに「何を賭けて・何が分かったら続けるか」を先に書き、小さく確かめながら進める。PR の本文に取り組みと作業の種類を書く
    needed_by: PMF の前後で、作る物の当たり外れが大きい
    not_needed_by: 作る物が決まっている受託
    if_removed: 作った機能が効いたかを振り返れない。資産と費用を分ける元(PR の取り組み)が無くなる
    depends_on: [kickoff]
    law: []
    remove:
      delete:
        - .claude/skills/bet
        - docs/guides/bets-and-assets.md
        - docs/product/bets
        - scripts/bets-lib.mjs
        - scripts/bets.mjs
