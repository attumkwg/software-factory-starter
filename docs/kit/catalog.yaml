        - { path: apps/api/src/domains/organizations/security-routes.ts, what: scimTokenRoutes を外す }
        - { path: apps/api/src/authz/policy.ts, what: scim:manage と9行を外す }
        - { path: apps/api/src/audit/actions.ts, what: scim_token.*・scim.* を外す }
        - { path: packages/shared/src/feature-flags.ts, what: scim を外す }
        - { path: apps/web/src/pages/SettingsPage.tsx, what: SCIM の欄を外す }
      migration: 表 organizations.scim_tokens・関数 auth_find_scim_token・scim_create_user(移行 0022)を、使わなくしてから消す。列 users.disabled_at は止めた人がいれば残す(消すと止めた人が入れるようになる)
