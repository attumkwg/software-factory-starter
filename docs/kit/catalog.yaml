    what: 人が見ていない AI の作業を、許可リストのプロキシと firewall で絞った devcontainer(中の Docker で結合テスト・E2E が回る)か、Web と GitHub 以外の MCP を持たない背景の AI でだけ回す。CI と背景の AI のテストのコンテナは外へ出られない。外へ向けた操作を記録し、PR の「外へ出した物」に並べる
