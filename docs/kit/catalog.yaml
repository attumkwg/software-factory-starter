  - id: acceptance
    name: 受け入れの点数と書き戻し(/accept)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 作った機能を出す前の受け入れで、おすすめの観点(流れ・ルール・作り込み・仮決め)を中心に PdM に聞き、網羅の確かめは AI と QA に回す。結果を点数にし、外れた理由を要求・設計・AI の仮決め・実装に分け、要求のせいの物を解決済みの論点に書き戻す。記録を取るかは使うときに決める。書き方の崩れは CI(test:scripts)が止め、観点のおすすめから外れた所は知らせるだけ
    needed_by: PdM が受け入れで詰まり所になっている・同じ種類の書き漏らしが仕様で繰り返される
    not_needed_by: 1人で作って1人で使っている間(受け入れる人と作る人が同じ)
    if_removed: 受け入れが人の記憶だけに残り、仕様の書き漏らしが次の仕様に持ち越される
