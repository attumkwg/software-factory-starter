        - { path: scripts/pr-merge-when-green.mjs, what: reviewed() の2か所を外す }
        - { path: scripts/pr-merge.test.mjs, what: レビューの記録のテストを外す }
        - { path: package.json, what: test:scripts の scripts/review-viewpoints.test.mjs を外す }
        - { path: .claude/hooks/protected-paths.json, what: reviewer.md と review-viewpoints.md の2行を外す(labeler.yml・CODEOWNERS も) }
