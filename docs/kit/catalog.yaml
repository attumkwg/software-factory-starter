    needed_by: 機能や KPI を、立場の違う人の目で速く確かめたい・業界ごとに客層を広げる
    not_needed_by: 使う人が1種類だけの小さな道具
    if_removed: KPI と機能の判断が、作り手1人の思いつきになる。止める人・周りの人の反対に、出してから気づく
