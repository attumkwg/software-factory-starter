  - id: human-decisions
    name: 人が決めることの一覧と判断待ちの積み場(pnpm queue)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 人が決めることを1か所に集め、強制か頼みかを書く。判断待ち(印か問いのある PR・needs-human の Issue・人の判定待ちの意義の判断)を古い順に、毎朝「🧑‍⚖️ 判断待ち」の Issue 1つ(と Slack)に出す。PR の問いは多くて2つ(CI)。答えは会話でもらい、工場が PR に記録する
    needed_by: 人の出番を減らしたい・判断待ちがどこに溜まっているかを毎日見たい
    not_needed_by: 人の判断が週に数件で、全部覚えていられる
    if_removed: 人が決めることがスキルと手引きに散らばり、どれが仕組みで止まるか分からない。判断待ちが PR の中に埋もれる
