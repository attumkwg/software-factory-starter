  - id: slack-requests
    name: Slack で頼むと PR → 返事でマージ(/slack-request)
    group: process
    status: あり
    removable: true
    default: 残す
    what: Slack(Claude Code in Slack)・クラウドで頼まれた1件を、AI が1本の PR にし、終わりに仮決めを並べて「これでいいですか」と聞く。1人の間は、持ち主の会話の返事を未確定事項の答えに認め、持ち主が環境に KIT_AI_MERGE=slack を入れた所でだけ、返事の言葉と日時を PR に残して、必須のチェックが全部緑のときに AI がマージする(危険度「高」も。pnpm pr:merge-when-green・ADR 0085)
    needed_by: 1人(か少人数)で、Slack から頼んで AI に作らせたい
    not_needed_by: 人が増えてレビューの人数を 1 以上にした(会話の答えと AI のマージは自動で止まる)
    if_removed: 頼むたびに手元の Claude Code で対話し、答えは GitHub のコメント、マージは人が押す
    depends_on: []
    law: []
    where: [.claude/skills/slack-request/SKILL.md, scripts/pr-merge-when-green.mjs, scripts/pr-merge-lib.mjs, scripts/cloud-setup.sh, docs/guides/slack.md]
