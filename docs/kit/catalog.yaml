# キットの部品のカタログ(いまの正)。
# 自分のプロダクトに「要るか」を確かめて、要らない部品を消すためのチェックシート。`/tailor` がこれを読む。
#   pnpm kit:catalog            書式・つながり・消し方のパスが正しいか・土台を消す答えになっていないか・README の生成し忘れ
#   pnpm kit:catalog --show <id> 1つの部品(頼っている/頼られている を含む)
#   pnpm kit:readme             README の「使い始めたらやること」をここから作り直す
# 書き方:
#   - 部品を足したら、ここに1件足す(消し方は実際のファイルを見て書く。CI がパスの実在を確かめる)。
#   - removable: false は「土台」。どの答えでも消さない。消し方は書かない。
#   - status: あり(main にある)/ 作成中(PR が開いている。パスは確かめない)/ 未(まだ無い。足す候補)
#   - remove の docs は、消さずに頭に「このプロダクトでは消した」と1行足す資料(仕様・ADR は記録なので書き換えない)。
#   - 法令・認証との関係は「分かる範囲で」。認証を取るとき・法令の判断は専門家と確かめる。
#     ISMS は ISO/IEC 27001:2022 の附属書 A の番号、SOC 2 は Trust Services Criteria の番号。
# 考え方: docs/adr/0021-kit-catalog-and-tailoring.md

version: 1

# ── 使い始めたらやること(README の節はここから作る)───────────────────────────────
start_steps:
  - title: GitHub を一括で整える
    command: pnpm setup:github
    does: 試しで今の設定との差分を見て、--apply で反映する(ブランチ保護と必須のチェック・ラベル・Environments・Actions の設定・定期の運用を始める印 KIT_ROLE)。何度流しても同じ。秘密の値・Renovate の App など人がやることも一覧で出す。ラベルの意味は docs/guides/labels.md
    link: docs/guides/github-setup.md
    status: あり
  - title: 何を作るかを決める
    command: /kickoff
    does: 誰の困りごとか・いちばん危ない思い込み・確かめ方・合格と撤退の線を、1問ずつ決める
    writes: docs/product/plan.md
    status: あり
  - title: 部品を選ぶ
    command: /tailor
    does: 会社向けか・個人情報・お金・メール・検索・スマホ・認証の予定を聞き、部品ごとに「残す・消す」を決める。消す部品は1つずつ PR で
    writes: docs/product/tailoring.md
    status: あり
  - title: 手でやる設定
    command: null
    does: Renovate の App と秘密の値(GitHub の残りは pnpm setup:github が一覧で出す)、AWS のアカウントと状態の置き場、Slack、バックアップの確かめ
    link: docs/guides/manual-setup.md
    status: あり
  - title: 点検を立ち上げる
    command: pnpm checkup:adopt
    does: 台帳の使い始めた日と担当者を自分の物にし(pnpm checkup:adopt --by @自分)、最初の /checkup-refresh を流す。pnpm checkup がいまの段階でやること(守りが効いているか・取り返せない所)を出し、自動で確かめられる物は確かめる。毎週月曜の朝に GitHub の Issue で知らせる(急ぎは毎日。キットから作ったリポジトリだけ)。人に聞くことは /checkup で1問ずつ答える
    writes: docs/checkup/todo.yaml
    link: docs/checkup/README.md
    status: あり
  - title: キットが既定で決めた所を決める
    command: pnpm decisions --adopt
    does: 設計書の未確定事項のうち、答えがプロダクトごとに違う物(導入時に決める)を出す。/tailor で設計書ごとに「既定のままでよいか」を答え、承認か変更にする。本番に出す前に pnpm decisions --launch が通ることを確かめる
    writes: docs/designs/*.md
    link: docs/guides/human-review.md
    status: あり

# ── /tailor が聞くこと(人に聞くのは4つだけ: どれも事業判断か戻せないリスク)───────────
questions:
  - id: audience
    text: 会社向け(B2B)か、個人向け(B2C)か
    kind: 戻せないリスク
    options: [会社向け, 個人向け, まだ分からない]
    recommended: 会社向け
    why: データの分け方(組織ごと)は後から変えるのが高い。迷ったら会社向けの形のまま
  - id: personal-data
    text: 個人情報・要配慮個人情報(病歴・信条など)を扱うか
    kind: 戻せないリスク
    options: [ふつうの個人情報だけ, 要配慮も扱う, ほとんど扱わない]
    recommended: ふつうの個人情報だけ
    why: 漏れたときの報告の義務・要配慮は取るときに本人の同意が要る(個人情報保護法 20条2項)
  - id: money
    text: お金を扱うか(請求・決済・金額の計算)
    kind: 事業判断
    options: [扱わない, 金額を計算する, 決済もする]
    recommended: 扱わない
    why: 決済をするなら、カード情報を持たない作り(決済の会社に任せる)と、特定商取引法の表示が要る
  - id: mail
    text: 利用者にメールを送るか
    kind: 事業判断
    options: [送る, 送らない]
    recommended: 送る
    why: ログインの確認のメールは Cognito が送る(この答えに関係なく残る)。ここで聞くのはアプリからのお知らせ
  - id: search
    text: 検索(Google など)から人を呼ぶか
    kind: 事業判断
    options: [呼ばない, 呼ぶ]
    recommended: 呼ばない
    why: ログインの後の画面は検索に載せない。呼ぶなら、公開のページを別に作る
  - id: mobile
    text: スマホのアプリを作るか
    kind: 事業判断
    options: [ブラウザだけ, スマホのアプリも, スマホのアプリだけ]
    recommended: ブラウザだけ
    why: アプリは古い版が残るので、API の項目は足すだけ・消さない(CI の「API の互換」が見張る)
  - id: certification
    text: 認証(P マーク・ISMS・SOC 2)を取る予定があるか
    kind: 事業判断
    options: [予定なし, P マーク, ISMS, SOC 2]
    recommended: 予定なし
    multi: true
    why: 取るなら、記録(監査ログ・アクセスの見直し・バックアップの訓練)を消さずに残す

# ── 部品の区分 ────────────────────────────────────────────────────────────
groups:
  - { id: foundation, name: 土台(消さない) }
  - { id: business, name: 会社向け }
  - { id: login, name: ログイン }
  - { id: contact, name: 連絡 }
  - { id: watch, name: 見張り }
  - { id: front, name: 表側(画面) }
  - { id: personal, name: 個人情報 }
  - { id: rules, name: 決まりごと }
  - { id: dev, name: 開発の道具 }
  - { id: process, name: 進め方 }

parts:
  # ── 土台(removable: false。どの答えでも消さない)─────────────────────────────
  - id: tenant-isolation
    name: テナント分離と RLS
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 全部の表に tenant_id を持ち、DB の RLS とアプリの両方で、他社のデータを読めなくする
    needed_by: すべて(個人向けでも「1人 = 1組織」として使う)
    not_needed_by: なし
    if_removed: 他社のデータが見える事故を、作りで止められなくなる
    depends_on: []
    law:
      - 個人情報保護法 23条(安全管理措置)
      - ISMS 8.3(情報へのアクセス制限)
      - SOC 2 CC6.1
    where: [apps/api/src/db/tenant.ts, apps/api/drizzle/0001_rls.sql, docs/adr/0001-shared-tables-with-rls.md]

  - id: organizations
    name: 組織と利用者・ロール
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 組織(テナント)と利用者、admin / member / viewer のロール
    needed_by: すべて。テナント分離と認可がこれを前提にしている
    not_needed_by: なし(個人向けは「1人 = 1組織」・ロールは admin だけ、として使う)
    if_removed: テナントもロールも決められなくなる。分け方を変えるなら消すのではなく /design と ADR で作り直す
    depends_on: [tenant-isolation]
    law:
      - ISMS 5.18(アクセス権)
    where: [apps/api/src/domains/organizations, packages/shared/src/roles.ts]

  - id: authz
    name: 認可の関所と権限の表
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 全部の API が1か所の関所を通り、表(matrix.yaml)に無い API は既定で拒否する。表の全行をテストで叩く
    needed_by: すべて
    not_needed_by: なし
    if_removed: 権限の書き忘れが、そのまま穴になる
    depends_on: [organizations]
    law:
      - ISMS 5.15(アクセス制御)・8.3
      - SOC 2 CC6.1・CC6.3
    where: [apps/api/src/authz, docs/authz/matrix.yaml, apps/api/test/unit/authz-coverage.test.ts]

  - id: login
    name: 自前のログイン画面と Cognito
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 自前の画面 → API → Cognito でログイン・登録・パスワードの再設定。トークンはサーバーの中だけ。手元とテストは偽物の Cognito
    needed_by: すべて(ログインが無いと本番に出せない)
    not_needed_by: なし。別の仕組み(Auth0 など)にするなら、消すのではなく /design と ADR で入れ替える
    if_removed: 本番でログインできない
    depends_on: [organizations]
    law:
      - ISMS 8.5(セキュアな認証)・5.17(認証情報)
      - SOC 2 CC6.1
    where: [apps/api/src/auth, apps/web/src/pages/LoginPage.tsx, packages/fake-cognito, docs/adr/0007-cognito-login-server-side.md]

  - id: secrets
    name: 秘密の扱い
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 秘密は Secrets Manager と GitHub の Environment にだけ置く。gitleaks で全履歴を見る。漏れたときの手順書
    needed_by: すべて
    not_needed_by: なし
    if_removed: 鍵がコードやログに混ざっても気づけない
    depends_on: []
    law:
      - ISMS 5.17(認証情報)・8.24(暗号の利用)
      - SOC 2 CC6.1
    where: [.gitleaksignore, docs/runbooks/secret-leak.md]

  - id: backup
    name: バックアップと戻す訓練
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 消せない保管庫に毎日と毎月。毎月 stg で戻す訓練
    needed_by: すべて
    not_needed_by: なし
    if_removed: 消えたデータ・壊れたデータを戻せない
    depends_on: []
    law:
      - ISMS 8.13(情報のバックアップ)・5.30(事業継続のための ICT の備え)
      - SOC 2 A1.2・A1.3
    where: [infra/terraform/modules/backup, .github/workflows/restore-drill.yml, docs/runbooks/db-restore.md]

  - id: ci-checks
    name: CI の検査
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 型・lint・単体・結合(2社)・E2E・API の互換・移行(squawk)・Semgrep・Trivy・gitleaks・ワークフローの検査・未確定事項の仮決め(decisions --strict)・ADR の番号の重なり
    needed_by: すべて(AI の PR を人が全部は読まない前提の守り)
    not_needed_by: なし
    if_removed: AI の間違いが、そのまま main に入る
    depends_on: []
    law:
      - ISMS 8.25(セキュアな開発のライフサイクル)・8.28・8.29・8.8(技術的脆弱性の管理)
      - SOC 2 CC8.1・CC7.1
    where: [.github/workflows/ci.yml, .semgrep/rules.yml, docs/guides/ci-limits.md, scripts/decisions.mjs, scripts/adr.mjs, scripts/self-contained.mjs]

  - id: logging
    name: ログの決まり
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 構造化ログ・request ID・必要な項目だけを残す(オブジェクトを丸ごと渡さない)
    needed_by: すべて
    not_needed_by: なし
    if_removed: 障害の原因を追えない・ログに個人情報が混ざる
    depends_on: []
    law:
      - ISMS 8.15(ログ取得)
      - 個人情報保護法 23条
    where: [apps/api/src/logger.ts, apps/api/test/unit/logger.test.ts]

  - id: log-allowlist
    name: ログの許可リスト(出してよい項目だけ)
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: ログに出してよい項目を決めておき、それ以外は落とす。全部の API を目印つきの値で叩き、個人情報がログに出ないことをテストで確かめる
    needed_by: 個人情報を扱うすべて
    not_needed_by: なし
    if_removed: 新しい項目を足したとき、個人情報がそのままログに出る
    depends_on: [logging, column-classification]
    law:
      - 個人情報保護法 23条(安全管理措置)
      - ISMS 8.15(ログ取得)・8.12(データ漏えいの防止)

  - id: harness
    name: AI のハーネス(守りの一覧とフック)
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 危険度「高」の場所は AI が人の確認なしに変えない。Bash のフック・CODEOWNERS・ラベルと一覧をそろえる
    needed_by: すべて(AI が PR を出す前提のキット)
    not_needed_by: なし
    if_removed: AI が認可・移行・CI を黙って書き換えられる
    depends_on: [ci-checks]
    law:
      - ISMS 8.32(変更管理)
      - SOC 2 CC8.1
    where: [.claude/hooks/protected-paths.json, .claude/hooks/guard-edit.mjs, .claude/hooks/guard-bash.mjs, scripts/check-guards.mjs, docs/guides/local-guards.md]

  - id: github-setup
    name: GitHub の一括のセットアップとラベルの一覧
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: GitHub の設定(ブランチ保護と必須のチェック・Environments・Actions・守りの機能・ラベル)をファイル(.github/setup.yml・labels.yml)に置き、pnpm setup:github が差分を出して一括で反映する。使うラベル・必須のチェック・Environment がファイルに無ければ CI が落ちる。ひな形と使う側を変数 KIT_ROLE で見分け、定期の運用は使う側でだけ動く
    needed_by: すべて(守りの設定を手で直さず、ずれに気づくため)
    not_needed_by: なし
    if_removed: 守りの設定が手作業になり、手順と実際がずれる。ラベルが無くて Issue の作成やワークフローが動かない。ひな形で運用が回る
    depends_on: [ci-checks, harness]
    law:
      - ISMS 8.9(構成管理)・8.32(変更管理)
      - SOC 2 CC8.1
    where: [.github/setup.yml, .github/labels.yml, scripts/setup/run.mjs, scripts/setup/check.mjs, scripts/checkup/adopt-cli.mjs, docs/guides/github-setup.md, docs/adr/0027-setup-before-use-and-kit-role.md]

  - id: column-classification
    name: 列の分類表とログ
    group: foundation
    status: あり
    removable: false
    default: 残す
    what: 全部の列に「個人情報か」と目的を書き、要配慮は分けて置くまで足せないようにする。台帳(docs/db/personal-data.md)はここから作る
    needed_by: 個人情報を扱うすべて
    not_needed_by: なし
    if_removed: どこに個人情報があるかが分からず、開示・削除・漏えいの報告に答えられない
    depends_on: [tenant-isolation]
    law:
      - 個人情報保護法 17条(利用目的の特定)・23条
      - ISMS 5.34(プライバシー及び PII の保護)
      - P マーク(個人情報の特定)
    where:
      - apps/api/src/db/classification.ts
      - apps/api/test/unit/classification.test.ts
      - docs/db/personal-data.md
      - docs/adr/0018-sensitive-data-isolation.md

  # ── 会社向け ────────────────────────────────────────────────────────────
  - id: audit-log
    name: 監査ログ
    group: business
    status: あり
    removable: true
    default: 残す
    what: 誰が・いつ・何をしたかを残し、お客さんの管理者が画面で見られる。書き込みの API は関所が自動で残す
    needed_by: 会社向け・お客さんに監査や説明の責任がある・認証を取る予定がある
    not_needed_by: 個人向けで、運営だけが見られればよい(アクセスログで足りる)
    if_removed: 「誰が消したか」に答えられない。代理ログインの記録の置き場が無くなる(解約の削除の記録は、消し方どおり外す)
    depends_on: [authz]
    law:
      - ISMS 8.15(ログ取得)
      - SOC 2 CC7.2
      - P マーク(記録)
    suggest_remove_when: [audience=個人向け]
    keep_when: [certification=P マーク, certification=ISMS, certification=SOC 2]
    remove:
      delete:
        - apps/api/src/audit
        - apps/api/drizzle/0006_audit_log.sql
        - apps/api/test/unit/audit-coverage.test.ts
        - apps/api/test/integration/audit.int.test.ts
        - apps/web/src/pages/AuditPage.tsx
        - apps/web/src/routes/_app/audit.tsx
        - apps/web/src/audit-labels.ts
        - apps/web/src/audit-labels.test.ts
        - apps/web/e2e/audit.spec.ts
      edit:
        - { path: apps/api/src/app.ts, what: auditRoutes の行を消す }
        - { path: apps/api/src/authz/middleware.ts, what: 書き込みの記録(capture)を外す }
        - { path: apps/api/src/export/routes.ts, what: 書き出しから auditEvents を外す }
        - { path: apps/api/src/db/schema.ts, what: audit の表の読み込みを外す }
        - { path: apps/api/src/offboarding/delete-tenant.ts, what: TENANT_TABLES から platform.audit_events を外す }
        - { path: apps/web/src/api.ts, what: 監査ログの呼び出しを外す }
        - { path: apps/web/src/pages/SettingsPage.tsx, what: 監査ログへのリンクを外す }
        - { path: packages/shared/src/schemas.ts, what: 監査ログの型は残してよい(足すだけの決まり) }
        - { path: CLAUDE.md, what: 「書き込みの API を足したら actions.ts に1行」を消す }
      migration: 表 platform.audit_events を消す移行を足す(.claude/skills/db-migration。0006 は書き換えない)
      matrix: [GET /api/audit-events]
      docs: [docs/specs/0003-audit-log.md, docs/adr/0013-audit-log.md]

  - id: support-access
    name: サポートの代理ログイン
    group: business
    status: あり
    removable: true
    default: 残す
    what: お客さんの管理者が許可した間だけ、運営の社員がその組織の画面を「見るだけ」で開ける
    needed_by: 会社向けで、問い合わせに画面を見て答える
    not_needed_by: 個人向け・問い合わせを画面を見ずに受ける
    if_removed: 問い合わせのたびに、お客さんに画面の写真を頼むことになる
    depends_on: [audit-log, organizations, mfa]
    law:
      - ISMS 8.2(特権的アクセス権)・5.18
      - SOC 2 CC6.2
      - 個人情報保護法 25条(委託先の監督。B2B ではお客さんが委託元)
    suggest_remove_when: [audience=個人向け]
    remove:
      delete:
        - apps/api/src/auth/support-routes.ts
        - apps/api/src/domains/organizations/support-routes.ts
        - apps/api/src/domains/organizations/support.ts
        - apps/api/test/integration/support-access.int.test.ts
        - apps/api/test/unit/support.test.ts
        - apps/web/src/pages/SupportGrantsPage.tsx
        - apps/web/src/pages/SupportStaffPage.tsx
        - apps/web/src/routes/_app/support-access.tsx
        - apps/web/src/routes/_app/support.tsx
        - apps/web/e2e/support.spec.ts
        - docs/runbooks/support-access.md
      edit:
        - { path: apps/api/src/app.ts, what: supportGrantRoutes・supportSessionRoutes・supportTenantId を外す }
        - { path: apps/api/src/authz/policy.ts, what: NOT_DURING_SUPPORT と代理の規則を外す }
        - { path: apps/api/src/auth/session.ts, what: セッションの support の欄を外す }
