        - { path: docs/authz/matrix.yaml, what: /api/pmf-survey の2行を外す }
        - { path: apps/web/src/routes/_app/index.tsx, what: 聞くかの読み込みを外す }
        - { path: apps/web/src/pages/ProjectsPage.tsx, what: PmfSurvey を外す }
        - { path: apps/web/src/api.ts, what: pmfSurveyStatus・answerPmfSurvey を外す }
        - { path: .tbls.yml, what: 2つの表の説明を外す }
        - { path: CLAUDE.md, what: PMF の兆しの文を外す }
        - { path: docs/guides/before-pmf.md, what: 画面の中で聞ける所を外す }
      migration: 表 platform.pmf_survey_asked・pmf_survey_counts を消す移行を足す(.claude/skills/db-migration。0016 は書き換えない)
      docs: [docs/specs/0046-pmf-survey.md, docs/adr/0057-pmf-survey-counts-only.md]

  - id: ledger
    name: 資産と費用の台帳(/ledger)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 月1回、賭けごとの人の時間とインフラ・SaaS を「資産の候補・費用・除却の候補」に分けた案(費用のページの ledger.csv)を1つずつ確かめ、賭けのファイルの「会計区分の判定」に足す。会計・税の当てはめは専門家が確かめる
    needed_by: お金と時間の使い方を説明する相手がいる(税理士・投資家・役員)
    not_needed_by: 1人で試している間
    if_removed: 作った物を資産にするか費用にするかの元の記録が、月ごとに残らない(費用のページの ledger.csv は残る)
    depends_on: [bets, cost-dashboard]
    law: []
    where: [.claude/skills/ledger/SKILL.md, scripts/cost/ledger.mjs, docs/guides/bets-and-assets.md]
    remove:
      delete: [.claude/skills/ledger]
      edit:
        - { path: docs/guides/cost-dashboard.md, what: /ledger の段を外す }
        - { path: CLAUDE.md, what: 「月1回の資産と費用の区分の案は /ledger」を外す }

  - id: metrics
    name: 週の数字(pnpm metrics)
    group: process
    status: あり
    removable: true
    default: 残す
    what: DORA の4つ(デプロイの頻度・リードタイム・変更の失敗率・復旧の時間)・AI が手伝った PR の割合(Actions がラベル ai:assisted を付けて数える)・人の介在率(人が答えた問い・人の手直し)・仕様の在庫を、決裁用(週ごとの並び)と改善用(先週の PR ごと)に分けて、毎週 Actions の要約に出す。人の名前と PR の中身・人ごとの数は出さない
    needed_by: AI に任せる範囲を広げるか(自動マージ・本番の承認)を数で決める・AI に払う額を説明する・毎週の振り返りで何を機械に回すかを決める
    not_needed_by: 1人で試している間(PR が少なく、数より中身を見たほうが早い)
    if_removed: 任せる範囲を広げる判断と、仕様の詰まりを、感覚でしか見られない
    depends_on: [github-setup, harness]
    law: []
    where: [scripts/metrics/run.mjs, .github/workflows/metrics.yml, .github/workflows/ai-label.yml, docs/guides/metrics.md]
    remove:
      delete: [scripts/metrics, .github/workflows/metrics.yml, .github/workflows/ai-label.yml, docs/guides/metrics.md]
      edit:
        - { path: package.json, what: metrics と、test:scripts の scripts/metrics を外す }
        - { path: .github/labels.yml, what: ai:assisted を外す(pnpm setup:labels で手引きも) }
        - { path: scripts/cost/source-people.mjs, what: ai:assisted で見分ける行と AI_LABEL の import を外す(本文の印だけに戻す) }
        - { path: docs/runbooks/incident.md, what: 振り返りの「戻るまで」「変更が原因」の2行は残してよい }
        - { path: docs/playbook.md, what: 毎週やることの「数字」の使うものを GitHub の Insights に戻す }
        - { path: docs/reference.md, what: ai-label.yml・metrics.yml の行と pnpm metrics を外す }
        - { path: CLAUDE.md, what: pnpm metrics の行を外す }
      docs: [docs/specs/0035-delivery-metrics.md, docs/designs/0035-delivery-metrics.md, docs/adr/0046-metrics-from-labels-and-repo-records.md]

  - id: checkup
    name: 点検(/checkup)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 段階ごと・毎週の点検を台帳(docs/checkup/todo.yaml)にし、pnpm checkup が使い始めた日からの段階に当たる項目を出して自動で確かめられる物を確かめる。人に聞くことは /checkup が1問ずつ聞き、答えを台帳に書いて PR にする。担当者には毎週月曜 8:00 に Issue で知らせ、急ぎは毎日 8:00 に1件ずつ(checkup.yml)。月1回 /checkup-refresh で世の中の変化を台帳に取り込む案を PR にする
    needed_by: すべて(守りが今も効いているかを、詳しくない人でも回すため)
    not_needed_by: なし
    if_removed: 守りが外れても・段階でやることが来ても、詳しい人が自分で見に行くまで気づかない
    depends_on: [harness, cve-triage]
    law:
      - ISMS 9.1(監視・測定)・5.36(順守の確認)
    where: [docs/checkup/todo.yaml, docs/checkup/README.md, scripts/checkup/run.mjs, .claude/skills/checkup/SKILL.md, .claude/skills/checkup-refresh/SKILL.md, .github/workflows/checkup.yml, docs/designs/0007-checkup.md]
    remove:
      delete: [docs/checkup, scripts/checkup, .claude/skills/checkup, .claude/skills/checkup-refresh, .github/workflows/checkup.yml]
      edit:
        - { path: package.json, what: checkup・checkup:answer を外す・test:scripts から scripts/checkup/*.test.mjs を外す }
        - { path: docs/playbook.md, what: 点検の台帳を指す1行を外す }
        - { path: docs/guides/automation.md, what: checkup.yml の行を外す }
      docs: [docs/specs/0007-checkup.md, docs/designs/0007-checkup.md]
