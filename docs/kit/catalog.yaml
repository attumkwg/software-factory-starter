  - id: scim
    name: SCIM(情シスの道具から人を作る・止める)
    group: business
    status: あり
    removable: true
    default: 残す
    what: 組織の管理者が SCIM の鍵(ハッシュだけ持つ・画面に1回だけ・2つまで)を作り、情シスの道具(Entra ID・Okta など)が SCIM 2.0 の Users で、確かめたドメインの人を作る・名前を直す・止める。止めた人は次のリクエストから入れない(消す = 止める・行は残す)。操作は監査ログに「SCIM が」。プランの機能 scim(既定のプランには無い)
    needed_by: 大きな会社向け(辞めた人を情シスの道具からすぐ止めたい・入社の人を自動で作りたい)
    not_needed_by: 個人向け・小さな会社だけが相手(人の出入りは招待と強制ログアウトで足りる)
    if_removed: 退職者を止めるのが管理者の手作業になる(大きな会社の調達の質問票で「SCIM に対応しているか」を聞かれることがある)
    depends_on: [organizations, sso, audit-log, feature-flags]
    law:
      - ISMS 5.18(アクセス権)
      - ISMS 5.16(識別情報の管理)
    remove:
      delete:
        - apps/api/src/auth/scim-routes.ts
