        - { path: .claude/hooks/guard-bash.mjs, what: checkMerge の KIT_AI_MERGE とスクリプトの例外を外す(マージは全部止める)。テストも }
        - { path: scripts/decisions-lib.mjs, what: 会話の答え(conversationAnswerOf・soloFrom・conversationAnswerProblems)を外す。decision-evidence.mjs とテストも }
        - { path: CLAUDE.md, what: 会話の答えの1文・/slack-request の行・マージの例外を外す }
        - { path: docs/guides/slack.md, what: 「🧍 1人の間のおすすめ」を外す }
        - { path: docs/guides/human-review.md, what: 2 の会話の答えの例外を外す }
        - { path: docs/scenarios/gaps.md, what: 条件 8 と G-124 }
