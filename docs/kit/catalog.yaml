  - id: review-by-other-ai
    name: 書いた人と別の AI のレビュー(人格ごと・直す物は直し、人には ❓ だけ聞く)
    group: process
    status: あり
    removable: true
    default: 残す
    what: AI が出した PR を、書いた AI と別の AI(レビュー役)が、観点の台帳と人格(使う人・越えようとする人・夜中に起こされる人・後から確かめる人・3か月後に触る人)で1つずつ読む。❌・⚠️ はおすすめどおり AI が直し、人には ❓(4つの問い)だけを ADR の確認のようにまとめて聞く。記録が無い PR は AI がマージしない
    needed_by: AI に PR を書かせてマージまで任せる・書いた側の申告だけで入れたくない
    not_needed_by: 人が全部の PR を読んで承認する(承認数 1 以上)
    if_removed: 書いた AI の申告だけでマージに回り、自分の抜け(足していないテスト・文の足し忘れ)が受け入れや本番まで残る
    depends_on: []
    law: []
    where: [.claude/agents/reviewer.md, .claude/skills/review-pr/SKILL.md, docs/review-viewpoints.md, docs/guides/human-review.md, scripts/pr-merge-lib.mjs, scripts/pr-merge-when-green.mjs, scripts/review-viewpoints.test.mjs, CLAUDE.md]
