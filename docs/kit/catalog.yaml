    where: [.devcontainer/egress/egress-up.sh, .devcontainer/egress/allowlist.txt, .github/scripts/block-container-egress.sh, .claude/hooks/record-outbound.mjs, scripts/outbound.mjs, docs/guides/unattended-ai.md]
