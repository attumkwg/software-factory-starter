    not_needed_by: 個人向け・小さな会社だけが相手(画面の監査ログで足りる)
    if_removed: 監査ログを取り込みたいお客さんに、画面のスクショか運営の手作業で渡すことになる(データの書き出しには新しい順の監査ログが入る)
