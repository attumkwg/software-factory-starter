  - id: positioning
    name: 約束と売り文句(/positioning)
    group: process
    status: あり
    removable: true
    default: 残す
    what: 話の記録・賭けの小石・計画の代わりの物から、約束(誰の何を、どう変えるか)の案を3つ・売り文句・代わりとの違い・言わないことを根拠つきで出し、1問ずつ選んで docs/product/positioning.md に残す。LP・チラシ・営業の資料・ブランドはここから作る
