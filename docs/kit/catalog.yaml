    group: watch
    status: あり
    removable: true
    default: 残す
    what: AWS(Cost Explorer。環境・動いている物 Component・賭け Bet・PR ごと)・GitHub Actions の分数・SaaS と AI の席などの月額(手で書く)と人の時間(PR からの目安と手入力の幅)を集め、見積もり(段階の表)と賭けごとの予算の枠(超えそうなら Slack に割合だけで知らせる)と賭けごとの損益(PL。人の時間の実績=週の記録があれば実績で・開発の段階の区分)と獲得のコスト(届け方ごとの広告費と営業の時間・1社を取るのにいくら)と1社あたりの原価(組織の大きさの帯ごと・組織の ID は出さない)を並べた HTML の1枚を、非公開の S3 に置く(cost.yml)。全部のリソースにタグ Bet と Component・コスト配分タグ・費用の急な変化の見張り
    needed_by: 費用を自分で払っている・機能(賭け)ごとの費用と採算を知りたい・見積もりとずれていないかを見たい・月1回、資産と費用の区分の案を会計の側に渡したい(/ledger)
