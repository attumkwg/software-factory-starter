packages:
  - apps/*
  - packages/*
  # 確かめるための試作(捨てる物。本物の API・DB・秘密には触らない)。docs/guides/prototypes.md
  - prototypes/*

# 依存のインストール時にスクリプトを動かしてよいものだけを明示する(サプライチェーン対策)
onlyBuiltDependencies:
  - esbuild

# 公開から日が浅い版は入れない(乗っ取られた版を掴まないため。分単位)
minimumReleaseAge: 4320

ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2
minimumReleaseAgeExclude:
  # Renovate security update: nodemailer@10.1.4
  - nodemailer@10.1.4

# 直接は使っていない依存の、脆弱性が直った版に上げる(Dependabot の警告。2026-10-29)。
# seroval は SSR の受け渡し(TanStack の下)、undici はテストのコンテナ(testcontainers の下)。親が上げたら消す。
overrides:
  seroval: ~1.6.11
  seroval-plugins: ~1.6.11
  undici: ^8.12.3
