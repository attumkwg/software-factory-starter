packages:
  - apps/*
  - packages/*
  # 確かめるための試作(捨てる物。本物の API・DB・秘密には触らない)。docs/guides/prototypes.md
  - prototypes/*

# 依存のインストール時にスクリプトを動かしてよいものだけを明示する(サプライチェーン対策)
onlyBuiltDependencies:
  - esbuild

# 公開から日が浅い版は入れない(乗っ取られた版を掴まないため。分単位)
minimumReleaseAge: 4320

ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2
