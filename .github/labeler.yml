# 変えたパスで危険度のラベルを自動で付ける(AI の自己申告に頼らない)。
# 複数付いたら一番高いものが、その PR の危険度。
# 危険度「高」のパスは CODEOWNERS と同じにそろえる。

"risk:high":
  - changed-files:
      - any-glob-to-any-file:
          - apps/api/src/auth/**
          - apps/api/src/authz/**
          - apps/api/src/db/**
          - apps/api/test/unit/classification.test.ts
          - apps/api/src/sensitive/**
          - apps/api/src/logger.ts
          - packages/error-reporting/**
          - packages/logging/**
          - apps/web/server/logger.ts
          - apps/api/test/integration/personal-data-logs.int.test.ts
          - apps/api/test/integration/rls.int.test.ts
          - apps/api/test/integration/tenant-isolation.int.test.ts
          - apps/api/test/integration/authz-matrix.int.test.ts
          - apps/api/test/unit/authz-coverage.test.ts
          - apps/api/drizzle/**
          - apps/api/db/**
          - apps/api/Dockerfile
          - apps/web/Dockerfile
          - docker/**
          - docs/authz/**
          - docs/compliance/vendors.yaml
          - infra/**
          - .github/**
          - CLAUDE.md
          - apps/api/CLAUDE.md
          - apps/web/CLAUDE.md
          - .claude/settings.json
          - .claude/hooks/**
          - .devcontainer/**
          - .semgrep/**
          - scripts/checkup/**
          - scripts/setup/**
          - scripts/evidence/**
          - scripts/cost/**
          - scripts/review-count.mjs
          - scripts/review-count-lib.mjs
          - .gitleaksignore
          - .trivyignore.yaml
          - renovate.json
          - pnpm-workspace.yaml
          - .npmrc

"risk:medium":
  - changed-files:
      - any-glob-to-any-file:
          - apps/**
          - packages/**
          - prototypes/**
          - .claude/skills/**
          - pnpm-lock.yaml
          - package.json

# 変えたファイルが「全部」ドキュメントかテストのときだけ(スキルは AI の手順なので「中」。G-44)
"risk:low":
  - changed-files:
      # 1つの glob(中かっこで束ねた)が、変えた全ファイルに当たる = 全部がドキュメントかテスト
      - any-glob-to-all-files:
          - "{docs/**/*.md,*.md,**/CLAUDE.md,**/test/**,**/e2e/**,**/*.test.ts}"

"area:api":
  - changed-files:
      - any-glob-to-any-file: apps/api/**

"area:web":
  - changed-files:
      - any-glob-to-any-file: apps/web/**

"area:infra":
  - changed-files:
      - any-glob-to-any-file: infra/**
