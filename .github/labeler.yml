      - any-glob-to-any-file:
          - apps/**
          - packages/**
          - prototypes/**
          - .claude/skills/**
          - pnpm-lock.yaml
          - package.json

# 変えたファイルが「全部」ドキュメントかテストのときだけ(スキルは AI の手順なので「中」。G-44)
"risk:low":
  - changed-files:
      # 1つの glob(中かっこで束ねた)が、変えた全ファイルに当たる = 全部がドキュメントかテスト
      - any-glob-to-all-files:
          - "{docs/**/*.md,*.md,**/CLAUDE.md,**/test/**,**/e2e/**,**/*.test.ts}"

"area:api":
  - changed-files:
      - any-glob-to-any-file: apps/api/**

"area:web":
  - changed-files:
      - any-glob-to-any-file: apps/web/**

"area:infra":
  - changed-files:
      - any-glob-to-any-file: infra/**
