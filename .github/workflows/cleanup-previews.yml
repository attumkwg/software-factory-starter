# 毎晩、閉じた PR のプレビュー環境の取り残しを掃除する(destroy が失敗した・途中で止まった分)。
# 状態のファイル(preview/pr-<番号>.tfstate)が残っていて、PR が閉じていれば destroy する。
name: Cleanup previews

on:
  schedule:
    - cron: "0 18 * * *" # 日本時間 3:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cleanup-previews
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.16.6
  TF_DIR: infra/terraform/envs/preview/pr
  TF_IN_AUTOMATION: "true"

jobs:
  cleanup:
    name: 閉じた PR の環境を消す
    if: vars.AWS_PREVIEW_ROLE_ARN != '' && vars.TF_STATE_BUCKET != '' && vars.PREVIEW_DOMAIN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: 取り残しを探して消す
        env:
          GH_TOKEN: ${{ github.token }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
        run: |
          set -euo pipefail
          prs=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix preview/pr- \
                  --query 'Contents[].Key' --output text | tr '\t' '\n' \
                  | sed -nE 's#^preview/pr-([0-9]+)\.tfstate$#\1#p' || true)
          for pr in $prs; do
            state=$(gh pr view "$pr" --json state --jq .state)
            if [ "$state" = "OPEN" ]; then
              echo "PR #$pr はまだ開いているので残す"
              continue
            fi
            echo "::group::PR #$pr ($state) の環境を消す"
            rm -rf "$TF_DIR/.terraform"
            terraform -chdir="$TF_DIR" init -input=false -reconfigure \
              -backend-config="bucket=$BUCKET" \
              -backend-config="key=preview/pr-$pr.tfstate" \
              -backend-config="region=$AWS_REGION" \
              -backend-config="use_lockfile=true" \
              -backend-config="encrypt=true"
            terraform -chdir="$TF_DIR" destroy -input=false -auto-approve \
              -var "pr_number=$pr" -var "domain=$DOMAIN" -var "image=unused"
            aws s3 rm "s3://$BUCKET/preview/pr-$pr.tfstate"
            echo "::endgroup::"
          done
      - name: 状態の無いサービス(手で作った・壊れた)を知らせる
        env:
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          for svc in $(aws ecs list-services --cluster preview --query 'serviceArns[]' --output text | tr '\t' '\n' | sed -nE 's#.*/(preview-pr-[0-9]+)$#\1#p'); do
            pr=${svc#preview-pr-}
            if ! aws s3api head-object --bucket "$BUCKET" --key "preview/pr-$pr.tfstate" >/dev/null 2>&1; then
              echo "::warning::$svc は状態のファイルが無い。手で確かめて消してください"
            fi
          done
