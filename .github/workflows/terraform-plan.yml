# Terraform の plan を AWS に問い合わせて、実行の要約に出す(「何が消えるか」を人が見る)。apply は人がする。
# AWS の変数(AWS_*_PLAN_ROLE_ARN・TF_STATE_BUCKET)が無ければ、失敗せずに飛ばす。
#
# main の内容でだけ回す。plan 用の役割(OIDC)は main からしか引けないようにしてあるので(infra/terraform/envs/*/github.tf)、
# PR の差分の plan は無い。infra の PR は terraform.yml(fmt・validate・tflint・Trivy)と人の目で見て、
# マージのあとに main の plan で「apply で何が起きるか」を確かめてから、人が apply する。
#
# いまは手動だけ(Actions → Terraform plan → Run workflow。ブランチは main を選ぶ)。
name: Terraform plan

on:
  workflow_dispatch:
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、infra を変えた main への push ごとに AWS の読み取り(ほぼ無料)と Actions の数分を使う。
  # push:
  #   branches: [main]
  #   paths:
  #     - "infra/**"

permissions:
  contents: read

concurrency:
  group: terraform-plan
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.6
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: plan (${{ matrix.env }})
    # main だけ(OIDC の役割も main からしか引けない)。手動は書き込める人だけ
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: stg
            role_var: AWS_STG_PLAN_ROLE_ARN
            tfvars_var: TF_VARS_STG
          - env: prod
            role_var: AWS_PROD_PLAN_ROLE_ARN
            tfvars_var: TF_VARS_PROD
    env:
      ROLE_ARN: ${{ vars[matrix.role_var] }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      - name: AWS が未設定ならスキップ
        if: env.ROLE_ARN == '' || env.STATE_BUCKET == ''
        run: echo "::notice::${{ matrix.role_var }} か TF_STATE_BUCKET が無いので plan を飛ばしました(README の「本人がやる設定」)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.ROLE_ARN != '' && env.STATE_BUCKET != ''
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: env.ROLE_ARN != '' && env.STATE_BUCKET != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ap-northeast-1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: env.ROLE_ARN != '' && env.STATE_BUCKET != ''
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: plan
        id: plan
        if: env.ROLE_ARN != '' && env.STATE_BUCKET != ''
        working-directory: infra/terraform/envs/${{ matrix.env }}
        env:
          TFVARS: ${{ vars[matrix.tfvars_var] }}
        run: |
          printf '%s\n' "$TFVARS" > ci.auto.tfvars
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=ap-northeast-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          {
            echo "### 🏗 Terraform plan: \`${{ matrix.env }}\`"
            grep -E '^(Plan: |No changes\.)' plan.txt || echo "(要約なし)"
            destroys=$(grep -cE 'will be destroyed|must be replaced' plan.txt || true)
            if [ "$destroys" -gt 0 ]; then echo; echo "⚠️ 消える・作り直すリソースが ${destroys} 件あります。人が確認してください。"; fi
            echo; echo "plan の全文は「plan」ステップのログにあります。"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then exit 1; fi
