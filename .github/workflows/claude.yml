# 背景エージェント(ハーネスの第2層): Issue や PR で「@claude」と書くと、Claude Code が動いて
# 実装して PR を出す・レビューに答える。
#
# 守り(docs/security.md の AI-1〜AI-5):
# - 起動できるのはリポジトリの持ち主(OWNER)だけ。外の人や他のメンバーが書いた文章は「データ」で、
#   そのまま AI に渡すと中の指示に従ってしまう(プロンプトインジェクション)。
# - API キーはリポジトリ全体の秘密に置かず、Environment「claude」の秘密に置く。Environment の
#   「Deployment branches」を main だけにするので、main 以外のワークフローからはキーが読めない(README)。
# - Claude に許す操作は、lint・型・単体テスト・コミット・PR を出すところまで(下の allowedTools)。
# - 外へ送る手段を持たせない(docs/designs/0057-ai-egress.md・ADR 0068): Web を読む・調べる道具(WebFetch・WebSearch)と
#   MCP の道具は使えない。結合テスト・E2E(Docker が要る・AI が書いたコードが外へ通信できる)は自分で回さず、
#   push して CI の結果を読む。調べ物は人か、人が見ている対話の AI がする。
# - AI の PR は CI・CODEOWNERS・ブランチ保護を通る。自分で頼んだ AI の PR を自分で承認しない。
# - API キー(ANTHROPIC_API_KEY)が無ければ、失敗せずに飛ばす。
name: Claude

#
# いまは手動だけ(Actions → Claude → Run workflow で、main を選んで頼むことを書く。例: 「Issue #12 を実装して PR を出して」)。
# 手動で動かせるのは、リポジトリの持ち主だけ(下の if)。組織のリポジトリに移したら、ここを許す人の名前に変える。
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 頼むこと(Issue の番号を入れると、それを読んで動く)
        required: true
        type: string
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると「@claude」と書くたびに Claude の API(使った分だけ課金)と Actions の分数を使う。
  # 目安: 小さな Issue 1件で数十円〜数百円(長く動くほど増える)。
  # # 起動できる人を OWNER に絞っている(下の if)
  # # PR の会話欄のコメントも issue_comment で来る(main の上で動くので Environment の制限を通る)。
  # # PR のレビューのコメント(pull_request_review_comment / pull_request_review)は PR の ref で動き、
  # # main だけの Environment に弾かれるので使わない。
  # issue_comment: # zizmor: ignore[dangerous-triggers]
  #   types: [created]
  # issues:
  #   types: [opened, assigned]

jobs:
  claude:
    if: >-
      (
        (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          github.event.issue.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ANTHROPIC_API_KEY はこの Environment の秘密(Deployment branches を main だけに)
    environment: claude
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: API キーが無ければ飛ばす
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY が無いので Claude を動かしませんでした(README の「本人がやる設定」)"
      # Claude が実装をブランチに push するので、資格情報は残す
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_KEY == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.HAS_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 手動のときだけ中身が入る(@claude で動くときは空で、コメントを読む)
          prompt: ${{ inputs.prompt }}
          # CLAUDE.md・.claude/skills・.claude/settings.json(フック)をそのまま使う。
          # CI が落ちたら直すのは2回まで(CLAUDE.md)。それ以上は PR に状況を書いて人に渡す。
          # 結合テスト・E2E・表の説明書(docs:db)は Docker が要るので、ここでは回さない(CI が回す。結果は gh pr checks・gh run view)。
          # turbo は型と単体テストの形だけ(`pnpm turbo run typecheck test …`)。ほかのタスクを名前で呼べないように。
          # MCP は、この action が足す GitHub の物も含めて使わない(下の disallowedTools。CI の結果は gh で読む)。
          # 許す操作は決まったコマンドだけ。`pnpm dlx`・`pnpm add`(知らないパッケージを動かす・足す)や
          # `git config`・`git push --force`、`gh pr merge` などは許さない(依存を足すのは人が PR で)。
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(pnpm install --frozen-lockfile),Bash(pnpm lint),Bash(pnpm format),Bash(pnpm typecheck),Bash(pnpm test),Bash(pnpm turbo run typecheck test:*),Bash(pnpm decisions:*),Bash(pnpm bets:*),Bash(pnpm openapi),Bash(pnpm db:generate),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git branch:*),Bash(git push:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue comment:*),Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*),Bash(git push --no-verify:*),Bash(git push --delete:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(gh pr merge:*),WebFetch,WebSearch,mcp__github,mcp__github_comment,mcp__github_ci,mcp__github_file_ops,mcp__github_inline_comment"
            --append-system-prompt "結合テストと E2E は自分で回さない(Docker が無く、外への通信を絞るため)。push して gh pr checks と gh run view --log-failed で CI の結果を読み、直すのは2回まで。Web を読む道具と MCP は使えない。調べ物が要るなら、PR に問いを書いて人に渡す。最後の報告と PR の本文に「外へ出した物」(手段・宛先・頼まれていたか)を書く。無ければ「なし」。"
