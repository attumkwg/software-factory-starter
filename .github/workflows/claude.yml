# 背景エージェント(ハーネスの第2層): Issue や PR で「@claude」と書くと、Claude Code が動いて
# 実装して PR を出す・レビューに答える。
#
# 守り(security.md 0.3):
# - 起動できるのはリポジトリの持ち主(OWNER)だけ。外の人が書いた Issue の文章は「データ」で、
#   そのまま AI に渡すと中の指示に従ってしまう(プロンプトインジェクション)。
# - AI の PR は CI・CODEOWNERS・ブランチ保護を通る。自分で頼んだ AI の PR を自分で承認しない。
# - AI が main を直接書き換えない。使えるコマンドを絞ってある(下の --allowedTools / --disallowedTools)が、
#   これは「うっかり」を防ぐ線。壁は GitHub 側のブランチ保護(README の「本人が手でやる設定」1-1。main への直 push を止める)。
# - API キー(ANTHROPIC_API_KEY)は Environment「claude」の秘密に入れる(リポジトリ全体の秘密には入れない)。
#   Environment の「Deployment branches」は main だけにする(README の 1-3)ので、動かせるのは main のワークフローだけ。
#   キーが無ければ、失敗せずに飛ばす。
name: Claude

#
# いまは手動だけ(Actions → Claude → Run workflow で、頼むことを書く。例: 「Issue #12 を実装して PR を出して」)。
# 手動で動かせるのは、このリポジトリに書き込める人だけ。
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 頼むこと(Issue の番号を入れると、それを読んで動く)
        required: true
        type: string
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると「@claude」と書くたびに Claude の API(使った分だけ課金)と Actions の分数を使う。
  # 目安: 小さな Issue 1件で数十円〜数百円(長く動くほど増える)。
  # # 起動できる人を OWNER に絞っている(下の if)
  # issue_comment: # zizmor: ignore[dangerous-triggers]
  #   types: [created]
  # pull_request_review_comment:
  #   types: [created]
  # pull_request_review:
  #   types: [submitted]
  # issues:
  #   types: [opened, assigned]

jobs:
  claude:
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
          contains(fromJSON('["OWNER"]'), github.event.comment.author_association)) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
          contains(fromJSON('["OWNER"]'), github.event.review.author_association)) ||
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          contains(fromJSON('["OWNER"]'), github.event.issue.author_association))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ANTHROPIC_API_KEY はこの Environment の秘密(ブランチは main だけ)。README の 1-3
    environment: claude
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: API キーが無ければ飛ばす
        if: env.HAS_KEY != 'true'
        run: echo "::notice::ANTHROPIC_API_KEY が無いので Claude を動かしませんでした(README の「本人がやる設定」)"
      # Claude が実装をブランチに push するので、資格情報は残す
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked]
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.HAS_KEY == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: env.HAS_KEY == 'true'
        run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 手動のときだけ中身が入る(@claude で動くときは空で、コメントを読む)
          prompt: ${{ inputs.prompt }}
          # CLAUDE.md・.claude/skills・.claude/settings.json(フック)をそのまま使う。
          # CI が落ちたら直すのは2回まで(CLAUDE.md)。それ以上は PR に状況を書いて人に渡す。
          # 使えるコマンドは必要なものだけ。pnpm は検査・テスト・生成のみ(dev・build・db:migrate・exec・dlx は無し)。
          # git は main 以外のブランチ(claude/…)への push だけ。main への push・force・--no-verify・
          # ブランチの付け替え先が main になる形は拒む(拒否が許可より先に効く)。gh は PR と Issue の読み書きだけ(merge は無し)。
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(pnpm lint:*),Bash(pnpm format:*),Bash(pnpm typecheck:*),Bash(pnpm test:*),Bash(pnpm check:*),Bash(pnpm decisions:*),Bash(pnpm openapi:*),Bash(pnpm db:generate:*),Bash(pnpm docs:db:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch -c claude/:*),Bash(git checkout -b claude/:*),Bash(git push -u origin claude/:*),Bash(git push origin claude/:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue comment:*),Edit,Write,Read,Glob,Grep"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --no-verify:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push origin HEAD:refs/heads/main:*),Bash(git push --delete:*),Bash(git reset --hard:*),Bash(git config:*),Bash(gh pr merge:*),Bash(gh api:*)"
