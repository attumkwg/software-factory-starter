# 確かめるための試作(prototypes/<賭けの ID>-<短い名前>/)を、合言葉つきの URL に置く(docs/guides/prototypes.md)。
#   PR で試作が変わった → その試作だけビルド → S3 へ → PR に URL をコメント
#   main に入った        → 全部の試作をビルドして置き直す。フォルダが無くなった試作(閉じた賭け)は S3 からも消す
#
# 守り:
# - pull_request_target は使わない。フォークの PR では動かさない(同じリポジトリのブランチだけ)。
# - ビルド(PR のコードが動く)は AWS の権限なしのジョブで。置くジョブはビルドの結果を受け取って S3 に写すだけ。
# - AWS の役割は dev アカウントの、試作のバケット(B-* の下)だけ。本物の環境には届かない(envs/preview/prototypes/github.tf)。
# - AWS の変数が無ければ、失敗せずに飛ばす(手元の pnpm prototype:dev で見せられる)。
# 費用: 月 0〜数十円(CloudFront と S3 の無料枠の中がほとんど)。
name: Prototypes

on:
  pull_request:
    paths:
      - "prototypes/**"
  push:
    branches: [main]
    paths:
      - "prototypes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototypes-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-northeast-1

jobs:
  gate:
    name: 動かすか
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ROLE: ${{ vars.AWS_PROTOTYPES_ROLE_ARN }}
          BUCKET: ${{ vars.PROTOTYPES_BUCKET }}
          URL: ${{ vars.PROTOTYPES_URL }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$BUCKET" ] || [ -z "$URL" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::試作の置き場所の変数が無いので飛ばしました。手元では pnpm prototype:dev <賭けの ID>(docs/guides/prototypes.md)"
            exit 0
          fi
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::フォークからの PR なので置きません"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  build:
    name: ビルド(AWS の権限なし)
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 本物と混ぜていないか(本物の API・DB・AWS・秘密・noindex)
        run: pnpm prototypes
      - name: どの試作を置くか(PR は変わった物だけ・main は全部)
        id: list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            dirs=$(git diff --name-only "$BASE_SHA" HEAD -- prototypes/ | cut -d/ -f2 | sort -u)
          else
            dirs=$(find prototypes -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          fi
          ids=""
          for dir in $dirs; do
            [ -f "prototypes/$dir/package.json" ] || continue
            ids="$ids ${dir:0:6}"
            echo "$dir" >> "$RUNNER_TEMP/dirs"
          done
          echo "ids=${ids# }" >> "$GITHUB_OUTPUT"
          echo "置く試作: ${ids:-(なし)}"
      - name: ビルド
        if: steps.list.outputs.ids != ''
        run: |
          mkdir -p out
          while read -r dir; do
            pnpm --filter "./prototypes/$dir" build
            cp -r "prototypes/$dir/dist" "out/${dir:0:6}"
          done < "$RUNNER_TEMP/dirs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prototypes
          path: out
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    name: S3 に置く
    needs: build
    # main ではフォルダが無くなった試作を消すので、置く物が無くても動かす
    if: needs.build.outputs.ids != '' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.ids != ''
        with:
          name: prototypes
          path: out
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROTOTYPES_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 置く(index.html も古い物を見せないよう no-cache)
        if: needs.build.outputs.ids != ''
        env:
          BUCKET: ${{ vars.PROTOTYPES_BUCKET }}
          IDS: ${{ needs.build.outputs.ids }}
        run: |
          for id in $IDS; do
            aws s3 sync "out/$id" "s3://$BUCKET/$id" --delete --cache-control "no-cache" --only-show-errors
          done
      - name: フォルダが無くなった試作(閉じた賭け)を消す
        if: github.event_name != 'pull_request'
        env:
          BUCKET: ${{ vars.PROTOTYPES_BUCKET }}
          IDS: ${{ needs.build.outputs.ids }}
        run: |
          for prefix in $(aws s3 ls "s3://$BUCKET/" | awk '$1 == "PRE" { print $2 }' | grep '^B-' || true); do
            id="${prefix%/}"
            case " $IDS " in
              *" $id "*) ;;
              *) echo "消す: $id"; aws s3 rm "s3://$BUCKET/$id/" --recursive --only-show-errors ;;
            esac
          done

  comment:
    name: PR に URL をコメント
    needs: [build, deploy]
    if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BASE_URL: ${{ vars.PROTOTYPES_URL }}
          IDS: ${{ needs.build.outputs.ids }}
        with:
          script: |
            const marker = "<!-- prototypes -->";
            const links = process.env.IDS.split(" ").filter(Boolean)
              .map((id) => `- ${id}: ${process.env.BASE_URL}/${id}/`);
            const body = [
              marker,
              "### 🧪 試作の URL(合言葉つき・検索に載らない)",
              ...links,
              "",
              "合言葉はリポジトリに書かない。渡し方は docs/guides/prototypes.md。結果は `/bet` で賭けに持ち帰る。",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
