# ZAP の認証つき API スキャン(攻撃型)を stg に向けて流す。OpenAPI の全 API を、ログインした状態で叩く。
# PR のプレビューでは受け身のスキャン(ZAP ベースライン)だけ。こちらは stg に負荷と変なデータを入れるので、夜に流す想定。
#
# ログインの仕方: 画面と同じ POST /api/auth/login に、スキャン用の利用者のメールとパスワードを送って Cookie をもらう
# → その Cookie で ZAP が叩く。トークンはこのジョブにも来ない(API の中だけ)。
#
# 要るもの:
#   変数  STG_URL(https://app.stg.example.com)
#   秘密  ZAP_SCAN_USERNAME・ZAP_SCAN_PASSWORD(stg の画面から登録したスキャン用の利用者。本物の人のものは使わない。
#         二段階認証は有効にしない)。リポジトリ全体ではなく Environment「zap」の秘密に置き、その Environment の
#         「Deployment branches」を main だけにする(main 以外のワークフローからは読めない。README)
#   stg の users に、スキャン用の利用者と同じメールの行(組織と役割は好きに)。初めてのログインで Cognito の sub と結びつく
#   (docs/runbooks/cognito-login.md の「新しい人を入れる」)
# 無ければ、失敗せずに飛ばす。
#
# いまは手動だけ(Actions → ZAP API scan → Run workflow)。
name: ZAP API scan

on:
  workflow_dispatch:
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、毎晩 stg に数千〜数万のリクエストが行く(Fargate と Aurora が少し動く分の費用)。Actions は 20〜40分。
  # schedule:
  #   - cron: "0 17 * * *" # 日本時間 2:00

permissions:
  contents: read

jobs:
  scan:
    name: ZAP(認証つき・stg)
    if: vars.STG_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # ZAP_SCAN_* はこの Environment の秘密(Deployment branches を main だけに)
    environment: zap
    permissions:
      contents: read
    env:
      HAS_SECRET: ${{ secrets.ZAP_SCAN_USERNAME != '' && secrets.ZAP_SCAN_PASSWORD != '' }}
      # 公開のリポジトリでは流さない。レポート(zap-api-report)に stg への要求と返事が入り、GitHub にログインした誰でも落とせる。
      # ZAP の Action には成果物を上げない設定が無いので、流すのは非公開のリポジトリだけにする
      RUN_SCAN: ${{ secrets.ZAP_SCAN_USERNAME != '' && secrets.ZAP_SCAN_PASSWORD != '' && github.event.repository.private }}
      TARGET: ${{ vars.STG_URL }}
    steps:
      - name: 秘密が無ければ飛ばす
        if: env.HAS_SECRET != 'true'
        run: echo "::notice::ZAP_SCAN_USERNAME / ZAP_SCAN_PASSWORD が無いので飛ばしました(docs/security.md)"
      - name: 公開のリポジトリなら飛ばす
        if: env.HAS_SECRET == 'true' && env.RUN_SCAN != 'true'
        run: echo "::notice::公開のリポジトリでは流しません(レポートに stg への要求と返事が入り、誰でも落とせるため)。非公開のリポジトリで流してください"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.RUN_SCAN == 'true'
        with:
          persist-credentials: false
      - name: スキャン用の利用者でログインして Cookie をもらう
        id: login
        if: env.RUN_SCAN == 'true'
        env:
          USERNAME: ${{ secrets.ZAP_SCAN_USERNAME }}
          PASSWORD: ${{ secrets.ZAP_SCAN_PASSWORD }}
        run: |
          set -euo pipefail
          # 画面と同じログインの入口。本文は jq で組み立てる(パスワードに記号があっても壊れない)
          body=$(jq -n --arg email "$USERNAME" --arg password "$PASSWORD" '{email: $email, password: $password}')
          cookie=$(curl -fsS -D - -o /dev/null -X POST "$TARGET/api/auth/login" \
            -H "content-type: application/json" -H "origin: $TARGET" \
            --data "$body" | tr -d '\r' | sed -n 's/^set-cookie: \([^;]*\).*/\1/Ip' | grep -m1 'sid=')
          echo "::add-mask::$cookie"
          echo "cookie=$cookie" >> "$GITHUB_OUTPUT"
      - name: ZAP の API スキャン
        if: env.RUN_SCAN == 'true'
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: ${{ env.TARGET }}/api/openapi.json
          format: openapi
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api-report
          # すべてのリクエストに Cookie と Origin を付ける(ZAP の置き換えの設定)
          cmd_options: >-
            -z "-config replacer.full_list(0).description=session
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Cookie
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=${{ steps.login.outputs.cookie }}
            -config replacer.full_list(1).description=origin
            -config replacer.full_list(1).enabled=true
            -config replacer.full_list(1).matchtype=REQ_HEADER
            -config replacer.full_list(1).matchstr=Origin
            -config replacer.full_list(1).regex=false
            -config replacer.full_list(1).replacement=${{ env.TARGET }}"
