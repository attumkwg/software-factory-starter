# PR の検査(工程⑤)。AWS も API キーも要らない。全部が緑でないとマージできない(ブランチ保護で必須に)。
# 速い検査(Biome・型・単体)を最初に返し、重いもの(結合・E2E・イメージ)は並べて流す。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 道具の版はここで固定(タグ+ダイジェスト。Renovate が両方を上げる。renovate.json の customManagers)
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
  OASDIFF_IMAGE: tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c

jobs:
  fast:
    name: Biome・型・単体
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome(整形と lint。関数の複雑さ・長さ、ファイルの長さの上限も)
        run: pnpm lint
      - name: 型
        run: pnpm typecheck
      - name: 単体(権限の表の網羅 ① を含む)とカバレッジの下限
        run: pnpm test:coverage
      - name: 画面の JS・CSS の大きさの上限
        run: |
          pnpm --filter @app/web build
          pnpm --filter @app/web size

  integration:
    name: 結合(Postgres・RLS・2社・権限の表 ②)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testcontainers で結合テスト
        run: pnpm test:integration

  api-compat:
    name: API の互換(oasdiff。項目は足すだけ)
    # 公開 API の決まり(docs/guides/api-changes.md): 項目は足すだけ・消さない・意味を変えない。
    # PR の元(base)と比べて、古い画面・スマホのアプリを壊す変更があれば落とす。
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: この PR の OpenAPI
        run: |
          pnpm install --frozen-lockfile
          pnpm openapi
          mkdir -p "$RUNNER_TEMP/specs"
          cp apps/api/openapi.json "$RUNNER_TEMP/specs/head.json"
      - name: 元(base)の OpenAPI
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
          cd "$RUNNER_TEMP/base"
          pnpm install --frozen-lockfile
          pnpm openapi
          cp apps/api/openapi.json "$RUNNER_TEMP/specs/base.json"
      - name: 壊す変更が無いか
        run: >-
          docker run --rm -v "$RUNNER_TEMP/specs:/specs" "$OASDIFF_IMAGE"
          breaking /specs/base.json /specs/head.json --fail-on ERR

  migrations:
    name: 移行の検査(squawk)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/api db:lint

  e2e:
    name: E2E(docker compose+Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 手元と同じ形で起動(DB・移行・種データ・API・画面の SSR・ALB の代わり)
        run: |
          docker compose up --build -d
          # alb(ALB の代わり)の向こうで、画面(/readyz)と API(/api/me がログイン前なので 401)の両方が答えるまで
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Cognito でのログイン(偽物の Cognito に切り替えて、ログインの流れだけ流す)
        env:
          E2E_AUTH: cognito
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-cognito
        run: |
          # API を AUTH_MODE=cognito で作り直し、偽物の Cognito を足す(DB と種データはそのまま)
          docker compose -f docker-compose.yml -f docker-compose.cognito.yml up --build -d --wait api fake-cognito
          pnpm test:e2e --output=test-results/cognito
      - name: スクショ・動画・レポート(PR に貼る証拠)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/playwright-report-cognito
            apps/web/test-results
          retention-days: 7
      - name: 失敗したらログ
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.cognito.yml logs

  gitleaks:
    name: 秘密情報(gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 全履歴を検査
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --no-banner --verbose

  semgrep:
    name: コードの検査(Semgrep CE+自社ルール)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 自社ルールのテスト(当たるべき所に当たるか)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test --config .semgrep/rules.yml .semgrep/rules.ts
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test .semgrep/design
      - name: 検査(自社ルール+公開のルール)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error --exclude .semgrep
          --config .semgrep/rules.yml
          --config .semgrep/design/design.yml
          --config p/typescript
          --config p/nodejsscan
          --config p/secrets

  trivy-fs:
    name: 依存と設定(Trivy fs / config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 依存の脆弱性・秘密・設定(Dockerfile・compose)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          fs --ignorefile .trivyignore.yaml --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
          --skip-dirs infra .
      - name: インフラ定義(Terraform)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          config --severity HIGH,CRITICAL --exit-code 1 infra/terraform

  image:
    name: イメージのビルドと検査(Trivy image・${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # API・画面(SSR)・メールの中継(Postfix)は別のイメージ・別の ECS サービス
        include:
          - app: api
            file: apps/api/Dockerfile
          - app: web
            file: apps/web/Dockerfile
          - app: mail
            file: docker/postfix/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          tags: ${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Trivy でイメージを検査
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${{ matrix.app }}:ci"

  workflows:
    name: ワークフローの検査(actionlint・zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint(書き方の誤り)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE"
      - name: "zizmor(危ない書き方: 権限・資格情報・危ないトリガー)"
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ZIZMOR_IMAGE" --offline --min-severity medium .github/workflows
