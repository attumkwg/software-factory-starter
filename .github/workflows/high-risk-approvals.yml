# 危険度「高」の PR に、人の承認が決めた人数(.github/setup.yml の ruleset.high_risk_approvals)あるか(G-43・仕様 0059)。
# GitHub のルールセットの承認数はリポジトリで1つの値で、CODEOWNERS は並べた誰か1人の承認で通るので、
# 「高だけ2人」はこのチェックで止める。レビューが付いた・外れたときにも流し直す。読むだけ(書く権限は持たない)。
# 確かめる中身(一覧・人数・スクリプト)は PR の側ではなく土台のブランチ(base)の物を使う(PR の中で緩めて通すのを防ぐ)。
name: 危険度「高」の承認

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: high-risk-approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approvals:
    name: 危険度「高」の承認の人数
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # 依存は要らない(node の標準と gh だけ)。土台にまだスクリプトが無い(このチェックを足す PR そのもの)ときは通す
      - name: 承認の人数を数える
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f scripts/review-count.mjs ]; then
            echo "土台のブランチにまだ scripts/review-count.mjs が無いので数えない(このチェックを足す PR)"
            exit 0
          fi
          node scripts/review-count.mjs
