# PR ごとのプレビュー環境(工程⑤の後半: 本物に近い環境で確かめる)。
#   開く・push → イメージを ECR へ → Terraform で ECS サービス+共有 ALB のルール
#              → Playwright の E2E と ZAP のベースライン → PR に URL と結果をコメント
#   閉じる     → destroy
#
# 守り:
# - pull_request_target は使わない(フォークのコードに書き込みの権限と秘密を渡さない)。
# - フォークの PR では動かさない(同じリポジトリのブランチだけ)。
# - AWS の役割は dev アカウントのプレビュー専用(本番には届かない)。
# - AWS の変数が無ければ、失敗せずに飛ばす。
#
# いまは手動だけ(Actions → Preview → Run workflow で PR の番号と「立てる / 消す」を選ぶ)。
# 自動にするときは、下の pull_request のコメントを外す(docs/guides/automation.md)。
name: Preview

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR の番号
        required: true
        type: number
      action:
        description: 立てる(deploy)か消す(destroy)か
        required: true
        type: choice
        options: [deploy, destroy]
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、PR を開く・push するたびに AWS(ECS の Fargate Spot・共有の ALB と NAT・ECR)に費用がかかる。
  # 目安: 土台 月 約1.2万円+PR 1本を24時間立てて 月 約1,000円。
  # pull_request:
  #   types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

concurrency:
  # 同じ PR の apply / destroy を重ねない(途中で止めると状態が壊れるので cancel しない)
  group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  AWS_REGION: ap-northeast-1
  TF_VERSION: 1.16.6
  TF_DIR: infra/terraform/envs/preview/pr
  TF_IN_AUTOMATION: "true"

jobs:
  gate:
    name: 動かすか
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
      sha: ${{ steps.check.outputs.sha }}
      # 自動(pull_request)なら閉じたときに消す。手動なら選んだ方
      action: ${{ github.event_name == 'pull_request' && (github.event.action == 'closed' && 'destroy' || 'deploy') || inputs.action }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLE: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          ECR: ${{ vars.PREVIEW_ECR_REPOSITORY }}
          DOMAIN: ${{ vars.PREVIEW_DOMAIN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          if [ -z "$ROLE" ] || [ -z "$ECR" ] || [ -z "$DOMAIN" ] || [ -z "$BUCKET" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::プレビュー用の AWS の変数が無いので飛ばしました(docs/getting-started.md の ④)"
            exit 0
          fi
          # フォークの PR では動かさない(外の人のコードに AWS の権限を渡さない)
          read -r cross sha < <(gh pr view "$PR_NUMBER" --repo "$REPO" --json isCrossRepository,headRefOid --jq '"\(.isCrossRepository) \(.headRefOid)"')
          if [ "$cross" = "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PR #$PR_NUMBER はフォークからなので動かしません"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: 立てる
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.apply.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: イメージを作って ECR へ
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ vars.PREVIEW_ECR_REPOSITORY }}:pr-${{ env.PR_NUMBER }}-${{ needs.gate.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Terraform で ECS サービスと ALB のルール
        id: apply
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=preview/pr-${PR_NUMBER}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform apply -input=false -auto-approve \
            -var "pr_number=${PR_NUMBER}" \
            -var "domain=${{ vars.PREVIEW_DOMAIN }}" \
            -var "image=${{ vars.PREVIEW_ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
      - name: 起動を待つ
        run: |
          for _ in $(seq 1 60); do
            curl -fsS "${{ steps.apply.outputs.url }}/readyz" && exit 0
            sleep 5
          done
          exit 1

  e2e:
    name: E2E(プレビュー)
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.gate.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: preview-playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  zap:
    name: ZAP ベースライン(受け身のスキャン)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ needs.deploy.outputs.url }}
          # Issue は作らない(結果は成果物と PR のコメントで見る)
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

  comment:
    name: PR にコメント
    needs: [deploy, e2e, zap]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          URL: ${{ needs.deploy.outputs.url }}
          E2E: ${{ needs.e2e.result }}
          ZAP: ${{ needs.zap.result }}
        with:
          script: |
            const icon = (r) => (r === "success" ? "✅" : r === "skipped" ? "⏭" : "❌");
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = "<!-- preview -->";
            const body = [
              marker,
              "### 🔗 プレビュー環境",
              `**${process.env.URL}**(開発用ログイン: \`admin@acme.test\` など。種データの2社)`,
              "",
              `| 確認 | 結果 |`,
              `|---|---|`,
              `| E2E(Playwright) | ${icon(process.env.E2E)} |`,
              `| ZAP ベースライン | ${icon(process.env.ZAP)} |`,
              "",
              `スクショ・動画・ZAP のレポートは [この実行の成果物](${run}) にあります。PR を閉じると消えます。`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  destroy:
    name: 片付ける
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.action == 'destroy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=preview/pr-${PR_NUMBER}.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
          terraform destroy -input=false -auto-approve \
            -var "pr_number=${PR_NUMBER}" \
            -var "domain=${{ vars.PREVIEW_DOMAIN }}" \
            -var "image=unused"
          aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/preview/pr-${PR_NUMBER}.tfstate"
