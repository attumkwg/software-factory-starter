# 週の数字: DORA の4つ・AI が手伝った PR の割合・人の介在率・仕様の在庫を、決裁用と改善用に分けて Actions の要約に出す。
# 続けて、資産の累計と ROI・北極星の週ごとの分母と分子(pnpm kpi --roi。仕様 0094)。
# 読むだけ(マージした PR・本番のデプロイ・リポジトリのファイル)。人の名前・PR の題名と本文は出さない。
# 決まりは docs/designs/0035-delivery-metrics.md・手引きは docs/guides/metrics.md
# 費用: 毎週 1〜2分(公開のリポジトリは無料)。
name: Metrics

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: 何週ぶん出すか(1〜26)
        required: false
        default: "8"
  # 有効にする日: 2026-10-25
  schedule:
    - cron: "30 23 * * 0" # 日本時間 月曜 8:30(点検の後。毎週の振り返りの前)

permissions:
  contents: read

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  report:
    name: 週の数字を出す
    # 定期で動くのは、キットから作ったリポジトリ(KIT_ROLE=product)だけ。手で流すのはどこでもできる(ADR 0027)
    if: github.event_name != 'schedule' || vars.KIT_ROLE == 'product'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 数える
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKUP_READ_TOKEN: ${{ secrets.CHECKUP_TOKEN }}
          WEEKS: ${{ inputs.weeks || '8' }}
        run: |
          set -euo pipefail
          pnpm metrics --weeks "$WEEKS" --out "$RUNNER_TEMP/metrics"
          cat "$RUNNER_TEMP/metrics/metrics.md" >> "$GITHUB_STEP_SUMMARY"
      # 資産の累計と ROI・北極星の週ごとの分母と分子・「動かす KPI」が空・賭けと合わない PR(番号と数だけ。仕様 0094)
      - name: 北極星と ROI
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKS: ${{ inputs.weeks || '8' }}
        run: |
          set -euo pipefail
          pnpm -s kpi --roi --weeks "$WEEKS" >> "$GITHUB_STEP_SUMMARY"
      # 公開のリポジトリでは成果物を誰でも落とせる。中身は PR と同じく公開の情報だけだが、置いておく必要も無いので非公開のときだけ
      - if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metrics
          path: ${{ runner.temp }}/metrics
          retention-days: 7
