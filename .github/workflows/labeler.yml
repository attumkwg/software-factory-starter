# 変えたパスで危険度のラベル(risk:low / medium / high)を自動で付ける。中身は .github/labeler.yml。
# pull_request_target は使わない(フォークの PR ではラベルを付けられないが、それでよい)。
name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # 変えたファイルが変わればラベルも付け直す(危険度が下がることもある)
          sync-labels: true
