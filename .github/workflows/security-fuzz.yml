# OpenAPI から全 API に「変な入力」を自動で送る(Schemathesis)。ロールごと(admin・member・viewer・未ログイン)に叩く。
# 相手は、このジョブの中で立てた docker compose(AWS は使わない)。中身は scripts/security-fuzz.mjs。
#
# いまは手動だけ(Actions → Security fuzz → Run workflow)。お金は Actions の数分だけ。
name: Security fuzz

on:
  workflow_dispatch:
    inputs:
      max_examples:
        description: 1つの API あたりに作る入力の数(多いほど深く、時間がかかる)
        required: false
        default: "50"
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、毎週 Actions を10分ほど使う(無料枠の中に収まる目安)。
  # schedule:
  #   - cron: "0 19 * * 0" # 日本時間 月曜 4:00

permissions:
  contents: read

jobs:
  fuzz:
    name: Schemathesis(ロールごと)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: 手元と同じ形で起動
        run: |
          docker compose up --build -d
          # alb(ALB の代わり)の向こうで、画面(/readyz)と API(/api/me がログイン前なので 401)の両方が答えるまで
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: ファジング
        env:
          FUZZ_MAX_EXAMPLES: ${{ inputs.max_examples || '50' }}
        run: node scripts/security-fuzz.mjs
      - name: 結果(JUnit)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-report
          path: reports/schemathesis
          retention-days: 7
      - name: 失敗したら API のログ
        if: failure()
        run: docker compose logs api
