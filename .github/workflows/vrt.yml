# 見た目の回帰テスト(VRT)と、PR に貼る主な画面のスクショ(docs/guides/vrt.md・docs/designs/0011-visual-regression.md)。
#   開く・push → 主な画面を撮り、基準の画像(apps/web/e2e/vrt/__screenshots__)と比べる → PR のコメント1つに結果と画面を出す
#   ラベル vrt:update → 基準を撮り直して成果物 vrt-baseline にする(取り込む1行をコメントに出す。コミットするまで赤)
#
# ブラウザは Playwright の公式イメージの Docker の中(docker-compose.vrt.yml)。手元の pnpm vrt と同じ画像になる(ADR 0024)。
# ラベルを付けたときにも流すので、ci.yml とは分ける(ci.yml はラベルで流し直さない)。
#
# 守り:
# - pull_request_target は使わない。PR のコードを動かすジョブ(vrt)は読む権限だけ。
# - コメントを書くジョブ(comment)は PR のコードを checkout も実行もしない。本文を成果物で受け取って貼るだけ。
#   フォークの PR では動かさない(外の人の PR に書き込みの権限を渡さない。比べる検査は流す)。
# - 値は env で渡す(式を run に直接書かない)。
name: VRT

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: vrt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    name: 見た目の比べ(VRT)
    # ラベルを付けたときは vrt:update のときだけ流す(labeler の risk:* などで流し直さない)
    if: github.event.action != 'labeled' || github.event.label.name == 'vrt:update'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VRT_MODE: ${{ contains(github.event.pull_request.labels.*.name, 'vrt:update') && 'update' || 'compare' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ブラウザ(Docker の中の Chromium)と、手元と同じ形のアプリを起動
        run: |
          docker compose -f docker-compose.vrt.yml up -d --wait
          docker compose up --build -d
          # alb(ALB の代わり)の向こうで、画面(/readyz)と API(/api/me がログイン前なので 401)の両方が答えるまで
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8080/readyz && [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: 比べる(ラベル vrt:update があれば撮り直す)
        id: run
        run: |
          if [ "$VRT_MODE" = "update" ]; then script=vrt:update; else script=vrt; fi
          # 落ちても先へ進む(コメントの本文と成果物を作ってから、最後の手順で落とす)
          if pnpm "$script"; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
      - name: PR のコメントの本文を作る
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          VRT_PASSED: ${{ steps.run.outputs.passed }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p ../../vrt-report
          node e2e/vrt/report-cli.ts > ../../vrt-report/comment.md
          printf '%s' "$PR_NUMBER" > ../../vrt-report/pr-number
          cat ../../vrt-report/comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: コメントの本文(comment のジョブが貼る)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-report
          path: vrt-report
          retention-days: 1
      - name: 違ったときの画像(基準・今回・差分)と HTML のレポート
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-diff
          path: |
            apps/web/test-results-vrt
            apps/web/playwright-report-vrt
          if-no-files-found: ignore
          retention-days: 14
      - name: 撮り直した基準(ラベル vrt:update のとき。取り込む1行はコメントに)
        if: ${{ !cancelled() && env.VRT_MODE == 'update' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrt-baseline
          path: apps/web/e2e/vrt/__screenshots__
          retention-days: 14
      - name: 結果(違えば赤。撮り直したときは、変わった基準をコミットするまで赤)
        if: ${{ !cancelled() }}
        env:
          PASSED: ${{ steps.run.outputs.passed }}
        run: |
          if [ "$PASSED" != "true" ]; then
            echo "::error::基準の画像と違う画面があります(PR のコメントか、このジョブのまとめを見てください)"
            exit 1
          fi
          if [ "$VRT_MODE" = "update" ] && [ -n "$(git status --porcelain -- apps/web/e2e/vrt/__screenshots__)" ]; then
            echo "::error::基準を撮り直しました。成果物 vrt-baseline を取り込んでコミットし、ラベル vrt:update を外してください"
            exit 1
          fi
      - name: 失敗したらログ
        if: failure()
        run: docker compose logs

  comment:
    name: PR に結果と画面を貼る
    needs: vrt
    # 同じリポジトリのブランチの PR だけ(フォークには書き込みの権限を渡さない)。比べる前に止められたら貼らない
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.vrt.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # PR のコードは checkout しない。vrt のジョブが作った本文だけを受け取る
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vrt-report
          path: vrt-report
      - name: 印のある自分のコメントを書き換える(無ければ足す)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- vrt-report -->")))][0].id // empty' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@vrt-report/comment.md > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@vrt-report/comment.md > /dev/null
          fi
