# 出荷(工程⑦)。main → stg は自動、prod は GitHub の environment「prod」の承認のあと。
#   1. イメージ(API と画面の2つ)を1回だけ作って stg の ECR へ(prod も同じイメージを引く。作り直さない)
#   2. 移行を1回きりのタスクで流す(表の持ち主で)
#   3. API → 画面の順に、ECS のサービスを新しいタスク定義で更新 → ECS の blue/green が切り替え、
#      アラーム(5xx)が鳴れば自動で戻す。API が先なのは、新しい画面が新しい API を前提にできるように
#      (API は古い画面からも呼ばれるので、項目は足すだけ・消さない。packages/shared の決まり)
#   4. 公開の LP(apps/site)をビルドして S3 に置く(置き場所と変数があるときだけ。docs/guides/landing-page.md)
#   5. 外から疎通を確かめる(画面の /readyz と、ALB の向こうの API)
# prod だけ、最初に未確定事項を確かめる(pnpm decisions --launch)。仮決め・導入時に決める が残っていれば、
# AWS に触る前に止まる(docs/designs/0013-decisions-at-adoption.md)。
# AWS の変数が無ければ、ジョブごと飛ばす(失敗しない)。
# main 以外から流したときも、ジョブごと飛ばす。feature のブランチを stg に出せると、prod は stg のイメージを
# 引くので、承認1回でレビューされていないコードが本番に出てしまう。GitHub の Environments(stg・prod)の
# 「Deployment branches」も main だけにして二重に守る(README の「本人がやる設定」)。
name: Deploy

# いまは手動だけ(Actions → Deploy → Run workflow)。自動にするときは push のコメントを外す。
on:
  workflow_dispatch:
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、main にマージするたびに stg へ出す(ECR の保存・移行のタスク・ECS の入れ替えに少額の AWS 費用)。
  # stg と prod の環境そのものの月額は docs/getting-started.md の ④。
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "docs/**"
  #     - "**/*.md"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1
  PROJECT: ${{ vars.PROJECT || 'sfs' }}

jobs:
  stg:
    name: stg に出す
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AWS_STG_DEPLOY_ROLE_ARN != '' && vars.ECR_REPOSITORY_URL != '' && vars.WEB_ECR_REPOSITORY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    environment:
      name: stg
      url: ${{ vars.STG_URL }}
    outputs:
      image: ${{ steps.image.outputs.image }}
      web_image: ${{ steps.image.outputs.web_image }}
    env:
      CLUSTER: ${{ vars.PROJECT || 'sfs' }}-stg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STG_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: API のイメージを作って ECR へ
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: 画面(SSR)のイメージを作って ECR へ
        id: build_web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ vars.WEB_ECR_REPOSITORY_URL }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - id: image
        run: |
          echo "image=${{ vars.ECR_REPOSITORY_URL }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "web_image=${{ vars.WEB_ECR_REPOSITORY_URL }}@${{ steps.build_web.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - name: 移行
        run: .github/scripts/run-migration.sh "$CLUSTER" "$CLUSTER-migrate" "$CLUSTER" "${{ steps.image.outputs.image }}"
      - name: いまのタスク定義を取る(API と画面)
        run: |
          aws ecs describe-task-definition --task-definition "$CLUSTER" \
            --query taskDefinition > task-definition.json
          aws ecs describe-task-definition --task-definition "$CLUSTER-web" \
            --query taskDefinition > web-task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ steps.image.outputs.image }}
          # Sentry で「この版から増えた」が分かるように(docs/guides/monitoring.md)
          environment-variables: SENTRY_RELEASE=${{ github.sha }}
      - name: API を blue/green で出す(アラームが鳴れば自動で戻る)
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 30
      - id: render_web
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: web-task-definition.json
          container-name: web
          image: ${{ steps.image.outputs.web_image }}
          # Sentry で「この版から増えた」が分かるように(docs/guides/monitoring.md)
          environment-variables: SENTRY_RELEASE=${{ github.sha }}
      - name: 画面(SSR)を blue/green で出す(アラームが鳴れば自動で戻る)
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render_web.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.CLUSTER }}-web
          wait-for-service-stability: true
          wait-for-minutes: 30
      # 公開の LP(apps/site)。置き場所(Terraform の public_site_domain)と変数が無ければ飛ばす
      - if: vars.STG_SITE_BUCKET != '' && vars.STG_SITE_DISTRIBUTION_ID != '' && vars.STG_SITE_URL != '' && vars.STG_URL != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: vars.STG_SITE_BUCKET != '' && vars.STG_SITE_DISTRIBUTION_ID != '' && vars.STG_SITE_URL != '' && vars.STG_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # 出荷のジョブはキャッシュを使わない(PR が汚したキャッシュを本番に持ち込まない)
          package-manager-cache: false
      - name: 公開の LP をビルドして置く(静的なファイルだけ。docs/guides/landing-page.md)
        if: vars.STG_SITE_BUCKET != '' && vars.STG_SITE_DISTRIBUTION_ID != '' && vars.STG_SITE_URL != '' && vars.STG_URL != ''
        env:
          SITE_URL: ${{ vars.STG_SITE_URL }}
          APP_URL: ${{ vars.STG_URL }}
          BUCKET: ${{ vars.STG_SITE_BUCKET }}
          DISTRIBUTION: ${{ vars.STG_SITE_DISTRIBUTION_ID }}
        run: |
          pnpm install --frozen-lockfile --filter @app/site...
          .github/scripts/deploy-site.sh stg "$SITE_URL" "$APP_URL" "$BUCKET" "$DISTRIBUTION"
      - name: 疎通(スモークテスト。画面と、ALB の向こうの API)
        if: vars.STG_URL != ''
        env:
          URL: ${{ vars.STG_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$URL/readyz"
          # ログイン前なので 401 なら API まで届いている
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/me")" = "401"

  prod:
    name: prod に出す(承認のあと)
    needs: stg
    if: github.ref == 'refs/heads/main' && vars.AWS_PROD_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # 承認する人は、リポジトリの設定 → Environments → prod の「Required reviewers」で決める
    environment:
      name: prod
      url: ${{ vars.PROD_URL }}
    env:
      CLUSTER: ${{ vars.PROJECT || 'sfs' }}-prod
      IMAGE: ${{ needs.stg.outputs.image }}
      WEB_IMAGE: ${{ needs.stg.outputs.web_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 公開の前に決める物が残っていないか(仮決め・導入時に決める。pnpm decisions --adopt と /tailor で決める)
        run: node scripts/decisions.mjs --launch
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: 移行
        run: .github/scripts/run-migration.sh "$CLUSTER" "$CLUSTER-migrate" "$CLUSTER" "$IMAGE"
      - name: いまのタスク定義を取る(API と画面)
        run: |
          aws ecs describe-task-definition --task-definition "$CLUSTER" \
            --query taskDefinition > task-definition.json
          aws ecs describe-task-definition --task-definition "$CLUSTER-web" \
            --query taskDefinition > web-task-definition.json
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: task-definition.json
          container-name: api
          image: ${{ env.IMAGE }}
          # Sentry で「この版から増えた」が分かるように(docs/guides/monitoring.md)
          environment-variables: SENTRY_RELEASE=${{ github.sha }}
      - name: API を blue/green で出す(アラームが鳴れば自動で戻る)
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 45
      - id: render_web
        uses: aws-actions/amazon-ecs-render-task-definition@8d79160660ad39c402a16e5fc7cd2a32e8f7d6b7 # v1.9.1
        with:
          task-definition: web-task-definition.json
          container-name: web
          image: ${{ env.WEB_IMAGE }}
          # Sentry で「この版から増えた」が分かるように(docs/guides/monitoring.md)
          environment-variables: SENTRY_RELEASE=${{ github.sha }}
      - name: 画面(SSR)を blue/green で出す(アラームが鳴れば自動で戻る)
        uses: aws-actions/amazon-ecs-deploy-task-definition@a00d4d57ac0de1a99b39fe469f3d898d38717c2b # v2.6.4
        with:
          task-definition: ${{ steps.render_web.outputs.task-definition }}
          cluster: ${{ env.CLUSTER }}
          service: ${{ env.CLUSTER }}-web
          wait-for-service-stability: true
          wait-for-minutes: 45
      # 公開の LP(apps/site)。置き場所(Terraform の public_site_domain)と変数が無ければ飛ばす
      - if: vars.PROD_SITE_BUCKET != '' && vars.PROD_SITE_DISTRIBUTION_ID != '' && vars.PROD_SITE_URL != '' && vars.PROD_URL != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: vars.PROD_SITE_BUCKET != '' && vars.PROD_SITE_DISTRIBUTION_ID != '' && vars.PROD_SITE_URL != '' && vars.PROD_URL != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # 出荷のジョブはキャッシュを使わない(PR が汚したキャッシュを本番に持ち込まない)
          package-manager-cache: false
      - name: 公開の LP をビルドして置く(静的なファイルだけ。docs/guides/landing-page.md)
        if: vars.PROD_SITE_BUCKET != '' && vars.PROD_SITE_DISTRIBUTION_ID != '' && vars.PROD_SITE_URL != '' && vars.PROD_URL != ''
        env:
          SITE_URL: ${{ vars.PROD_SITE_URL }}
          APP_URL: ${{ vars.PROD_URL }}
          BUCKET: ${{ vars.PROD_SITE_BUCKET }}
          DISTRIBUTION: ${{ vars.PROD_SITE_DISTRIBUTION_ID }}
        run: |
          pnpm install --frozen-lockfile --filter @app/site...
          .github/scripts/deploy-site.sh prod "$SITE_URL" "$APP_URL" "$BUCKET" "$DISTRIBUTION"
      - name: 疎通(スモークテスト。画面と、ALB の向こうの API)
        if: vars.PROD_URL != ''
        env:
          URL: ${{ vars.PROD_URL }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "$URL/readyz"
          # ログイン前なので 401 なら API まで届いている
          test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/me")" = "401"
