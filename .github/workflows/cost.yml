# 費用のページ: AWS(stg・dev・prod の Cost Explorer)・GitHub Actions の分数・SaaS と AI の席などの月額(手で書く)を集め、
# 何にいくら(動いている物ごと・環境・賭け)と、見積もり(段階の表)との比べを、静的な HTML の1枚にして、非公開の S3 に置く。
# 金額と中身はログに出さない(名前と件数だけ。公開のリポジトリでは誰でもログを読める)。成果物は非公開のリポジトリのときだけ。
# 決まりは docs/designs/0019-evidence-soa-and-cost.md・手引きは docs/guides/cost-dashboard.md・ADR 0032
#
# 要るもの(Terraform の出力。docs/guides/cost-dashboard.md の 2.):
#   非公開の入力(任意): s3://<COST_BUCKET>/cost/inputs/ の rates.json・time.csv・revenue.csv(人の時給・時間の手入力・売上。仕様 0020)
#   変数 AWS_PROD_COST_ROLE_ARN・COST_BUCKET(prod の出力 cost_bucket)。あれば AWS_STG_COST_ROLE_ARN・AWS_DEV_COST_ROLE_ARN
#   役割はどれも main のコードからだけ引ける(PR の版は書き換えられるので、請求の詳細を読ませない)
# 無ければ、失敗せずに飛ばす。
# 費用: Cost Explorer が1回 $0.01 × 1アカウント6回 = 1日 最大 $0.18(3アカウント)+分数 1〜2分。
name: Cost

# いまは手動だけ(Actions → Cost → Run workflow)。お金がかかる(Cost Explorer)ので、毎日にするのは人(docs/guides/automation.md)。
on:
  workflow_dispatch:
  # 有効にする日: ここに日付を入れてください(YYYY-MM-DD)
  # 有効にすると、毎日 日本時間 7:00 に作り直す(1日 最大 約27円)。
  # schedule:
  #   - cron: "0 22 * * *" # 日本時間 7:00

permissions:
  contents: read

concurrency:
  group: cost
  cancel-in-progress: false

jobs:
  page:
    name: 費用を集めてページを作る
    # 定期で動くのは、キットから作ったリポジトリ(KIT_ROLE=product)だけ。置き場の変数が無ければ飛ばす
    if: (github.event_name != 'schedule' || vars.KIT_ROLE == 'product') && vars.AWS_PROD_COST_ROLE_ARN != '' && vars.COST_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AWS の外(Actions の分数・SaaS と AI の席など・見積もり・PR からの人の時間)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKUP_READ_TOKEN: ${{ secrets.CHECKUP_TOKEN }}
        run: pnpm cost --out "$RUNNER_TEMP/cost" --only github,saas,people
      - if: vars.AWS_STG_COST_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_STG_COST_ROLE_ARN }}
          aws-region: ap-northeast-1
          unset-current-credentials: true
      - if: vars.AWS_STG_COST_ROLE_ARN != ''
        run: pnpm cost --out "$RUNNER_TEMP/cost" --account stg
      - if: vars.AWS_DEV_COST_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_COST_ROLE_ARN }}
          aws-region: ap-northeast-1
          unset-current-credentials: true
      - if: vars.AWS_DEV_COST_ROLE_ARN != ''
        run: pnpm cost --out "$RUNNER_TEMP/cost" --account dev
      # prod は最後(このあと置き場に書くのも prod の役割)
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_COST_ROLE_ARN }}
          aws-region: ap-northeast-1
          unset-current-credentials: true
      - run: pnpm cost --out "$RUNNER_TEMP/cost" --account prod
      # 時給・時間の手入力・売上は非公開の置き場にだけある(人が置く。docs/guides/cost-dashboard.md の 6.)。無くてもページは作る
      - name: 非公開の入力を落とす(cost/inputs/)
        env:
          BUCKET: ${{ vars.COST_BUCKET }}
        run: aws s3 cp --recursive --only-show-errors "s3://$BUCKET/cost/inputs/" "$RUNNER_TEMP/inputs/"
      - name: ページと ledger.csv を作る
        run: pnpm cost --render "$RUNNER_TEMP/cost" --inputs "$RUNNER_TEMP/inputs"
      # 賭けの予算の枠(非公開の budgets.csv)の注意の線を超える見込みなら知らせる。出すのは賭けの ID と割合だけ(金額は出さない)。
      # 要約は非公開のリポジトリのときだけ(公開のリポジトリでは誰でも読める)。Slack は秘密 SLACK_WEBHOOK_URL があるときだけ(点検と同じ)
      - name: 予算の枠の知らせ
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          alerts=$(pnpm --silent cost --budget-alerts "$RUNNER_TEMP/cost")
          if [ -z "$alerts" ]; then exit 0; fi
          if [ "$PRIVATE" = "true" ]; then printf '%s\n' "$alerts" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            jq -n --arg text "$alerts" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" > /dev/null
          fi
      - name: 非公開の置き場に置く(cost/<年-月>/ と cost/latest/index.html)
        env:
          BUCKET: ${{ vars.COST_BUCKET }}
        run: |
          set -euo pipefail
          month=$(TZ=Asia/Tokyo date +%Y-%m)
          aws s3 cp --recursive --only-show-errors "$RUNNER_TEMP/cost" "s3://$BUCKET/cost/$month/"
          aws s3 cp --only-show-errors --content-type "text/html; charset=utf-8" "$RUNNER_TEMP/cost/index.html" "s3://$BUCKET/cost/latest/index.html"
          echo "cost/latest/index.html を作り直しました(見方: docs/guides/cost-dashboard.md の 3.)" >> "$GITHUB_STEP_SUMMARY"
      # 公開のリポジトリでは成果物を誰でも落とせるので、非公開のときだけ
      - if: github.event.repository.private
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost
          path: ${{ runner.temp }}/cost/index.html
          retention-days: 7
