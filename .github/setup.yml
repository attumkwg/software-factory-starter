# GitHub の設定のあるべき形(ここが正)。使い始める前に一括で整える:
#   pnpm setup:github           今の設定との差分だけを出す(書かない)
#   pnpm setup:github --apply   差分を反映する(何度流しても同じ。リポジトリの管理者の gh のログインで)
#   pnpm setup:check            GitHub を読まずに、ここ・labels.yml とコードのずれを見る(CI)
# ラベルは .github/labels.yml。決まりは docs/designs/0014-setup-before-use.md・手順は docs/guides/github-setup.md
# ここを直した PR をマージしたら、pnpm setup:github --apply を流す(Actions には設定を書く権限を持たせない)。

version: 1

# ひな形のリポジトリ。同じ名前なら変数 KIT_ROLE=template(定期の運用を止める)、違えば product(運用を始める)
template_repository: attumkwg/software-factory-starter

# ひな形でも定期で動いてよいワークフロー(ファイル名と理由)。ここに無い定期の物は KIT_ROLE の見分けが要る
template_schedules:
  - file: vuln-scan.yml
    why: キットの依存と Action の新しい穴を、コードが動いていない間も毎週見る(落ちたら Issue → /cve)。持ち主が承認(設計書 0014 の U-1)

# リポジトリの設定(Settings → General)
repository:
  allow_merge_commit: false # 直線の履歴なので、マージのコミットは使えない(ボタンで迷わない)
  allow_squash_merge: true
  allow_rebase_merge: true
  allow_auto_merge: true # 必須のチェックが緑になったらマージ(付けるのは人)
  delete_branch_on_merge: true
  allow_update_branch: true # 「Update branch」のボタン(最新に追いついてから、と組む)

# 守りの機能(Settings → Advanced Security)。public_only は公開のリポジトリだけ(非公開は有料)
security:
  secret_scanning: true # public_only
  push_protection: true # public_only(秘密を含む push をその場で止める)
  private_vulnerability_reporting: true # public_only(外の人が非公開で穴を知らせる)
  dependabot_alerts: true
  dependabot_security_updates: false # 直す PR は Renovate が出す

# Actions の設定(Settings → Actions → General)
actions:
  default_workflow_permissions: read # 書き込みが要るワークフローは、ファイルの中で permissions を1つずつ
  can_approve_pull_request_reviews: false # AI や Actions が自分の PR を承認できない
  sha_pinning_required: true # SHA で固定した Action だけ
  fork_pr_approval: all_external_contributors # 外の人の PR の実行は毎回人が見てから
  retention_days: 7 # 成果物とログ(ZAP のレポートにはリクエストの中身が入りうる)

# main のルールセット(Settings → Rules → Rulesets)。例外(Bypass list)は置かない
ruleset:
  name: main
  # 🧍 1人の間は 0(自分の PR は自分で承認できず、AI の PR も自分のアカウントで出る)。
  # 👥 人が増えたら 1・require_code_owner_review: true にして流し直す(危険度「高」を2人にするなら 2)
  required_approvals: 0
  require_code_owner_review: false
  dismiss_stale_reviews: true
  allowed_merge_methods: [squash, rebase]
  linear_history: true
  block_deletion: true
  block_force_push: true
  strict: true # 最新の main に追いついてから(並べた PR が合わさって main を赤くするのを防ぐ)
  # 必須のチェック(ジョブの name。GitHub Actions からの物だけ通す)。名前がジョブに無いと pnpm setup:check が落ちる
  required_checks:
    - Biome・型・単体
    - 結合(Postgres・RLS・2社・権限の表 ②)
    - API の互換(oasdiff。項目は足すだけ)
    - 移行の検査(squawk)
    - E2E(docker compose+Playwright)
    - 秘密情報(gitleaks)
    - コードの検査(Semgrep CE+自社ルール)
    - 依存と設定(Trivy fs / config)
    - イメージのビルドと検査(Trivy image・api)
    - イメージのビルドと検査(Trivy image・web)
    - イメージのビルドと検査(Trivy image・mail)
    - ワークフローの検査(actionlint・zizmor)
    - 取り組みと作業の種類(PR の本文) # マージキューを使うなら外す(キューの中では流れない)
    - 見た目の比べ(VRT) # 見た目を変える PR は、基準を撮り直すまで止まる(docs/guides/vrt.md)

# Environments(Settings → Environments)。どれも main からだけ使える(ブランチのワークフローは書き換えられるので GitHub の側で止める)
environments:
  - name: stg
    branches: [main]
  - name: prod
    branches: [main]
    # 🧍 1人の間は自分(@me = 打った人)・自分の承認を許す。👥 人が増えたら2人以上にして prevent_self_review: true
    reviewers: ["@me"]
    prevent_self_review: false
  - name: claude
    branches: [main]
    secrets: [ANTHROPIC_API_KEY] # claude.yml(@claude)を使うなら
  - name: zap
    branches: [main]
    secrets: [ZAP_SCAN_USERNAME, ZAP_SCAN_PASSWORD] # zap-api-scan.yml を使うなら
  - name: cost
    branches: [main]
    # cost.yml(費用のページ)。AWS の役割 …-cost はこの Environment からだけ引ける。
    # 管理用の鍵は任意(入れれば AI の費用も自動で取る。強い鍵なので、入れるかは設計書 0019 の U-4)
    secrets: [ANTHROPIC_ADMIN_KEY]

# リポジトリの秘密(名前だけ確かめる。値は人が画面で入れる)。product のリポジトリでだけ聞く
secrets:
  - name: CHECKUP_TOKEN
    why: 点検(checkup.yml)がブランチ保護などを読む。読むだけの細かい権限のトークン。無ければその項目は「確かめられなかった」
  - name: SLACK_WEBHOOK_URL
    why: 点検の要約を Slack にも送る
