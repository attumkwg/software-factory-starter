# DB の表の説明書(docs/db/)を、動いている DB から作る。手動で回す: pnpm docs:db
# 先に docker compose up -d(DB と移行)を済ませておく。CI には入れていない。
# 中身(どの表が何か)の正は docs/domain/。ここには短い説明と、そこへの道しるべだけを書く。
dsn: postgres://app_owner:app_owner@db:5432/app?sslmode=disable
docPath: docs/db
format:
  adjust: true
er:
  format: svg
exclude:
  - drizzle.__drizzle_migrations
  - drizzle.concurrent_migrations
comments:
  - table: organizations.tenants
    tableComment: 組織(テナント)。tenant_id がこのシステムでの会社の単位。docs/domain/organizations
    columnComments:
      time_zone: 時刻を見せる時間帯・「1日」の区切り(IANA の名前。ADR 0005)
      mfa_required: 全員に二段階認証を必須にするか(管理者が入れ・切る。運営の組織は最初から true で切れない)
      task_completed_mail: タスクが完了したメールを送るか(管理者が止め・戻す。送る直前に読む。docs/specs/0093-task-mail-switch.md)
  - table: organizations.users
    tableComment: 組織への所属(名前とロール admin / member / viewer)。同じ人が複数の組織に所属できる(ADR 0066)。docs/domain/organizations
    columnComments:
      external_id: 認証の製品(Cognito)側の ID(sub)。同じ人の所属は同じ sub
      role: admin / member / viewer
      mfa_enabled: 二段階認証が有効か(正は Cognito。ログインと確かめ直しのたびに、全部の所属に写し直す)
      sessions_valid_after: これより前にログインしたセッションは使えない(パスワードなどを変えて、ほかの端末を切った時刻。全部の所属にそろえる)
      last_used_at: その組織に最後に入った(ログイン・組織の切り替え)時刻。ログインで前回の組織を選ぶ
      sso_exempt: SSO を必須にした組織の緊急用のアカウント(パスワード+二段階認証で入れる管理者。1組織 2人まで。管理者のときだけ効く)
      disabled_at: SCIM(情シスの道具)で止めた時刻。止めた人は関所もログインも通らない(行と監査ログは残す)
      scim_external_id: 情シスの道具の側の人の ID(SCIM の externalId)
  - table: projects.projects
    tableComment: プロジェクト。タスクのまとまり。docs/domain/projects
    columnComments:
      created_by: 作った人(同じ組織の users)
  - table: tasks.tasks
    tableComment: タスク。プロジェクトの中のやること。docs/domain/tasks
    columnComments:
      done: 完了したか
  - table: files.files
    tableComment: 写真・ファイルの目録(中身は置き場の S3)。docs/domain/files
    columnComments:
      uploaded_by: 上げた人(同じ組織の users。外部キーは張らない)
      status: pending(上げる準備)/ ready(確かめて書き直した)/ rejected(断った)
  - table: platform.outbox
    tableComment: 送信待ち(アウトボックス)。業務の変更と同じトランザクションで積み、送り出しが後で送る。アプリは書くだけ。docs/adr/0006-outbox.md
    columnComments:
      topic: 何が起きたか(領域.出来事。src/outbox/topics.ts)
      locked_until: 送り出しが借りている期限
      dead_at: あきらめた時刻(人が見て直す)
  - table: platform.feature_flags
    tableComment: 組織ごとの機能フラグ(行がある = その組織に機能を入れた)。定義は @app/shared の FEATURE_FLAGS。アプリは読むだけで、入れる・切るのは運営のコマンド feature-flag。docs/specs/0012-feature-flags-and-usage.md
    columnComments:
      flag: 機能の名前(FEATURE_FLAGS の name。一度使った名前は使い回さない)
      enabled_at: 入れた時刻
  - table: platform.feature_usage
    tableComment: 利用の記録(この人がこの日にこの機能を使った。1日1人1機能1行)。中身・時刻・URL・IP は持たない。アプリは読む・足すだけ。400日で運営のコマンド usage-purge が消す。docs/specs/0012-feature-flags-and-usage.md
    columnComments:
      feature: 機能の名前(FEATURE_FLAGS の name)
      day: 使った日(組織の時間帯での日付)
  - table: platform.pmf_survey_asked
    tableComment: 「無くなったら困るか」をこの回(四半期)に答え終えた人の印(1人1回にするため)。**答えは持たない**。アプリは読む・足すだけ。400日で運営のコマンド pmf-survey-purge が消す。docs/specs/0046-pmf-survey.md
    columnComments:
      round: 聞いた回(「2026-Q4」の形。組織の時間帯の四半期)
      day: 答えた日(組織の時間帯での日付)
  - table: platform.pmf_survey_counts
    tableComment: 「無くなったら困るか」の答えの数(組織・回・答えごと)。**人の ID も時刻も持たない**(だれが何と答えたかを結びつけない)。アプリは読む・足す・数を増やすだけ。docs/specs/0046-pmf-survey.md
    columnComments:
      answer: 答えの種類(@app/shared の PMF_SURVEY_ANSWERS)
      count: その答えの数
  - table: sensitive.tenant_keys
    tableComment: 組織ごとのデータ鍵(要配慮個人情報を暗号化する鍵。KMS で包んだ物だけ)。読めるのはロール app_sensitive だけ(app_rw はスキーマに入れない)。行を消すとその組織の要配慮の暗号文は読めない。docs/adr/0029-sensitive-data-tier1.md
    columnComments:
      kms_key_id: 包んだ KMS の鍵の ARN(手元は local)
      wrapped_key: KMS で包んだデータ鍵(base64)
  - table: legal.consents
    tableComment: 利用規約・プライバシーポリシーへの同意の記録(足すだけ。アプリは読む・足すだけ)。版の一覧は @app/shared の LEGAL_VERSIONS。docs/specs/0009-legal-consent.md
    columnComments:
      document: terms / privacy
      version: 文書ごとの版(1, 2, 3 …)
      capacity: organization(利用規約を管理者が。契約者として)/ individual(本人として)
      source: どの画面から(sign_up = 登録 / acceptance = 同意の画面)
      accepted_at: 同意した時刻(同じ版への2回目は記録しない)
  - table: legal.notices
    tableComment: 規約の変更のお知らせのメールを送ると決めた記録(運営のコマンド legal-notify が足す)。周知の証拠と、2回送らない守り。docs/runbooks/legal-notice.md
    columnComments:
      created_at: 送ると決めた時刻(Postfix に渡した時刻は platform.outbox の sent_at)
  - table: growth.pre_registrations
    tableComment: 公開の LP の事前登録(運営の組織の持ち物)。確認待ち → 確認済み → 組織にした。消す日を過ぎたら pre-registrations-purge が消す。docs/domain/growth
    columnComments:
      confirm_sent_at: 確認のメールを積んだ時刻(同じアドレスへは24時間に1通。確認のリンクの署名はこの時刻から作る)
      delete_after: この日を過ぎたら消す(確認待ち7日・確認済みは登録から1年・組織にしてから30日)
  - table: growth.lp_daily_counts
    tableComment: 公開の LP の日ごと・ページ・来た所(UTM)ごとの見た数・登録・確認(個人の行は持たない。3年で消す)。docs/domain/growth
  - table: organizations.email_changes
    tableComment: 本人のメールアドレスの変更の申し込み。生きているのは本人の最新・未確認・24時間以内の1件。docs/specs/0006-account-security.md
    columnComments:
      previous_email: 申し込んだときのアドレス(変わったら、ここへお知らせを送る)
      confirmed_at: 確認コードで変わった時刻
  - table: organizations.support_grants
    tableComment: サポートへの許可(管理者が期限つきで出す)。番号は持たない。社員は support_find_grant 関数で番号のハッシュから探す。docs/specs/0004-support-access.md
    columnComments:
      code_hash: サポート番号の SHA-256(番号そのものは保存しない)
      revoked_at: 取り消した時刻(入っている社員も次のリクエストから入れない)
  - table: organizations.domains
    tableComment: 組織が登録した会社のドメイン(docs/specs/0056-sso-scim-ip-audit-export.md・ADR 0067)。DNS の TXT で確かめた物だけを SSO に使う。確かめたドメインは全体で1つの組織だけ(domains_verified_domain_key)
    columnComments:
      verify_token: DNS の TXT(_sfs-verify.<ドメイン>)に置く確かめの文字。公開の DNS に出るので秘密ではない
      verified_at: DNS で確かめた時刻(アプリが書けるのはこの列だけ)
  - table: organizations.sso_connections
    tableComment: 組織につないだ SAML の IdP(docs/specs/0056-sso-scim-ip-audit-export.md・ADR 0067)。1組織に1つ・1つの IdP は1つの組織だけ。行を足す・消すのは運営のコマンド sso-connect(表の持ち主)。アプリは必須の入切だけ
    columnComments:
      provider_name: Cognito の IdP の名前(org-<組織の ID の後ろ 20 桁>)。SSO で戻ってきた人の組織は、この名前で決まる
      required: SSO を必須にしているか(管理者が入切。緊急用の管理者が1人以上要る)
  - table: organizations.scim_tokens
    tableComment: SCIM の鍵(docs/specs/0056-sso-scim-ip-audit-export.md の段2)。情シスの道具が人を作る・止めるのに使う。鍵そのものは持たない(SHA-256 だけ)。鍵から組織を引くのは auth_find_scim_token 関数だけ。生きている鍵は1組織 2つまで
    columnComments:
      token_hash: 鍵の SHA-256(16進)。全体で一意
      last_used_at: 情シスの道具が最後に使った時刻
      revoked_at: 取り消した時刻(戻らない。取り消した鍵は 401)
  - table: organizations.ip_allowlist
    tableComment: 組織に入れる IP の範囲(docs/specs/0056-sso-scim-ip-audit-export.md)。空なら制限しない。管理者が一覧ごと入れ替える(20 まで)。プランの機能 ip-allowlist が入っているときだけ効く
    columnComments:
      cidr: IP の範囲(203.0.113.0/24・2001:db8::/32 の形)
  - table: organizations.invitations
    tableComment: 管理者が出した招待(docs/specs/0027-invitations.md・ADR 0040)。リンクの札は持たない(招待の ID とサーバーの秘密の署名)。受けるのは auth_accept_invitation 関数だけ(1回きり)
    columnComments:
      expires_at: リンクの期限(作ってから7日)
      accepted_at: 受けた時刻(入ったら、もう使えない)
      accepted_user_id: 受けてできた users の行
      revoked_at: 取り消した時刻(リンクはすぐ使えなくなる)
  - table: platform.tenant_plans
    tableComment: 組織の契約のプラン(docs/specs/0047-plans.md・ADR 0058)。足すだけ。いまの行は effective_on が今日までで一番新しい行。書くのは運営のコマンド plan・create-tenant だけ。金額は持たない
    columnComments:
      plan: "@app/shared の PLANS の id"
      price_list: どの版の価格表で契約しているか(PRICE_LISTS の id)
      seats: 人数の上限(NULL は上限なし)
      price_locked_until: 据え置き(この価格表のまま)の期限
      effective_on: 効き始めの日(組織の時間帯)
  - table: organizations.support_sessions
    tableComment: 社員の代理ログインの入室(閲覧者・最長1時間)。認可の関所が毎回、終わっていない・期限内・許可が生きているかを確かめる
    columnComments:
      staff_user_id: 社員(運営の組織の users。別の組織なので外部キーは無い)
      ended_at: 終えた時刻(自分で終えた・ログアウト・許可の取り消し)
  - table: platform.audit_events
    tableComment: 監査ログ(誰が・いつ・何をしたか)。足すだけで直せない・消せない(トリガー)。値は入れない。docs/specs/0003-audit-log.md・ADR 0013
    columnComments:
      actor_kind: user = 自社の人 / support = 代理ログインの社員 / system = 仕組み
      action: 何をしたか(対象.動作。apps/api/src/audit/actions.ts)
      outcome: allowed = できた / denied = 権限が無くて断った
      details: 直した項目の名前など(値は入れない)
