# DB の表の説明書(docs/db/)を、動いている DB から作る。手動で回す: pnpm docs:db
# 先に docker compose up -d(DB と移行)を済ませておく。CI には入れていない。
# 中身(どの表が何か)の正は docs/domain/。ここには短い説明と、そこへの道しるべだけを書く。
dsn: postgres://app_owner:app_owner@db:5432/app?sslmode=disable
docPath: docs/db
format:
  adjust: true
er:
  format: svg
exclude:
  - drizzle.__drizzle_migrations
  - drizzle.concurrent_migrations
comments:
  - table: organizations.tenants
    tableComment: 組織(テナント)。tenant_id がこのシステムでの会社の単位。docs/domain/organizations
    columnComments:
      time_zone: 時刻を見せる時間帯・「1日」の区切り(IANA の名前。ADR 0005)
      mfa_required: 全員に二段階認証を必須にするか(管理者が入れ・切る。運営の組織は最初から true で切れない)
  - table: organizations.users
    tableComment: 組織の中の人とロール(admin / member / viewer)。いまは1人=1組織。docs/domain/organizations
    columnComments:
      external_id: 認証の製品(Cognito)側の ID(sub)
      role: admin / member / viewer
      mfa_enabled: 二段階認証が有効か(正は Cognito。ログインと確かめ直しのたびに写し直す)
      sessions_valid_after: これより前にログインしたセッションは使えない(パスワードなどを変えて、ほかの端末を切った時刻)
  - table: projects.projects
    tableComment: プロジェクト。タスクのまとまり。docs/domain/projects
    columnComments:
      created_by: 作った人(同じ組織の users)
  - table: tasks.tasks
    tableComment: タスク。プロジェクトの中のやること。docs/domain/tasks
    columnComments:
      done: 完了したか
  - table: platform.outbox
    tableComment: 送信待ち(アウトボックス)。業務の変更と同じトランザクションで積み、送り出しが後で送る。アプリは書くだけ。docs/adr/0006-outbox.md
    columnComments:
      topic: 何が起きたか(領域.出来事。src/outbox/topics.ts)
      locked_until: 送り出しが借りている期限
      dead_at: あきらめた時刻(人が見て直す)
  - table: organizations.email_changes
    tableComment: 本人のメールアドレスの変更の申し込み。生きているのは本人の最新・未確認・24時間以内の1件。docs/specs/0006-account-security.md
    columnComments:
      previous_email: 申し込んだときのアドレス(変わったら、ここへお知らせを送る)
      confirmed_at: 確認コードで変わった時刻
  - table: organizations.support_grants
    tableComment: サポートへの許可(管理者が期限つきで出す)。番号は持たない。社員は support_find_grant 関数で番号のハッシュから探す。docs/specs/0004-support-access.md
    columnComments:
      code_hash: サポート番号の SHA-256(番号そのものは保存しない)
      revoked_at: 取り消した時刻(入っている社員も次のリクエストから入れない)
  - table: organizations.support_sessions
    tableComment: 社員の代理ログインの入室(閲覧者・最長1時間)。認可の関所が毎回、終わっていない・期限内・許可が生きているかを確かめる
    columnComments:
      staff_user_id: 社員(運営の組織の users。別の組織なので外部キーは無い)
      ended_at: 終えた時刻(自分で終えた・ログアウト・許可の取り消し)
  - table: platform.audit_events
    tableComment: 監査ログ(誰が・いつ・何をしたか)。足すだけで直せない・消せない(トリガー)。値は入れない。docs/specs/0003-audit-log.md・ADR 0013
    columnComments:
      actor_kind: user = 自社の人 / support = 代理ログインの社員 / system = 仕組み
      action: 何をしたか(対象.動作。apps/api/src/audit/actions.ts)
      outcome: allowed = できた / denied = 権限が無くて断った
      details: 直した項目の名前など(値は入れない)
