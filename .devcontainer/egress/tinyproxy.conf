# 許可リストのプロキシ(docs/designs/0057-ai-egress.md の 5 ①)。宛先の名前で許す・記録を残す。
# 受けるのはこのコンテナと、中の Docker の網からだけ。外へ出られるのは、このプロキシ(利用者 tinyproxy)だけ(egress-up.sh の firewall)。
User tinyproxy
Group tinyproxy
Port 3128
Listen 0.0.0.0
Timeout 600
MaxClients 100
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"

Allow 127.0.0.1
Allow 172.16.0.0/12
Allow 192.168.0.0/16
Allow 10.0.0.0/8

# 許可リストに無い宛先は止める(宛先の名前で決める。URL の中身は見ない)
Filter "/etc/tinyproxy/filter"
FilterType fnmatch
FilterDefaultDeny Yes
FilterURLs Off
FilterCaseSensitive Off

ConnectPort 443
ConnectPort 80
