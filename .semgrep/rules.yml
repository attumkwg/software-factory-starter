# 自社専用の検査ルール(docs/security.md の D-3)。見つかった穴は「テスト+ルール」にして二度と出さない。
# 手元: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config .semgrep --error
rules:
  - id: tenant-scoped-db-only
    message: >-
      ルートとリポジトリは、テナントの文脈つきのトランザクション(c.var.tx / scopeOf(c))だけを使う。
      接続プール(RootDb・pg)を直接使うと RLS の文脈が無く、他社の行に触れうる。
      ADR 0001 / apps/api/CLAUDE.md
    severity: ERROR
    languages: [typescript]
    paths:
      include:
        # 領域の中(ルートとリポジトリ)。ADR 0004
        - "/apps/api/src/domains/"
    pattern-either:
      # pg と db/client(接続プール)を読み込むこと自体を止める(型だけの import type はよい)
      - pattern-regex: (?m)^import\s+(?!type\s)[^;]*?from\s+["'](pg|(\.\.?/)+db/client(\.ts)?)["']
      - pattern: createDb(...)
      - pattern: withTenant(...)
      - pattern: new Pool(...)

  - id: no-raw-sql
    message: sql.raw は SQL インジェクションの元。drizzle のクエリか sql`...` の埋め込み(パラメータになる)を使う。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/"]
    pattern: sql.raw(...)

  - id: no-whole-object-logging
    message: >-
      ログにオブジェクトを丸ごと渡さない(個人情報・秘密が混ざる)。
      必要な項目だけを logger.info({ userId: user.id }, "...") の形で。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/"]
    patterns:
      - pattern-either:
          - pattern: $LOG.$LEVEL($OBJ)
          - pattern: $LOG.$LEVEL($OBJ, $MSG)
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(logger|log|deps\.logger|this\.logger|c\.var\.logger)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error|fatal)$
      # 名前(変数)や属性をそのまま渡したものだけを止める。{ ... } と文字列はよい。
      - metavariable-regex:
          metavariable: $OBJ
          regex: ^[A-Za-z_$][\w$]*(\.[A-Za-z_$][\w$]*)*$
      - metavariable-regex:
          metavariable: $OBJ
          regex: ^(?!(err|error|e|message|msg)$)

  # 丸ごと渡す以外の形で、個人情報がログに入るもの(2026-10-21 の点検。docs/specs/0008-personal-data.md の B)。
  # ログの部品(@app/logging)は許可リストで止めるが、名前を許可リストに足されたら素通りするので、書く所でも止める
  - id: no-spread-in-logging
    message: >-
      ログの項目に行やオブジェクトを広げて(...row)渡さない。中の項目(名前・題名・メール)が全部出る。
      要る ID だけを { taskId: row.id } の形で書く。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/", "/packages/"]
      # テストは、伏せられるかを確かめるために、わざと個人情報らしい値を渡す
      exclude: ["*.test.ts", "*.int.test.ts"]
    patterns:
      - pattern-either:
          - pattern: "$LOG.$LEVEL({..., ...$X, ...}, ...)"
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(logger|log|deps\.logger|this\.logger|this\.#deps\.logger|opts\.logger|c\.var\.logger)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error|fatal)$

  - id: no-personal-field-logging
    message: >-
      ログに個人情報の項目(名前・メール・題名など。列の分類表 apps/api/src/db/classification.ts の personal / sensitive)を渡さない。
      渡すのは ID と数だけ(例 { taskId: task.id })。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/", "/packages/"]
      # テストは、伏せられるかを確かめるために、わざと個人情報らしい値を渡す
      exclude: ["*.test.ts", "*.int.test.ts"]
    patterns:
      - pattern-either:
          # 名前が個人情報(previousEmail・staff_name なども)
          - patterns:
              - pattern: "$LOG.$LEVEL({..., $K: $V, ...}, ...)"
              - metavariable-regex:
                  metavariable: $K
                  # hasVerifiedEmail などの「has / is で始まる真偽」はよい
                  regex: (?i)^(?!has|is).*(name|e_?mail|title|phone|tel|address|birth|body|content|password|token)
          # 値が個人情報の属性(body.title・user.email など)
          - patterns:
              - pattern: "$LOG.$LEVEL({..., $K: $V, ...}, ...)"
              - metavariable-regex:
                  metavariable: $V
                  regex: (?i).*\.(name|\w*e_?mail|title|phone|address|body|content|password|\w*token)$
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(logger|log|deps\.logger|this\.logger|this\.#deps\.logger|opts\.logger|c\.var\.logger)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error|fatal)$

  - id: no-template-in-log-message
    message: >-
      ログの文に値を埋め込まない(`${...}`)。文はコードに書いた固定の文にし、ID は { taskId } の項目で渡す。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/", "/packages/"]
      # テストは、伏せられるかを確かめるために、わざと個人情報らしい値を渡す
      exclude: ["*.test.ts", "*.int.test.ts"]
    patterns:
      - pattern-either:
          - pattern: "$LOG.$LEVEL(`...${$X}...`)"
          - pattern: "$LOG.$LEVEL($O, `...${$X}...`)"
      - metavariable-regex:
          metavariable: $LOG
          regex: (?i)^(logger|log|deps\.logger|this\.logger|this\.#deps\.logger|opts\.logger|c\.var\.logger)$
      - metavariable-regex:
          metavariable: $LEVEL
          regex: ^(trace|debug|info|warn|error|fatal)$

  - id: tenant-from-request
    message: >-
      テナントをリクエストの値(ヘッダー・URL・本文)から決めない。テナントはセッションから
      (c.var.actor.tenantId / scopeOf(c))。docs/security.md の T-1
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/api/src/"]
    patterns:
      - pattern-either:
          - pattern: const $T = $C.req.$M(...)
          - pattern: const $T = $C.req.$M(...).$F
          - pattern: const { $T } = $C.req.$M(...)
      - metavariable-regex:
          metavariable: $T
          regex: (?i)tenant

  - id: request-body-must-use-jsonbody
    message: >-
      API の本文は http/common.ts の jsonBody(schema) で書く(本文が必須になる)。
      body: { content: ... } と直接書くと、本文が無いリクエストが検証を素通りし、空のまま処理が進む
      (Schemathesis が見つけた 500。test/integration/input-validation.int.test.ts)。
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/api/src/"]
      exclude: ["/apps/api/src/http/common.ts"]
    pattern-regex: '\bbody:\s*\{\s*content:'

  - id: web-writes-through-use-action
    message: >-
      画面から API に書き込むとき(create・update・delete・logout)は useAction を通す(apps/web/src/use-action.ts)。
      直接 await すると、失敗したときに画面が黙る(利用者は成功したと思う・連打で二重に送る・ログインが切れても気づかない)。
      docs/guides/error-handling.md
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/web/src/"]
    patterns:
      - pattern: api.$METHOD(...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(create|update|delete|logout)
      - pattern-not-inside: $ACTION.run(...)

  - id: no-float-money
    message: >-
      お金を普通の数(小数)で計算しない(0.1 + 0.2 が 0.30000000000000004 になる・丸め方が決まらない)。
      @app/shared の money.ts(multiply・sum・allocate・taxByRate)を使い、丸め方を必ず渡す。ADR 0005
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/", "/packages/"]
      exclude: ["/packages/shared/src/money.ts"]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $X * $N
              - pattern: $N * $X
              - pattern: $X / $N
          - metavariable-regex:
              metavariable: $X
              regex: (?i).*(price|amount|total|tax|fee|cost|subtotal|discount|金額|税).*
          - metavariable-regex:
              metavariable: $N
              regex: ^\d*\.\d+$
      - pattern: $V.toFixed(...)

  - id: no-local-time
    message: >-
      端末やサーバーの時間帯に頼った日時の扱いをしない(サーバーは UTC・利用者は日本とは限らない・SSR で表示がずれる)。
      日付は @app/shared の time.ts(toLocalDate・localDayRange)、表示は apps/web/src/format.ts に組織の時間帯を渡す。ADR 0005
    severity: ERROR
    languages: [typescript]
    paths:
      include: ["/apps/", "/packages/"]
      # テストは、伏せられるかを確かめるために、わざと個人情報らしい値を渡す
      exclude: ["*.test.ts", "*.int.test.ts"]
    pattern-either:
      # その場所の時計で年・月・日・時を読む / 書く
      - pattern-regex: \.(get|set)(FullYear|Month|Date|Day|Hours|Minutes)\(
      # 年月日の数から Date を作る(その場所の時計の時刻になる)。Date.UTC(...) はよい
      - pattern: new Date($Y, $M, ...)
      # 時間帯を渡さない表示
      - pattern: $D.toLocaleDateString()
      - pattern: $D.toLocaleDateString($L)
      - pattern: $D.toLocaleTimeString()
      - pattern: $D.toLocaleTimeString($L)
      - pattern: $D.toLocaleString()
      - pattern: $D.toLocaleString($L)
