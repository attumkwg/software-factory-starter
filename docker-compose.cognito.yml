# Cognito でのログインを手元で丸ごと試す(偽物の Cognito を使う。AWS は要らない)。
#   docker compose -f docker-compose.yml -f docker-compose.cognito.yml up --build -d
#   → http://localhost:8080 で、登録・確認コード・ログイン・二段階認証・パスワードの再設定
#     確認コードのメールは、本番と同じ Postfix を通って Mailpit(http://localhost:8025)に届く
#   E2E: E2E_AUTH=cognito pnpm test:e2e
# 普段の開発は docker-compose.yml だけ(開発用ログイン)でよい。ここにある値はすべて手元専用で、秘密ではない。
# 偽物が本物とずれていないかは、契約テスト(packages/fake-cognito/contract)が確かめる。

services:
  fake-cognito:
    image: software-factory-starter/fake-cognito:local
    build:
      context: .
      dockerfile: packages/fake-cognito/Dockerfile
    environment:
      FAKE_COGNITO_BASE_URL: http://fake-cognito:9231
      FAKE_COGNITO_USER_POOL_ID: local_fakepool
      FAKE_COGNITO_CLIENT_ID: local-web-client
      FAKE_COGNITO_SMTP_URL: smtp://postfix:25
      FAKE_COGNITO_MAIL_FROM: Tasks <no-reply@example.test>
    # 起動の間だけ1秒ごとに確かめる(docker-compose.yml の x-fast-start と同じ。ファイルをまたいでアンカーは使えない)
    healthcheck:
      start_period: 60s
      start_interval: 1s
    ports:
      # E2E が、テストの前に人を消す・二段階認証を設定するために直接つなぐ
      - "9231:9231"
    depends_on:
      postfix:
        condition: service_healthy

  api:
    environment:
      AUTH_MODE: cognito
      COGNITO_REGION: ap-northeast-1
      COGNITO_USER_POOL_ID: local_fakepool
      COGNITO_CLIENT_ID: local-web-client
      COGNITO_ENDPOINT: http://fake-cognito:9231
      APP_URL: http://localhost:8080
    depends_on:
      fake-cognito:
        condition: service_healthy
